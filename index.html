.lpk.done .lpk-bar i{background:var(--done)}
/* Folded blocks say what is inside */
.mod-title .msub{display:none}
.module.collapsed .mod-title{display:flex;flex-direction:column;line-height:1.25}
.module.collapsed .mod-title .mt1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.module.collapsed .mod-title .msub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.msub b{color:var(--text);font-weight:650}
.module.collapsed .mod-toggle .apn-tag,.module.collapsed .mod-toggle .fl-tag{display:none}
.msub .wxcat{display:inline-block;font-size:10px;padding:0 5px;line-height:1.5;vertical-align:1px}

/* Links shown as a tag in the text, or as an icon at the right */
a.rtag.rl{color:var(--accent);border-color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-weak);text-decoration:none;font-size:.76em;padding:1px 5px 1px 6px}
a.rtag.rl svg{width:.95em;height:.95em;vertical-align:-.12em;margin-left:2px;stroke-width:2.6}
.rgo-w{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:center;margin-left:8px}
.rgo{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-size:calc(13px*var(--ts));font-weight:700;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.rgo svg{width:17px;height:17px;stroke-width:2.4;flex:none}
.rgo:active{filter:brightness(.92)}
.ls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.ls-row .fl{margin:0}
.ls-hint{font-size:calc(13px*var(--ts));color:var(--muted);margin:6px 2px 0;line-height:1.35}

/* Photos */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.thumb{appearance:none;padding:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;overflow:hidden;height:calc(88px*var(--sp));min-width:calc(88px*var(--sp));max-width:176px;display:block;position:relative}
.thumb img{display:block;height:100%;width:auto;min-width:100%;max-width:176px;object-fit:cover}
.ed-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ed-thumbs:empty{display:none}
.ed-thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.ed-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ed-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding:0}
.ed-x svg{width:14px;height:14px;stroke-width:2.6}
.missing img{display:none}
.missing::after{content:"Photo missing";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(11px*var(--ts));color:var(--muted);text-align:center}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.985);opacity:0;transition:opacity .18s}
.lb[hidden]{display:none}
.lb.show{opacity:1}
.lb-stage{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 60px) 8px calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lb-img{flex:none;max-width:none;max-height:none;transform-origin:50% 50%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;visibility:hidden}
.lb-img.ready{visibility:visible}
.lb-btn{position:absolute;appearance:none;border:0;width:44px;height:44px;border-radius:999px;background:rgba(18,22,28,.74);box-shadow:0 0 0 1px rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb-btn svg{width:22px;height:22px;stroke-width:2.4}
.lb-btn[hidden]{display:none}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 8px);right:10px}
.lb-prev,.lb-next{top:50%;margin-top:-22px}
.lb-prev{left:8px}
.lb-next{right:8px}
.lb-count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:60px;right:60px;text-align:center;color:#fff;font-size:15px;font-weight:600;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lb-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

@media (max-width:380px){
  main{padding-left:8px;padding-right:8px}
  .module{margin:8px}
  .mod-body{padding:0 8px 8px}
  .list-title{font-size:calc(30px*var(--ts))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
/* Briefing: the LIDO package with NOTAMs, weather and SIGMETs */
.nt-pkg{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 13px;margin:0 0 10px}
.nt-pkg-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nt-pkg-t b{flex:1 1 auto;font-size:calc(16px*var(--ts));font-weight:700}
.nt-pkg-t span{font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600}
.nt-pkg small{display:block;margin-top:3px;font-size:calc(13px*var(--ts));color:var(--muted)}
.nt-pkg .lnkbtn{font-size:inherit}
.nt-other{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line-soft);font-size:calc(13.5px*var(--ts));color:var(--warn);font-weight:600}
.nt-tabs{display:flex;width:100%;margin:12px 0 4px}
.nt-tabs button{flex:1;min-width:0;padding:9px 2px!important;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden}
.nt-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--warn);color:var(--paper);font-size:11.5px;font-weight:800;font-style:normal;flex:none}
@media (max-width:400px){.nt-tabs button{font-size:calc(13.5px*var(--ts))!important;gap:3px}.nt-tabs .nt-badge{min-width:17px;height:17px;padding:0 4px;font-size:10.5px}}
.nt-sec{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin:16px 3px 7px}
.nt-sec b{font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nt-sec span{font-size:calc(12.5px*var(--ts));color:var(--muted);font-weight:600}
.nt-card{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 10px 10px 12px;margin:0 0 8px}
.nt-card.lv-mid,.nt-card.lv-low,.nt-card.lv-later,.nt-card.lv-none{border-left-color:var(--line-strong)}
.nt-card.read{border-left-color:var(--line)}
.nt-card.read .nt-main{opacity:.6}
.nt-main{flex:1;min-width:0;cursor:pointer}
.nt-top{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.nt-cat,.nt-why{font-size:11px;font-weight:750;letter-spacing:.03em;border-radius:5px;padding:1px 6px;text-transform:uppercase}
.nt-cat{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.nt-cat.rw{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.nt-cat.ap,.nt-cat.co{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.nt-why{color:var(--accent);border:1px solid var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.nt-head{font-size:calc(14.5px*var(--ts));font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.nt-card:not(.open) .nt-head{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt-when{font-size:calc(12.5px*var(--ts));color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.nt-id{font-family:ui-monospace,Menlo,monospace;font-size:.96em}
.nt-body{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);font:calc(13px*var(--ts))/1.45 ui-monospace,"SF Mono",Menlo,monospace;overflow-wrap:anywhere}
.nt-body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt-sch{font-weight:700;margin-bottom:4px}
.hw{color:var(--warn);font-weight:750}
.hr{color:var(--accent);font-weight:750}
.nt-tick{appearance:none;flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--box);background:none;display:grid;place-items:center;color:var(--on-done);padding:0;margin-top:1px}
.nt-card.read .nt-tick{background:var(--done);border-color:var(--done)}
.nt-tick svg{width:16px;height:16px;stroke-width:3}
.nt-fold{appearance:none;width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;padding:10px 12px;margin:0 0 8px;font:inherit;font-size:calc(14px*var(--ts));font-weight:600;text-align:left}
.nt-fold span{flex:1}
.nt-fold em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.nt-fold svg{width:16px;height:16px;color:var(--muted);flex:none;transition:transform .15s}
.nt-fold.open svg{transform:rotate(90deg)}
.nt-in{margin:0 0 4px}
.nt-ap{display:flex;align-items:center;gap:8px;margin:16px 3px 4px}
.nt-ap b{font-size:calc(16px*var(--ts))}
.nt-ap span:not(.wxcat){flex:1;min-width:0;font-size:calc(13px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-apinfo{margin:0 3px 7px;font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.nt-none{font-size:calc(14px*var(--ts));color:var(--muted);margin:4px 3px 10px}
.nt-none.sm{font-size:calc(13.5px*var(--ts));margin:2px 3px 8px}
.nt-brief .nt-card{margin-bottom:7px}
.wxc.bare{margin:0 0 8px}
.wxc.bare>.wxl:first-child,.wxc.bare>.eta-strip:first-child{margin-top:0}
.br-rows{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 10px;margin-bottom:8px}
.br-row{appearance:none;width:100%;display:flex;align-items:center;gap:8px;border:0;border-top:1px solid var(--line-soft);background:none;color:var(--text);padding:11px 2px;font:inherit;text-align:left}
.br-rows>.br-row:first-child{border-top:0}
.br-row b{font-size:calc(15px*var(--ts));flex:none}
.br-row .n{flex:1;min-width:0;color:var(--muted);font-size:calc(13.5px*var(--ts));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-row em{font-style:normal;color:var(--muted);font-size:calc(13px*var(--ts));font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.br-row svg{width:16px;height:16px;color:var(--muted);flex:none;transition:transform .15s}
.br-row.open svg{transform:rotate(90deg)}
.br-era{font-style:normal;font-size:10.5px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px}
.br-rowin{padding:2px 0 6px}
.br-rowin .wxc.bare{background:var(--surface2)}
.br-load{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 4px}
.br-load-t{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.br-load-t .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;flex:none}
.br-load-t .ic svg{width:24px;height:24px}
.br-load-t b{font-size:calc(16.5px*var(--ts))}
.br-load-t p{margin:3px 0 0;color:var(--muted);font-size:calc(14px*var(--ts));line-height:1.4}
.br-load .btn{width:100%;cursor:pointer}
.pkg-box{position:relative;margin:12px 0 8px}
.pkg-drop{position:absolute;inset:0;z-index:1;border:2px dashed var(--line-strong);border-radius:14px;background:var(--paper);outline:none;caret-color:transparent;color:transparent;overflow:hidden;cursor:text;-webkit-user-select:text;user-select:text}
.pkg-drop:focus{border-style:solid;border-color:var(--accent)}
body.pkgdrag .pkg-drop,.pkg-box.busy .pkg-drop{border-color:var(--accent);background:var(--accent-weak)}
.pkg-lab{position:relative;z-index:2;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 16px;text-align:center;pointer-events:none;color:var(--muted)}
.pkg-lab svg{width:24px;height:24px;color:var(--accent);margin-bottom:3px}
.pkg-lab b{color:var(--text);font-size:calc(15.5px*var(--ts))}
.pkg-lab small{font-size:calc(13px*var(--ts));line-height:1.3}
.pkg-box.busy .pkg-lab b{color:var(--accent)}
.pkg-box.busy .pkg-lab small{visibility:hidden}
.pkg-files{width:100%;cursor:pointer}
.pkg-how{display:block;margin:10px auto 0;font-size:calc(13.5px*var(--ts));font-weight:600;color:var(--muted)}
.pkg-help{margin:0 0 12px;padding-left:22px;font-size:calc(14.5px*var(--ts));line-height:1.45}
.pkg-help li{margin:0 0 10px}
.pkg-help i{font-style:normal;font-weight:650}
.pkg-dbg{font-size:12px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}
.nt-keep{appearance:none;flex:none;width:38px;height:38px;margin:-7px -6px -4px 0;border:0;border-radius:10px;background:none;color:var(--box);display:grid;place-items:center;padding:0}
.nt-keep svg{width:23px;height:23px}
.nt-keep.on{color:var(--accent)}
.nt-keep.on svg{fill:currentColor}
.nt-keep:active{background:var(--press)}
.nt-card.kept{border-left-color:var(--accent)}
.nt-h{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:2px 3px 6px}
.nt-badge.k{display:inline-flex;align-items:center;gap:1px;background:var(--accent);color:var(--on-accent)}
.nt-badge.k svg{width:10px;height:10px;fill:currentColor;stroke-width:2.5}
.nt-tip{display:flex;align-items:center;gap:9px;margin:0 3px 10px;font-size:calc(13.5px*var(--ts));color:var(--muted);line-height:1.35}
.nt-tip svg{width:19px;height:19px;color:var(--accent);flex:none}
.ntb .mod-body{padding:0 10px calc(10px*var(--sp))}
.ntb-ap{display:flex;align-items:baseline;gap:8px;margin:6px 2px 5px}
.ntb-ap b{font-size:calc(14.5px*var(--ts))}
.ntb-ap span{font-size:calc(12.5px*var(--ts));color:var(--muted);font-weight:600}
.ntm{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:8px 11px;margin:0 0 6px;cursor:pointer}
.ntm-head{font-weight:650;font-size:calc(15px*var(--ts));line-height:1.35;overflow-wrap:anywhere}
.ntm:not(.open) .ntm-head{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntm-when{font-size:calc(12.5px*var(--ts));color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.ntm .nt-body{margin-top:6px;padding-top:6px}
.nf-opt.pri{display:block;cursor:default}
.nf-h{display:flex;align-items:center;gap:13px}
.nf-h>svg{width:28px;height:28px;color:var(--accent);flex:none}
.ofp-none{margin:0;font-weight:600;font-size:calc(15px*var(--ts))}
label.ib{cursor:pointer}
/* New flight: empty, or from the OFP */
.nf-opts{display:grid;gap:10px;margin:12px 0 8px}
.nf-opt{appearance:none;display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:14px;padding:14px;font:inherit;cursor:pointer}
.nf-opt.pri{border-color:var(--accent);background:var(--accent-weak)}
.nf-opt>svg{width:28px;height:28px;color:var(--accent);flex:none}
.nf-opt b{display:block;font-size:calc(16.5px*var(--ts))}
.nf-opt small{display:block;color:var(--muted);font-size:calc(13.5px*var(--ts));margin-top:2px;line-height:1.3}
.nf-stat{margin:0 0 8px;text-align:center;color:var(--accent);font-weight:650;font-size:calc(14.5px*var(--ts))}
.ofp-sum{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 10px}
.ofp-top{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.ofp-top b{font-size:calc(19px*var(--ts))}
.ofp-top span{font-weight:700;color:var(--accent);font-size:calc(15px*var(--ts))}
.ofp-top em{font-style:normal;color:var(--muted);font-size:calc(13.5px*var(--ts));margin-left:auto;font-weight:600}
.ofp-route{display:flex;align-items:center;gap:6px;margin:10px 0 10px;font-size:calc(21px*var(--ts))}
.ofp-route svg{width:20px;height:20px;color:var(--muted);margin:0 2px}
.ofp-route small{font-size:12px;font-weight:750;color:var(--accent);background:var(--accent-weak);border-radius:5px;padding:1px 5px}
.ofp-sum dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:calc(15px*var(--ts))}
.ofp-sum dt{color:var(--muted);font-weight:600}
.ofp-sum dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}

/* ---------- Links ---------- */
function safeUrl(u){
  u=String(u||'').trim();
  if(/^(javascript|data|vbscript):/i.test(u)) return '#';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u='https://'+u;
  return u;
}
function linkHTML(l){
  var label=l.label||l.url.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'');
  return '<a class="lnk" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener">'+I.link+'<span>'+esc(label)+'</span></a>';
}
function linkName(l){return l.label||l.url.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'');}
// Tag style: a [FCOM] tag whose text matches a link's name opens that link; links with no matching tag are added as tags at the end
function tagLinks(h,links){
  var used={};
  function a(l,inner){return '<a class="rtag rl" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener" aria-label="Open '+esc(linkName(l))+'">'+inner+I.ext+'</a>';}
  h=h.replace(/<span class="rtag">([^<]*)<\/span>/g,function(m,x){
    for(var i=0;i<links.length;i++){if(!used[i]&&esc(linkName(links[i])).trim().toLowerCase()===x.trim().toLowerCase()){used[i]=1;return a(links[i],x);}}
    return m;
  });
  var extra=links.filter(function(l,i){return !used[i];}).map(function(l){return a(l,esc(linkName(l)));}).join(' ');
  return h+(extra?(h?' ':'')+extra:'');
}
// Icon style: a round ↗ at the right of the row (with the name when there is more than one link)
function iconLinksHTML(links){
  return '<span class="rgo-w">'+links.map(function(l){
    return '<a class="rgo" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener" aria-label="Open '+esc(linkName(l))+'">'+(links.length>1?'<span>'+esc(linkName(l))+'</span>':'')+I.ext+'</a>';
  }).join('')+'</span>';
}
// anything in square brackets in a check, like [FCOM] or [QRH 2.3], shows as a small tag
function refTags(h){return h.replace(/\[([^\[\]<>\n]{1,30})\]/g,function(m,x){x=x.trim();return x?'<span class="rtag">'+x+'</span>':m;});}
function linkify(escaped){
  return escaped.replace(/\b([a-z][a-z0-9+.-]{1,24}:\/\/[^\s<]+)/gi,function(m){
    if(/^(javascript|data|vbscript):/i.test(m)) return m;
    var t=m.match(/[.,;:!?)\]]+$/),tail=t?t[0]:'',u=tail?m.slice(0,-tail.length):m;
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'+tail;
  });
}

/* ---------- Calculator maths ---------- */
// CALC-START
var OPS='+−×÷';
function fmtNumStr(s){
  s=String(s);var neg=false;
  if(s[0]==='−'||s[0]==='-'){neg=true;s=s.slice(1);}
  var dot=s.indexOf('.'),i=dot<0?s:s.slice(0,dot),d=dot<0?'':s.slice(dot);
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'−':'')+i+d;
}
function fmtExpr(e){
  var out='',num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(num){out+=fmtNumStr(num);num='';}
    var prev=e[j-1],binary=prev!==undefined&&/[\d.]/.test(prev);
    out+=(ch==='−'&&!binary)?'−':' '+ch+' ';
  }
  if(num) out+=fmtNumStr(num);
  return out.replace(/\s+/g,' ').trim();
}
function hasOp(e){return /[+×÷]/.test(e)||/[\d.]−/.test(e);}
function calcEval(e){
  var t=[],num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(OPS.indexOf(ch)>=0){
      if(num===''){if(ch==='−'){num='-';continue;}return null;}
      if(num==='-') return null;
      t.push(parseFloat(num));num='';t.push(ch);
    }
  }
  if(num!==''&&num!=='-') t.push(parseFloat(num));
  while(t.length&&typeof t[t.length-1]==='string') t.pop();
  if(!t.length) return null;
  for(var k=0;k<t.length;k++){if(typeof t[k]==='number'&&isNaN(t[k])) return null;}
  var a=[t[0]];
  for(var i=1;i<t.length;i+=2){
    var op=t[i],n=t[i+1];
    if(op==='×') a[a.length-1]*=n;
    else if(op==='÷') a[a.length-1]/=n;
    else a.push(op,n);
  }
  var r=a[0];
  for(var q=1;q<a.length;q+=2) r=a[q]==='+'?r+a[q+1]:r-a[q+1];
  if(!isFinite(r)) return 'err';
  r=parseFloat(r.toPrecision(12));
  var s=String(r);
  if(/e/i.test(s)) return 'err';
  return s.replace('-','−');
}
// CALC-END

function countHTML(d,t){if(!t) return '';return d===t?I.check+'<span>Done</span>':d+'/'+t;}
function headGroups(s){
  // progress of the items under each heading, up to the next heading
  var m={},cur=null;
  s.items.forEach(function(it){
    if(it.type==='head'){cur=m[it.id]={d:0,t:0,n:0};return;}
    if(!cur) return;
    cur.n++;
    if(isTask(it)){cur.t++;if(it.done) cur.d++;}
  });
  return m;
}

function renderNode(it,depth){

function apStats(ic){
  var A=[],D=[];
  state.flights.forEach(function(f){if(f.arr.icao===ic) A.push(f);if(f.dep.icao===ic) D.push(f);});
  function cnt(list,fn){
    var m=new Map();
    list.forEach(function(f){var v=fn(f);if(!v) return;var k=v.toUpperCase(),e=m.get(k)||{v:v,n:0};e.n++;m.set(k,e);});
    return Array.from(m.values()).sort(function(a,b){return b.n-a.n;});
  }
  function tm(list,fn){
    var xs=list.map(fn).filter(function(x){return typeof x==='number';});
    if(!xs.length) return null;
    return {avg:Math.round(xs.reduce(function(a,b){return a+b;},0)/xs.length),min:Math.min.apply(null,xs),max:Math.max.apply(null,xs),n:xs.length};
  }
  var last='';A.concat(D).forEach(function(f){if(f.date>last) last=f.date;});
  var notes=[];
  A.forEach(function(f){if(f.arr.notes) notes.push({d:f.date,k:'arrival',t:f.arr.notes});});
  D.forEach(function(f){if(f.dep.notes) notes.push({d:f.date,k:'departure',t:f.dep.notes});});
  notes.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
  return {arr:A.length,dep:D.length,last:last,
    arrRwy:cnt(A,function(f){return f.arr.rwy;}),star:cnt(A,function(f){return f.arr.star;}),app:cnt(A,function(f){return f.arr.app?(f.arr.app+' '+f.arr.rwy).trim():'';}),
    tin:tm(A,function(f){return f.arr.tmin;}),tout:tm(D,function(f){return f.dep.tmin;}),
    arrStand:cnt(A,function(f){return f.arr.stand;}),depStand:cnt(D,function(f){return f.dep.stand;}),
    stands:cnt(A.map(function(f){return {s:f.arr.stand};}).concat(D.map(function(f){return {s:f.dep.stand};})),function(x){return x.s;}),
    depRwy:cnt(D,function(f){return f.dep.rwy;}),sid:cnt(D,function(f){return f.dep.sid;}),notes:notes};
}

/* Reminders: at UTC times every day, or a set time before a countdown */
function remDue(r,now){
  if(r.mode==='cd'){
    var c=cdById(r.cd);if(!c||c.target===null) return {prev:null,next:null,c:c};
    var t=c.target-r.min*60000;return t<=now?{prev:t,next:null,c:c}:{prev:null,next:t,c:c};
  }
  var day=Math.floor(now/86400000)*86400000,prev=null,next=null;
  r.times.forEach(function(x){
    var m=(+x.slice(0,2))*60+(+x.slice(2));
    [-1,0,1].forEach(function(k){var t=day+k*86400000+(m-r.lead)*60000;if(t<=now){if(prev===null||t>prev) prev=t;}else if(next===null||t<next) next=t;});
  });
  return {prev:prev,next:next};
}
function hmOf(t){var d=new Date(t);return hmZ(d.getUTCHours()*60+d.getUTCMinutes());}
function remText(r,now){
  if(r.mode==='cd'){
    var c=cdById(r.cd);if(!c) return 'Countdown deleted';
    return c.title+' − '+r.min+' min'+(c.target!==null?' · '+hmOf(c.target-r.min*60000):'');
  }
  var d=remDue(r,now);
  return hmOf(d.next+r.lead*60000)+(r.times.length>1?' · '+r.times.length+' a day':'')+(r.lead?' · alert '+r.lead+' min before':'');
}
function remWalk(fn){
  state.lists.forEach(function(L){L.sections.forEach(function(s){
    (function w(arr){arr.forEach(function(n){if(n.type==='check'){if(n.rem) fn(n);w(n.children);(n.dq||[]).forEach(function(x){w(x.items);});}});})(s.items);
  });});
}
function remMsg(it,r,d,now){
  var name=it.text||'Reminder',late=now-d.prev>120000;
  if(r.mode==='cd') return name+' · '+r.min+' min to '+(d.c?d.c.title:'countdown');
  return name+(r.lead?' in '+r.lead+' min':'')+(late?' (was due '+hmOf(d.prev+r.lead*60000)+')':'');
}
function remCheck(now){
  remWalk(function(it){
    var r=it.rem,d=remDue(r,now);
    if(d.prev===null) return;
    if(r.mode==='cd'){
      if(r.lastT!==null&&Math.abs(d.c.target-r.lastT)<20*60000) return;
      r.lastT=d.c.target;
    }else{
      if(d.prev<=r.last) return;
      r.last=d.prev;
    }
    saveSoon();
    if(now-d.prev<15*60000) remFire(it,remMsg(it,r,d,now));
  });
}
function remFire(it,msg){
  if(!it.info&&it.done) tick(it.id); // a ticked item comes back as to-do
  alerting.delete(it.id);alerting.set(it.id,msg);paintAlert();beep(3);
}
function remPaint(now){
  document.querySelectorAll('[data-remid]').forEach(function(el){
    var f=find(el.getAttribute('data-remid'));if(!f||!f.node.rem) return;
    var r=f.node.rem,t=remText(r,now),sp=el.querySelector('span');
    if(sp&&sp.textContent!==t) sp.textContent=t;
    var d=remDue(r,now);el.classList.toggle('soon',d.next!==null&&d.next-now<=10*60000);
    var item=el.closest('.item');if(item) item.classList.toggle('rem-due',alerting.has(f.node.id));
  });
}
function remMark(r){
  // a reminder that is already past when you set it doesn't go off straight away
  var now=Date.now(),d=remDue(r,now);
  if(r.mode==='cd') r.lastT=d.prev!==null&&d.c?d.c.target:null;
  else r.last=d.prev||0;
  return r;
}

  add(st.dep&&st.dep.icao,'From');add(st.dest&&st.dest.icao,'To');

}
function wxMaybe(force){

  if(!force&&(navigator.onLine===false||now<wxSt.retry)) return;
  var ids=wxAirports().map(function(x){return x.ic;}).slice(0,12);
  if(!ids.length) return;
  if(!force&&ids.every(function(ic){return wx[ic]&&now-(wx[ic].f||0)<WX_EVERY;})) return;
  wxFetch(ids);

function wxFetch(ids){

    return r.json().catch(function(){return {ok:false,error:'The relay answered '+r.status};});
  }).then(function(j){
    if(!j||!j.ok) throw new Error(j&&j.error?j.error:'The relay didn’t answer properly');
    var now=Date.now();

      var o=wx[ic]||{},m=j.metar&&j.metar[ic],t=j.taf&&j.taf[ic];
      wx[ic]={m:m&&m.raw?{raw:String(m.raw),time:+m.time||null,cat:str(m.cat)}:(o.m||null),t:t&&t.raw?{raw:String(t.raw),time:+t.time||null}:(o.t||null),f:now,a:wxAtisOf(j,ic,o)};
    });

  }).catch(function(e){
    wxSt.err=navigator.onLine===false||(e&&e.name==='AbortError')||(e instanceof TypeError)?'No internet':String(e&&e.message||e);
    wxSt.retry=Date.now()+60000;

}
function wxUS(ic){return /^[KP]/.test(ic);}

}
function atisTime(x){

}

function wxObsTime(raw,fallback){
  // the DDHHMMZ group in the report, placed in the current or previous month
  var m=/\b(\d{2})(\d{2})(\d{2})Z\b/.exec(raw||'');if(!m) return fallback||null;
  var n=new Date(),t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),+m[1],+m[2],+m[3]);
  if(t>Date.now()+86400000) t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,+m[1],+m[2],+m[3]);
  return fallback||t;
}
function wxSig(raw){
  // highlight significant weather and CB/TCU, only after the report's time group (so station codes never light up)
  var on=false,WXR=/^(\+|-|VC)?(MI|PR|BC|DR|BL|SH|TS|FZ)?((?:DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS){0,3})$/;
  return String(raw).split(/(\s+)/).map(function(t){
    if(/^\s+$/.test(t)||!t) return t;
    if(!on){if(/^\d{6}Z$/.test(t)) on=true;return esc(t);}
    var m=WXR.exec(t),sig=false;
    if(m&&(m[2]||m[3])) sig=m[1]==='+'||m[2]==='TS'||m[2]==='FZ'||/SN|GR|GS|SQ|FC|SS|DS|VA|FG|PL|IC/.test(m[3]);
    if(/^(FEW|SCT|BKN|OVC|VV)(\d{3}|\/{3})(CB|TCU)$/.test(t)) sig=true;

  }).join('');
}
function wxTafLines(raw){

}
// A TAF time DDHHMM, placed in the month that puts it nearest the reference time (hour 24 rolls to the next day)
function tafTime(dd,hh,mm,ref){
  var r=new Date(ref),best=null;
  [-1,0,1].forEach(function(k){var t=Date.UTC(r.getUTCFullYear(),r.getUTCMonth()+k,dd,hh,mm);if(best===null||Math.abs(t-ref)<Math.abs(best-ref)) best=t;});
  return best;
}
// When each TAF line is in force: the opening line until the first FM, FM until the next FM,
// BECMG from its start until the next FM (its change stays), TEMPO / PROB / INTER only in their period
function tafSpans(lines,ref){
  var out=lines.map(function(){return null;}),v=/\b(\d{2})(\d{2})\/(\d{2})(\d{2})\b/.exec(lines[0]||'');
  if(!v) return out;
  var vs=tafTime(+v[1],+v[2],0,ref),ve=tafTime(+v[3],+v[4],0,vs+3600000),fms=[];
  if(ve<=vs) return out;
  out.v={s:vs,e:ve};
  lines.forEach(function(l){var m=/^FM(\d{2})(\d{2})(\d{2})\b/.exec(l);if(m) fms.push(tafTime(+m[1],+m[2],+m[3],vs));});
  function nextFm(t){var n=ve;fms.forEach(function(f){if(f>t&&f<n) n=f;});return n;}
  lines.forEach(function(l,i){
    if(i===0){out[i]={s:vs,e:nextFm(vs)};return;}
    var fm=/^FM(\d{2})(\d{2})(\d{2})\b/.exec(l);
    if(fm){var t=tafTime(+fm[1],+fm[2],+fm[3],vs);out[i]={s:t,e:nextFm(t)};return;}
    var p=/^(BECMG|TEMPO|INTER|PROB\d{2}(?:\s+(?:TEMPO|INTER))?)\s+(\d{2})(\d{2})\/(\d{2})(\d{2})\b/.exec(l);
    if(p){var a=tafTime(+p[2],+p[3],0,vs),b=tafTime(+p[4],+p[5],0,a+3600000);out[i]=/^BECMG/.test(p[1])?{s:a,e:nextFm(a)}:{s:a,e:b};}
  });
  return out;
}
function durM(ms,up){var m=up?Math.ceil(ms/60000):Math.floor(ms/60000);return Math.floor(m/60)+':'+pad2(m%60);}
function relT(t,now){return t>now?'in '+durM(t-now,true):durM(now-t,false)+' ago';}
function wxWin(a){

  if(a.role==='To'&&st.etaT){t=st.etaT;o={k:'ETA',tz:st.dest&&st.dest.tz};}
  else if(a.role==='From'&&st.etdT){t=st.etdT;o={k:'ETD',tz:st.dep&&st.dep.tz};}
  else if(a.role==='Alternate'&&st.etaT&&st.dest){
    var m=st.altMin[st.dest.icao+'>'+a.ic];
    if(typeof m==='number'){t=st.etaT+m*60000;o={k:'ETA',approx:true,sub:st.dest.icao+' + '+m+' min'};}
  }

}

function wxTafHTML(t,w){

  var body=lines.map(function(l,i){

// the page's text, line by line: items on one baseline join up, with a space where there's a gap
function pdfText(lib,buf){
  return lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
    var out=[],p=1;
    function next(){
      if(p>pdf.numPages){try{pdf.destroy();}catch(e){}return out.join('\n');}
      return pdf.getPage(p++).then(function(page){return page.getTextContent();}).then(function(tc){
        var line='',lastY=null,lastX=null;
        tc.items.forEach(function(it){
          if(!('str' in it)) return;
          var x=it.transform[4],y=it.transform[5];
          if(lastY!==null&&Math.abs(y-lastY)>2){out.push(line);line='';lastX=null;}
          if(lastX!==null&&x-lastX>1.5&&!/\s$/.test(line)&&it.str&&!/^\s/.test(it.str)) line+=' ';
          line+=it.str;lastX=x+it.width;lastY=y;
          if(it.hasEOL){out.push(line);line='';lastY=null;lastX=null;}
        });
        if(line) out.push(line);
        return next();
      });
    }
    return next();
  });
}

function modSubHTML(n){

    if(n.expr){var cr=hasOp(n.expr)&&/[\d.]$/.test(n.expr)?calcEval(n.expr):null;return esc(fmtExpr(n.expr))+(cr!==null&&cr!=='err'?' = <b>'+esc(fmtNumStr(cr))+'</b>':'');}

    return [first].concat(rest).map(function(a){var k=cat(a.ic);return esc(a.ic)+' '+(k?'<span class="wxcat '+k+'">'+k+'</span>':'–');}).join(' · ');
  }

    var ap=flightAp(n.which);if(!ap) return 'Set the flight';

    return (n.which==='dep'?'Departure':'Destination')+' · '+(k2?k2+' note'+(k2===1?'':'s'):'no notes yet');
  }
  if(t==='apst'){

    var S=apStats(ap2.icao),arr=n.which==='dest',cnt=arr?S.arr:S.dep,rw=(arr?S.arrRwy:S.depRwy)[0];
    return (arr?'Destination':'Departure')+' · '+(cnt?cnt+' '+(arr?'arrival':'departure')+(cnt===1?'':'s')+(rw?', mostly '+esc(rw.v):''):'none logged yet');

    return 'Flight log · '+(out.length?esc(out.join(' · ')):'nothing logged yet');

/* Calculator */
function calcKey(id,k){
  var f=find(id);if(!f) return;
  var m=f.node,e=m.expr,last=e.slice(-1),wasFresh=fresh.has(id),seg;
  fresh.delete(id);
  if(/^\d$/.test(k)){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg==='0') e=e.slice(0,-1);
    e+=k;
  }else if(k==='.'){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg.indexOf('.')>=0) return;
    e+=seg===''?'0.':'.';
  }else if(OPS.indexOf(k)>=0){
    if(e===''||e==='−') e=k==='−'?'−':'';
    else if(OPS.indexOf(last)>=0){
      if(k==='−'&&(last==='×'||last==='÷')) e+='−';
      else{e=e.replace(/[+−×÷]+$/,'');e=e===''?(k==='−'?'−':''):e+k;}
    }else{if(last==='.') e+='0';e+=k;}
  }else if(k==='C'){e='';
  }else if(k==='del'){e=e.slice(0,-1);
  }else if(k==='='){
    var ev=e.replace(/[+−×÷]+$/,'');
    if(!hasOp(ev)){if(wasFresh) fresh.add(id);return;}
    var r=calcEval(ev);
    if(r===null) return;

/* Notepad */
function inkColor(){return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';}
function mountPad(el,m){
  var cv=el.querySelector('canvas'),wrap=cv.parentElement,ctx=cv.getContext('2d');
  var scale=1,lastW=0,tool='pen',curS=null,ink=inkColor();
  function dpr(){return Math.min(window.devicePixelRatio||1,3);}
  function size(force){
    var w=wrap.clientWidth;if(!w) return;
    if(w===lastW&&!force) return;
    lastW=w;scale=w/LW;
    var hpx=Math.round(m.h*scale),d=dpr();
    cv.style.height=hpx+'px';
    cv.width=Math.round(w*d);cv.height=Math.round(hpx*d);
    ctx.setTransform(d*scale,0,0,d*scale,0,0);
    redraw();
  }
  function setStyle(s,p){
    ctx.globalCompositeOperation=s.t==='e'?'destination-out':'source-over';
    ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineCap='round';ctx.lineJoin='round';
    return s.t==='e'?s.w:s.w*(0.35+p*1.3);
  }
  function seg(s,i){
    var P=s.pts,a=(i-1)*3,b=i*3;
    ctx.lineWidth=setStyle(s,(P[a+2]+P[b+2])/2);
    ctx.beginPath();ctx.moveTo(P[a],P[a+1]);ctx.lineTo(P[b],P[b+1]);ctx.stroke();
  }
  function dot(s){
    var P=s.pts,w=setStyle(s,P[2]);
    ctx.beginPath();ctx.arc(P[0],P[1],w/2,0,Math.PI*2);ctx.fill();
  }
  function drawStroke(s){var n=s.pts.length/3;dot(s);for(var i=1;i<n;i++) seg(s,i);}
  function redraw(){
    ink=inkColor();
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
    m.strokes.forEach(drawStroke);
    ctx.globalCompositeOperation='source-over';
  }
  function pt(e,r){
    return [+((e.clientX-r.left)/scale).toFixed(1),+((e.clientY-r.top)/scale).toFixed(1),e.pointerType==='pen'?+((e.pressure||0.5).toFixed(2)):0.5];
  }
  function down(e){
    if(curS) return;
    if(e.pointerType==='touch'&&!state.settings.fingerDraw) return;
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    curS={id:e.pointerId,s:{t:tool==='eraser'?'e':'p',w:tool==='eraser'?18:2.3,pts:pt(e,cv.getBoundingClientRect())}};
    dot(curS.s);
  }
  function move(e){
    if(!curS||e.pointerId!==curS.id) return;
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    var list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!list.length) list=[e];
    for(var i=0;i<list.length;i++){
      var p=pt(list[i],r),P=curS.s.pts;
      if(Math.abs(p[0]-P[P.length-3])<0.4&&Math.abs(p[1]-P[P.length-2])<0.4) continue;
      P.push(p[0],p[1],p[2]);seg(curS.s,P.length/3-1);
    }
  }
  function up(e){
    if(!curS||e.pointerId!==curS.id) return;
    m.strokes.push(curS.s);curS=null;
    ctx.globalCompositeOperation='source-over';
    saveSoon();
  }
  // Stop Apple Pencil (or a finger, when finger drawing is on) from scrolling the page
  function tstop(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].touchType==='stylus'||state.settings.fingerDraw){e.preventDefault();return;}
    }
  }
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('touchstart',tstop,{passive:false});
  cv.addEventListener('touchmove',tstop,{passive:false});
  var ro=window.ResizeObserver?new ResizeObserver(function(){size(false);}):null;
  if(ro) ro.observe(wrap);else window.addEventListener('resize',function(){size(false);});
  size(true);
  return {
    redraw:redraw,
    resize:function(){size(true);},
    setTool:function(t){tool=t;el.querySelectorAll('[data-act="padTool"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});},
    undo:function(){if(!m.strokes.length) return;m.strokes.pop();redraw();saveSoon();},
    dispose:function(){if(ro) ro.disconnect();}
  };
}
function padMode(id,mode){
  var f=find(id);if(!f||f.node.mode===mode) return;

/* ---------- Storage on this iPad ---------- */
var LS_LIMIT=5*1024*1024,storWarned=false,storP=null,updAvail=false,bootAt=Date.now();
function storCheck(len){
  if(!storWarned&&len*2>LS_LIMIT*0.8){storWarned=true;toast('Storage is 80% full. See Menu → Settings → Storage.',5000);}
}
function lsBytes(){var b=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);b+=(k.length+(localStorage.getItem(k)||'').length)*2;}}catch(e){}return b;}
function fmtMB(b){var m=b/1048576;return m<0.1?'under 0.1 MB':m.toFixed(1)+' MB';}
function storRowHTML(est){
  var used=lsBytes(),pct=Math.min(100,used/LS_LIMIT*100),hi=pct>=80;
  var parts=[['Checklists',state.lists],['Airport notes',state.apNotes],['Flight log',state.flights]].map(function(x){var l=0;try{l=JSON.stringify(x[1]).length*2;}catch(e){}return [x[0],l];});
  var big=pct>=40?'<small>'+parts.sort(function(a,b){return b[1]-a[1];}).map(function(x){return x[0]+' '+fmtMB(x[1]);}).join(' · ')+'</small>':'';
  var ph=est&&typeof est.usage==='number'?'<small>Photos and app files: '+fmtMB(Math.max(0,est.usage-used))+'</small>':'';
  var kept=storP===true?'<small>Kept: iPadOS won’t clear it to free up space.</small>':
    storP===false?'<small'+(cloud.on?'':' class="warn"')+'>iPadOS may clear it if the iPad runs very low on space.'+(cloud.on?' Online backup keeps a copy.':' Turn on Online backup to keep a copy.')+'</small>':'';
  return I.disk+'<span class="mt">On this iPad<small'+(hi?' class="warn"':'')+'>Checklists and notes: '+fmtMB(used)+' of about 5 MB'+(hi?'. Make room in the largest part listed below.':'')+'</small></span>'+
    '<div class="stor-bar'+(hi?' hi':'')+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
    '<span class="mt" style="margin:0 0 0 36px">'+big+ph+kept+'</span>';
}
function storRefresh(){
  var row=$('#storRow');if(!row) return;
  var done=function(est){var r=$('#storRow');if(r) r.innerHTML=storRowHTML(est);};
  try{if(navigator.storage&&navigator.storage.estimate){navigator.storage.estimate().then(done,function(){done(null);});return;}}catch(e){}
  done(null);
}
function storPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persisted) return;
    navigator.storage.persisted().then(function(p){return p||(navigator.storage.persist?navigator.storage.persist():false);})
      .then(function(v){storP=!!v;storRefresh();},function(){});
  }catch(e){}
}

function srWords(q){return q.toLowerCase().split(/\s+/).filter(Boolean);}

function srSnip(text,words){

/* ---------- Time: UTC clock, destination, countdowns, crew rest ---------- */
// TIME-START
function pad2(n){return (n<10?'0':'')+n;}
function parseHM(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  if(t.length===3) t='0'+t;
  if(t.length!==4) return null;
  var h=+t.slice(0,2),m=+t.slice(2);
  if(h>23||m>59) return null;
  return h*60+m;
}
function hmZ(min){min=((Math.round(min)%1440)+1440)%1440;return pad2(Math.floor(min/60))+pad2(min%60)+'Z';}
function durHM(min){min=Math.round(min);return Math.floor(min/60)+':'+pad2(min%60);}
function durClock(ms){
  var t=Math.ceil(Math.abs(ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h+':'+pad2(m)+':'+pad2(s);
}
// Next occurrence of an HHMM UTC time; up to 30 minutes in the past counts as today
function targetFromHM(min,now){
  var d=new Date(now),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())+min*60000;
  if(t<now-30*60000) t+=86400000;
  return t;
}
function restCalc(m){
  var s=parseHM(m.start),e=parseHM(m.end);
  if(s===null||e===null) return {err:'Enter the rest start and end times in UTC.'};
  if(e<=s) e+=1440;
  var total=e-s,n=m.n,B=m.buffer,usable=total-B*(n-1);
  if(usable<n*10) return {err:'The rest window is too short for '+n+' break'+(n>1?'s':'')+'.'};
  var L=usable/n,rows=[];
  for(var i=0;i<n;i++){
    var bs=s+i*(L+B),be=bs+L;
    if(i>0) bs=m.round?Math.round(bs/5)*5:Math.round(bs);
    be=(i===n-1)?e:(m.round?Math.round(be/5)*5:Math.round(be));
    rows.push({s:bs,e:be});
  }
  return {s:s,e:e,total:total,rows:rows};
}
// TIME-END
function restOutHTML(m){
  var r=restCalc(m);
  if(r.err) return '<div class="rest-msg">'+esc(r.err)+'</div>';
  var h=r.rows.map(function(x,i){
    return '<div class="rrow" data-ri="'+i+'"><input type="text" data-rlabel="'+i+'" data-id="'+m.id+'" value="'+esc(m.labels[i]||'')+'" placeholder="Break '+(i+1)+'" aria-label="Name for break '+(i+1)+'" autocomplete="off">'+
      '<span class="rright"><span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></span></div>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+h+'<div class="rest-sum">Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}
function restMineIdx(m,r){return typeof m.mine==='number'&&m.mine>=0&&m.mine<r.rows.length?m.mine:-1;}
function restInfo(m,now){
  var r=restCalc(m);
  if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,txt='',on=false,idx=-1,me=restMineIdx(m,r);
  if(rel<r.total){
    for(var i=0;i<r.rows.length;i++){
      var x=r.rows[i];
      if(abs>=x.s&&abs<x.e){
        idx=i;on=true;
        txt=i===me?'Your rest: '+durHM(Math.ceil(x.e-abs))+' left':'Now: '+(m.labels[i]||'Break '+(i+1))+', '+durHM(Math.ceil(x.e-abs))+' left'+(me>i?' · yours in '+durHM(Math.ceil(r.rows[me].s-abs)):'');
        break;
      }
      if(abs<x.s){txt='Handover, next at '+hmZ(x.s)+(i===me?' (yours)':'');break;}
    }
  }else{
    var wait=1440-rel;
    txt=wait>720?'Rest finished':me>=0?'Your rest in '+durHM(Math.ceil(wait+r.rows[me].s-r.s)):'Starts in '+durHM(Math.ceil(wait));
  }
  return {txt:txt,on:on,idx:idx};
}
// The block once the times are set: the breaks to read, tap one to mark it as yours
function restReadHTML(m){
  var r=restCalc(m),me=restMineIdx(m,r);
  var rows=r.rows.map(function(x,i){
    var nm=m.labels[i]||'Break '+(i+1),my=i===me;
    return '<button type="button" class="rrow'+(my?' mine':'')+'" data-ri="'+i+'" data-act="restMine" data-id="'+m.id+'" data-i="'+i+'" aria-pressed="'+my+'" aria-label="'+esc(nm)+', '+hmZ(x.s)+' to '+hmZ(x.e)+(my?', your rest. Tap to unmark':'. Tap to mark it as your rest')+'">'+
      '<span class="rname"><span>'+esc(nm)+'</span>'+(my?'<i class="you">You</i>':'')+'</span>'+
      '<span class="rright"><span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></span></button>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+rows+'<div class="rest-sum">'+(me<0?'<span class="rest-hint">Tap your break to mark it as yours.</span> ':'')+
    'Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}

/* Destination time */
var dtfCache={};
function tzInfo(tz,now){
  try{
    var f=dtfCache[tz]||(dtfCache[tz]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'}));
    var p={};f.formatToParts(new Date(now)).forEach(function(x){p[x.type]=x.value;});
    var h=(+p.hour)%24,base=Math.floor(now/60000)*60000;
    var off=Math.round((Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute)-base)/60000);
    return {hm:pad2(h)+':'+p.minute,wd:p.weekday,off:off};
  }catch(e){return null;}
}
function fmtOff(m){var sg=m<0?'−':'+';m=Math.abs(m);return 'UTC'+sg+Math.floor(m/60)+(m%60?':'+pad2(m%60):'');}
function paintClock(now){

function restTop(m,now){
  // what the top bar shows for a rest plan: current break, next break, or time to rest start
  var r=restCalc(m);if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,me=restMineIdx(m,r);
  if(me>=0){
    // your own break: time until it starts, then what is left of it; nothing once it is over
    var y=r.rows[me];
    if(rel<r.total){
      if(abs<y.s) return {mode:'wait',min:y.s-abs,name:'to your rest',mine:true};
      if(abs<y.e) return {mode:'on',min:y.e-abs,name:'rest left',mine:true};
      return null;
    }
    var w=1440-rel;
    return w<=720?{mode:'wait',min:w+y.s-r.s,name:'to your rest',mine:true}:null;
  }
  if(rel<r.total){
    for(var i=0;i<r.rows.length;i++){
      var x=r.rows[i];
      if(abs>=x.s&&abs<x.e) return {mode:'on',min:x.e-abs,name:m.labels[i]||'Break '+(i+1)};
      if(abs<x.s) return {mode:'gap',min:x.s-abs,name:'to '+(m.labels[i]||'Break '+(i+1))};
    }
    return null;
  }
  var wait=1440-rel;
  return wait<=720?{mode:'wait',min:wait,name:'to rest'}:null;
}

function sunRS(lat,lon,t){
  // sunrise and sunset for the solar day nearest t (standard sunrise equation, about a minute accurate)
  var r=Math.PI/180,J=t/86400000+2440587.5,best=null;
  function toMs(j){return (j-2440587.5)*86400000;}
  function day(n){
    var Js=n-lon/360,M=((357.5291+0.98560028*Js)%360+360)%360,Mr=M*r;
    var C=1.9148*Math.sin(Mr)+0.02*Math.sin(2*Mr)+0.0003*Math.sin(3*Mr);
    var L=(M+C+180+102.9372)%360,Lr=L*r;
    var Jt=2451545+Js+0.0053*Math.sin(Mr)-0.0069*Math.sin(2*Lr);
    var sd=Math.sin(Lr)*Math.sin(23.4397*r),cd=Math.cos(Math.asin(sd));
    var cw=(Math.sin(-0.833*r)-Math.sin(lat*r)*sd)/(Math.cos(lat*r)*cd);
    if(cw>1) return {polar:'night',noon:toMs(Jt)};
    if(cw<-1) return {polar:'day',noon:toMs(Jt)};
    var w0=Math.acos(cw)/r;
    return {rise:toMs(Jt-w0/360),set:toMs(Jt+w0/360),noon:toMs(Jt)};
  }
  var n0=Math.floor(J-2451545+0.0008);
  [n0-1,n0,n0+1].forEach(function(n){var d=day(n);if(!best||Math.abs(d.noon-t)<Math.abs(best.noon-t)) best=d;});
  return best;
}

var apP=null,apIdx=null;
function loadAirports(){
  if(window.AIRPORT_DATA) return Promise.resolve();
  if(apP) return apP;
  apP=new Promise(function(res,rej){
    var sc=document.createElement('script');sc.src='airports.js';
    sc.onload=function(){window.AIRPORT_DATA?res():rej();};
    sc.onerror=function(){apP=null;sc.remove();rej();};
    document.head.appendChild(sc);
  });
  return apP;
}
function apIndex(){
  if(apIdx) return apIdx;
  var lines=window.AIRPORT_DATA.split('\n'),map=new Map(),iata=new Map();
  lines.forEach(function(l){map.set(l.slice(0,4),l);var p=l.split('|');if(p[1]&&!iata.has(p[1])) iata.set(p[1],l);});
  return (apIdx={lines:lines,map:map,iata:iata});
}
function apRec(l){
  var p=l.split('|'),ll=(p[2]||'').split(',');
  return {icao:l.slice(0,4),tz:window.AIRPORT_TZ[parseInt(l.slice(4,6),36)],cc:l.slice(6,8),name:p[0].slice(8),iata:p[1]||'',lat:ll.length===2?+ll[0]:null,lon:ll.length===2?+ll[1]:null};
}
function apLookup(ic){if(!window.AIRPORT_DATA) return null;var l=apIndex().map.get(ic);return l?apRec(l):null;}
// an airport typed as IATA (JFK) becomes its ICAO code (KJFK) once the airport list is loaded
function iataToIcao(v){
  var c=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length===3&&window.AIRPORT_DATA){var l=apIndex().iata.get(c);if(l) return l.slice(0,4);}
  return c;
}
function apCode(v){return icaoClean(iataToIcao(v));}
function apFind(q){
  q=q.trim().toUpperCase();
  var ix=apIndex(),out=[],seen={};
  function add(l){var c=l.slice(0,4);if(!seen[c]){seen[c]=1;out.push(apRec(l));}}
  if(/^[A-Z0-9]{4}$/.test(q)&&ix.map.has(q)) add(ix.map.get(q));
  if(/^[A-Z]{3}$/.test(q)&&ix.iata.has(q)) add(ix.iata.get(q));
  if(/^[A-Z0-9]{2,3}$/.test(q)){for(var i=0;i<ix.lines.length&&out.length<8;i++){if(ix.lines[i].lastIndexOf(q,0)===0) add(ix.lines[i]);}}
  if(q.length>=3&&out.length<8){for(var j=0;j<ix.lines.length&&out.length<8;j++){if(apRec(ix.lines[j]).name.toUpperCase().indexOf(q)>=0) add(ix.lines[j]);}}
  return out;
}
function zoneList(){
  var z=[];
  try{if(Intl.supportedValuesOf) z=Intl.supportedValuesOf('timeZone');}catch(e){}
  if(!z.length&&window.AIRPORT_TZ) z=window.AIRPORT_TZ.slice();
  if(z.indexOf('UTC')<0) z.unshift('UTC');
  return z;
}

      if(rr){rr.node.round=!rr.node.round;el.classList.toggle('on',rr.node.round);el.setAttribute('aria-pressed',String(rr.node.round));saveSoon();restRefresh(rr.node);}
      break;
    case 'viewImg':
      var vf=find(id);
      if(vf&&vf.node.imgs.length) openViewer(vf.node.imgs,+el.getAttribute('data-n')||0);
      break;
    case 'toolClose': closeTool();break;
    case 'toolCdAdd': toolCdAdd();break;
    case 'toolCdDel': toolCdDel(id);break;
  }
}

function onInput(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-fl]')){flInput(t);return;}
  if(t.matches&&t.matches('[data-flfilter]')){toolFlFilter=t.value;var fl=$('#flList');if(fl) fl.innerHTML=flListHTML();return;}
  if(t.matches&&t.matches('[data-padtext]')){var f=find(t.getAttribute('data-padtext'));if(f){f.node.text=t.value;saveSoon();}}
  if(t.matches&&t.matches('[data-rest]')){
    var rf=find(t.getAttribute('data-id'));if(!rf) return;
    var k=t.getAttribute('data-rest');
    if(k==='buffer') rf.node.buffer=+t.value||0;else rf.node[k]=t.value.trim();
    saveSoon();restRefresh(rf.node);
  }
  if(t.matches&&t.matches('[data-rlabel]')){
    var lf=find(t.getAttribute('data-id'));if(!lf) return;
    lf.node.labels[+t.getAttribute('data-rlabel')]=t.value;saveSoon();
    if(document.activeElement!==t) restStatus(lf.node,t.closest('.module'),Date.now());
  }
}

function onChange(e){

  }
  if(t.matches&&t.matches('[data-rest="buffer"]')){var bf=find(t.getAttribute('data-id'));if(bf&&bf.node.buffer!==(+t.value||0)){bf.node.buffer=+t.value||0;saveSoon();restRefresh(bf.node);}}
  if(t.matches&&t.matches('[data-rlabel]')){var lf=find(t.getAttribute('data-id'));if(lf) restStatus(lf.node,t.closest('.module'),Date.now());}
}

function restFocus(e){
  var t=e.target;if(!t.matches||!t.matches('[data-rest],[data-rlabel]')) return;
  var md=t.closest('.module.rest'),id=md&&md.getAttribute('data-mod');if(!id||restEditing.has(id)) return;
  restEditing.add(id);
  if(editMode) return;
  if(md.closest('#toolPanel')){
    // in the Crew rest panel the Done button sits in the panel's own header
    var th=toolPanel.querySelector('.tp-head'),cl=th&&th.querySelector('[data-act="toolClose"]');
    if(cl&&!th.querySelector('[data-act="restDone"],[data-act="restEdit"]')) cl.insertAdjacentHTML('beforebegin','<button type="button" class="pill" data-act="restDone" data-id="'+id+'">Done</button>');
    return;
  }
  var hd=md.querySelector('.mod-head'),tg=hd&&hd.querySelector('.mod-toggle');
  if(tg&&!editMode&&!hd.querySelector('.mod-x')) tg.insertAdjacentHTML('afterend','<button type="button" class="lnkbtn mod-x" data-act="restDone" data-id="'+id+'">Done</button>');
}
