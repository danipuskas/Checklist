.rest-out.rd .rrow:active{background:var(--press)}
.rname{display:flex;align-items:center;gap:7px;min-width:0;font-size:calc(16px*var(--ts));font-weight:600}
.rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:5px;padding:2px 6px;flex:none}
.rrow.mine{box-shadow:inset 4px 0 0 var(--accent)}
.rrow.mine:not(.now){background:var(--accent-weak)}
.rest-hint{color:var(--accent);font-weight:600}
.rpick{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:4px 2px 4px 10px;margin:-4px 0;border-radius:8px;cursor:pointer;text-align:right;-webkit-tap-highlight-color:transparent}
.rpick:active{background:var(--press)}
.rpick .you{margin-bottom:3px}
/* Straight on to the next checklist */
.nextcl{appearance:none;border:0;width:100%;display:flex;align-items:center;gap:12px;margin:2px 0 calc(14px*var(--sp));padding:14px 14px 14px 16px;border-radius:16px;background:var(--accent);color:var(--on-accent);text-align:left;font:inherit}
.nextcl[hidden]{display:none}
.nextcl:active{filter:brightness(.92)}
.nextcl .nc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.nextcl small{font-size:calc(13px*var(--ts));font-weight:650;opacity:.82}
.nextcl b{font-size:calc(21px*var(--ts));font-weight:750;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextcl i{font-style:normal;font-size:calc(13px*var(--ts));opacity:.82}
.nextcl svg{width:26px;height:26px;flex:none;stroke-width:2.4}
.tb-chips.pair{column-gap:4px}
.tb-chips.pair .restchip{padding-right:9px}
.tb-chips.pair .etachip{padding:3px 9px}
.tb-chips.pair .etachip svg{display:none}
.chip.next{color:var(--accent);font-weight:700;cursor:pointer;max-width:55%;overflow:hidden;text-overflow:ellipsis}
/* Menu as live tiles */
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.mtiles button{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:14px;padding:10px 12px 11px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;font:inherit}
.mtiles button:active{background:var(--press)}
.mtiles .wide{grid-column:1/-1}
.mtiles .mi{display:flex;align-items:center;gap:7px;width:100%;font-size:calc(13px*var(--ts));color:var(--muted);font-weight:650;white-space:nowrap}
.mtiles .mi svg{width:18px;height:18px;color:var(--accent);flex:none}
.mtiles .mi .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:auto}
.mtiles b{font-size:calc(23px*var(--ts));font-weight:750;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;margin-top:5px;line-height:1.15;max-width:100%;white-space:nowrap}
.mtiles b.on{color:var(--done)}
.mtiles i{font-style:normal;font-size:calc(12.5px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.mtiles .wxcat{font-size:11px}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 -2px 2px}
.mrow button{appearance:none;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:5px;font:600 calc(13px*var(--ts)) -apple-system,system-ui,sans-serif;padding:9px 2px 8px;border-radius:12px;text-align:center}
.mrow button:active{background:var(--press)}
.mrow svg{width:22px;height:22px;color:var(--accent)}
.mrow .pri{background:var(--accent-weak);color:var(--accent)}

/* Reference tags: [FCOM] etc. in a check */
.rtag{display:inline-block;font-size:.7em;font-weight:750;letter-spacing:.03em;line-height:1.35;color:var(--muted);border:1px solid var(--line-strong);border-radius:5px;padding:0 5px;margin:0 3px;vertical-align:.12em;white-space:nowrap}
.label > .rtag:first-child{margin-left:0;margin-right:6px}
/* Checklist picker */
.lpks{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}
.lpk{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:13px;padding:11px 14px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;width:100%}
.lpk:active{background:var(--press)}
.lpk.on{border-color:var(--accent);background:var(--accent-weak)}
.lpk-t{display:flex;align-items:baseline;gap:10px;min-width:0}
.lpk-t b{flex:1;min-width:0;font-size:calc(17px*var(--ts));font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpk.on .lpk-t b{color:var(--accent)}
.lpk-t small{flex:none;font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px}
.lpk-t small svg{width:14px;height:14px;stroke-width:3}
.lpk.done .lpk-t small{color:var(--done)}
.lpk-bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lpk-bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.lpk.done .lpk-bar i{background:var(--done)}
/* Folded blocks say what is inside */
.mod-title .msub{display:none}
.module.collapsed .mod-title{display:flex;flex-direction:column;line-height:1.25}
.module.collapsed .mod-title .mt1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.module.collapsed .mod-title .msub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.msub b{color:var(--text);font-weight:650}
.module.collapsed .mod-toggle .apn-tag,.module.collapsed .mod-toggle .fl-tag{display:none}
.msub .wxcat{display:inline-block;font-size:10px;padding:0 5px;line-height:1.5;vertical-align:1px}

/* Links shown as a tag in the text, or as an icon at the right */
a.rtag.rl{color:var(--accent);border-color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-weak);text-decoration:none;font-size:.76em;padding:1px 5px 1px 6px}
a.rtag.rl svg{width:.95em;height:.95em;vertical-align:-.12em;margin-left:2px;stroke-width:2.6}
.rgo-w{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:center;margin-left:8px}
.rgo{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-size:calc(13px*var(--ts));font-weight:700;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.rgo svg{width:17px;height:17px;stroke-width:2.4;flex:none}
.rgo:active{filter:brightness(.92)}
.ls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.ls-row .fl{margin:0}
.ls-hint{font-size:calc(13px*var(--ts));color:var(--muted);margin:6px 2px 0;line-height:1.35}

/* Photos */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.thumb{appearance:none;padding:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;overflow:hidden;height:calc(88px*var(--sp));min-width:calc(88px*var(--sp));max-width:176px;display:block;position:relative}
.thumb img{display:block;height:100%;width:auto;min-width:100%;max-width:176px;object-fit:cover}
.ed-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ed-thumbs:empty{display:none}
.ed-thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.ed-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ed-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding:0}
.ed-x svg{width:14px;height:14px;stroke-width:2.6}
.missing img{display:none}
.missing::after{content:"Photo missing";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(11px*var(--ts));color:var(--muted);text-align:center}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.985);opacity:0;transition:opacity .18s}
.lb[hidden]{display:none}
.lb.show{opacity:1}
.lb-stage{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 60px) 8px calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lb-img{flex:none;max-width:none;max-height:none;transform-origin:50% 50%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;visibility:hidden}
.lb-img.ready{visibility:visible}
.lb-btn{position:absolute;appearance:none;border:0;width:44px;height:44px;border-radius:999px;background:rgba(18,22,28,.74);box-shadow:0 0 0 1px rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb-btn svg{width:22px;height:22px;stroke-width:2.4}
.lb-btn[hidden]{display:none}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 8px);right:10px}
.lb-prev,.lb-next{top:50%;margin-top:-22px}
.lb-prev{left:8px}
.lb-next{right:8px}
.lb-count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:60px;right:60px;text-align:center;color:#fff;font-size:15px;font-weight:600;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lb-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

@media (max-width:380px){
  main{padding-left:8px;padding-right:8px}
  .module{margin:8px}
  .mod-body{padding:0 8px 8px}
  .list-title{font-size:calc(30px*var(--ts))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
/* Briefing: the LIDO package with NOTAMs, weather and SIGMETs */
.nt-pkg{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 13px;margin:0 0 10px}
.nt-pkg-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nt-pkg-t b{flex:1 1 auto;font-size:calc(16px*var(--ts));font-weight:700}
.nt-pkg-t span{font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600}
.nt-pkg small{display:block;margin-top:3px;font-size:calc(13px*var(--ts));color:var(--muted)}
.nt-pkg .lnkbtn{font-size:inherit}
.nt-other{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line-soft);font-size:calc(13.5px*var(--ts));color:var(--warn);font-weight:600}
.nt-tabs{display:flex;width:100%;margin:12px 0 4px}
.nt-tabs button{flex:1;min-width:0;padding:9px 2px!important;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden}
.nt-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--warn);color:var(--paper);font-size:11.5px;font-weight:800;font-style:normal;flex:none}
@media (max-width:400px){.nt-tabs button{font-size:calc(13.5px*var(--ts))!important;gap:3px}.nt-tabs .nt-badge{min-width:17px;height:17px;padding:0 4px;font-size:10.5px}}
.nt-sec{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin:16px 3px 7px}
.nt-sec b{font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nt-sec span{font-size:calc(12.5px*var(--ts));color:var(--muted);font-weight:600}
.nt-card{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:12px;padding:10px 10px 10px 12px;margin:0 0 8px}
.nt-card.lv-mid,.nt-card.lv-low,.nt-card.lv-later,.nt-card.lv-none{border-left-color:var(--line-strong)}
.nt-card.read{border-left-color:var(--line)}
.nt-card.read .nt-main{opacity:.6}
.nt-main{flex:1;min-width:0;cursor:pointer}
.nt-top{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.nt-cat,.nt-why{font-size:11px;font-weight:750;letter-spacing:.03em;border-radius:5px;padding:1px 6px;text-transform:uppercase}
.nt-cat{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.nt-cat.rw{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.nt-cat.ap,.nt-cat.co{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.nt-why{color:var(--accent);border:1px solid var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.nt-head{font-size:calc(14.5px*var(--ts));font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.nt-card:not(.open) .nt-head{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt-when{font-size:calc(12.5px*var(--ts));color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.nt-id{font-family:ui-monospace,Menlo,monospace;font-size:.96em}
.nt-body{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);font:calc(13px*var(--ts))/1.45 ui-monospace,"SF Mono",Menlo,monospace;overflow-wrap:anywhere}
.nt-body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt-sch{font-weight:700;margin-bottom:4px}
.hw{color:var(--warn);font-weight:750}
.hr{color:var(--accent);font-weight:750}
.nt-tick{appearance:none;flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--box);background:none;display:grid;place-items:center;color:var(--on-done);padding:0;margin-top:1px}
.nt-card.read .nt-tick{background:var(--done);border-color:var(--done)}
.nt-tick svg{width:16px;height:16px;stroke-width:3}
.nt-fold{appearance:none;width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:11px;padding:10px 12px;margin:0 0 8px;font:inherit;font-size:calc(14px*var(--ts));font-weight:600;text-align:left}
.nt-fold span{flex:1}
.nt-fold em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.nt-fold svg{width:16px;height:16px;color:var(--muted);flex:none;transition:transform .15s}
.nt-fold.open svg{transform:rotate(90deg)}
.nt-in{margin:0 0 4px}
.nt-ap{display:flex;align-items:center;gap:8px;margin:16px 3px 4px}
.nt-ap b{font-size:calc(16px*var(--ts))}
.nt-ap span:not(.wxcat){flex:1;min-width:0;font-size:calc(13px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-apinfo{margin:0 3px 7px;font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.nt-none{font-size:calc(14px*var(--ts));color:var(--muted);margin:4px 3px 10px}
.nt-none.sm{font-size:calc(13.5px*var(--ts));margin:2px 3px 8px}
.nt-brief .nt-card{margin-bottom:7px}
.wxc.bare{margin:0 0 8px}
.wxc.bare>.wxl:first-child,.wxc.bare>.eta-strip:first-child{margin-top:0}
.br-rows{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 10px;margin-bottom:8px}
.br-row{appearance:none;width:100%;display:flex;align-items:center;gap:8px;border:0;border-top:1px solid var(--line-soft);background:none;color:var(--text);padding:11px 2px;font:inherit;text-align:left}
.br-rows>.br-row:first-child{border-top:0}
.br-row b{font-size:calc(15px*var(--ts));flex:none}
.br-row .n{flex:1;min-width:0;color:var(--muted);font-size:calc(13.5px*var(--ts));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-row em{font-style:normal;color:var(--muted);font-size:calc(13px*var(--ts));font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.br-row svg{width:16px;height:16px;color:var(--muted);flex:none;transition:transform .15s}
.br-row.open svg{transform:rotate(90deg)}
.br-era{font-style:normal;font-size:10.5px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px}
.br-rowin{padding:2px 0 6px}
.br-rowin .wxc.bare{background:var(--surface2)}
.br-load{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 4px}
.br-load-t{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.br-load-t .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;flex:none}
.br-load-t .ic svg{width:24px;height:24px}
.br-load-t b{font-size:calc(16.5px*var(--ts))}
.br-load-t p{margin:3px 0 0;color:var(--muted);font-size:calc(14px*var(--ts));line-height:1.4}
.br-load .btn{width:100%;cursor:pointer}
.pkg-box{position:relative;margin:12px 0 8px}
.pkg-drop{position:absolute;inset:0;z-index:1;border:2px dashed var(--line-strong);border-radius:14px;background:var(--paper);outline:none;caret-color:transparent;color:transparent;overflow:hidden;cursor:text;-webkit-user-select:text;user-select:text}
.pkg-drop:focus{border-style:solid;border-color:var(--accent)}
body.pkgdrag .pkg-drop,.pkg-box.busy .pkg-drop{border-color:var(--accent);background:var(--accent-weak)}
.pkg-lab{position:relative;z-index:2;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 16px;text-align:center;pointer-events:none;color:var(--muted)}

/* Flight strip under the clock: departure to arrival, a plane at the time now, your rest in purple */
:root{--rest:#7c5cd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rest:#a58cf0}}
:root[data-theme="dark"]{--rest:#a58cf0}:root[data-theme="night"]{--rest:#6c5fa0}:root[data-theme="red"]{--rest:#a3402f}
.fstrip{grid-column:1/-1;justify-self:center;width:100%;max-width:560px;position:relative;padding:25px 8px 1px;font-variant-numeric:tabular-nums;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;outline:none}

.fs-bar{position:relative;height:8px;border-radius:4px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line-soft)}

.fs-rs.past{opacity:.4}
.fs-pl{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:none}
.fs-pl svg{display:block;width:28px;height:28px;transform:rotate(90deg);fill:var(--accent);stroke:var(--bg);stroke-width:1.6;paint-order:stroke}
.fs-tag{position:absolute;top:1px;left:0;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:750;line-height:16px;white-space:nowrap}
.fs-tag svg{width:12px;height:12px;flex:none}
.fs-fl{color:var(--accent)}.fs-rt{color:var(--rest)}
.fs-lab{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;font-weight:650;color:var(--muted);white-space:nowrap}

#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app a{-webkit-touch-callout:default}
#app input,#app textarea,#app select,#app [contenteditable],#app .ie-in,#app .item.ie > .row{-webkit-user-select:text;user-select:text}
.lp-wrap,.lp-wrap *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

function safeUrl(u){

}
function linkName(l){return l.label||l.url.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'');}
// Tag style: a [FCOM] tag whose text matches a link's name opens that link; links with no matching tag are added as tags at the end
function lnKey(s){return String(s||'').replace(/^\s*\[/,'').replace(/\]\s*$/,'').trim().toLowerCase();}
function tagA(l,inner){return '<a class="rtag rl" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener" aria-label="Open '+esc(linkName(l))+'">'+inner+I.ext+'</a>';}

    var k=lnKey(x);
    for(var i=0;i<links.length;i++){if(k&&lnKey(esc(linkName(links[i])))===k){if(used) used[i]=1;return tagA(links[i],x);}}

/* ---------- Calculator maths ---------- */
// CALC-START
var OPS='+−×÷';
function fmtNumStr(s){
  s=String(s);var neg=false;
  if(s[0]==='−'||s[0]==='-'){neg=true;s=s.slice(1);}
  var dot=s.indexOf('.'),i=dot<0?s:s.slice(0,dot),d=dot<0?'':s.slice(dot);
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'−':'')+i+d;
}
function fmtExpr(e){
  var out='',num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(num){out+=fmtNumStr(num);num='';}
    var prev=e[j-1],binary=prev!==undefined&&/[\d.]/.test(prev);
    out+=(ch==='−'&&!binary)?'−':' '+ch+' ';
  }
  if(num) out+=fmtNumStr(num);
  return out.replace(/\s+/g,' ').trim();
}
function hasOp(e){return /[+×÷]/.test(e)||/[\d.]−/.test(e);}
function calcEval(e){
  var t=[],num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(OPS.indexOf(ch)>=0){
      if(num===''){if(ch==='−'){num='-';continue;}return null;}
      if(num==='-') return null;
      t.push(parseFloat(num));num='';t.push(ch);
    }
  }
  if(num!==''&&num!=='-') t.push(parseFloat(num));
  while(t.length&&typeof t[t.length-1]==='string') t.pop();
  if(!t.length) return null;
  for(var k=0;k<t.length;k++){if(typeof t[k]==='number'&&isNaN(t[k])) return null;}
  var a=[t[0]];
  for(var i=1;i<t.length;i+=2){
    var op=t[i],n=t[i+1];
    if(op==='×') a[a.length-1]*=n;
    else if(op==='÷') a[a.length-1]/=n;
    else a.push(op,n);
  }
  var r=a[0];
  for(var q=1;q<a.length;q+=2) r=a[q]==='+'?r+a[q+1]:r-a[q+1];
  if(!isFinite(r)) return 'err';
  r=parseFloat(r.toPrecision(12));
  var s=String(r);
  if(/e/i.test(s)) return 'err';
  return s.replace('-','−');
}
// CALC-END

// ---------- Reference sections: each heading is a card, notes read as text, no boxes ----------

// a short name is a title (bold); a sentence or a lead-in ("...from the:") reads as text

// ---------- the holdover time block: start of anti-icing and the HOT from the table; the app does the clock ----------

// an info sub-item under a check: one bullet, its links small and inline

function apStats(ic){
  var A=[],D=[];
  state.flights.forEach(function(f){if(f.arr.icao===ic) A.push(f);if(f.dep.icao===ic) D.push(f);});
  function cnt(list,fn){
    var m=new Map();
    list.forEach(function(f){var v=fn(f);if(!v) return;var k=v.toUpperCase(),e=m.get(k)||{v:v,n:0};e.n++;m.set(k,e);});
    return Array.from(m.values()).sort(function(a,b){return b.n-a.n;});
  }
  function tm(list,fn){
    var xs=list.map(fn).filter(function(x){return typeof x==='number';});
    if(!xs.length) return null;
    return {avg:Math.round(xs.reduce(function(a,b){return a+b;},0)/xs.length),min:Math.min.apply(null,xs),max:Math.max.apply(null,xs),n:xs.length};
  }
  var last='';A.concat(D).forEach(function(f){if(f.date>last) last=f.date;});
  var notes=[];
  A.forEach(function(f){if(f.arr.notes) notes.push({d:f.date,k:'arrival',t:f.arr.notes});});
  D.forEach(function(f){if(f.dep.notes) notes.push({d:f.date,k:'departure',t:f.dep.notes});});

var pdfP=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfP) return pdfP;
  pdfP=new Promise(function(res,rej){
    var sc=document.createElement('script');sc.src='lib/pdf.js';
    sc.onload=function(){
      if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.js';res(window.pdfjsLib);}
      else{pdfP=null;rej(brErr('The PDF reader didn’t start. Try again.'));}
    };
    sc.onerror=function(){pdfP=null;sc.remove();rej(brErr('The PDF reader isn’t on this iPad yet. Open the app once while online.'));};
    document.head.appendChild(sc);
  });
  return pdfP;
}
function brErr(msg){var e=new Error(msg);e.mine=true;return e;}
function fileBuf(file){
  if(file.arrayBuffer) return file.arrayBuffer();
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsArrayBuffer(file);});
}
// the page's text, line by line: items on one baseline join up, with a space where there's a gap
function pdfText(lib,buf){
  return lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
    var out=[],p=1;
    function next(){
      if(p>pdf.numPages){try{pdf.destroy();}catch(e){}return out.join('\n');}
      return pdf.getPage(p++).then(function(page){return page.getTextContent();}).then(function(tc){
        var line='',lastY=null,lastX=null;
        tc.items.forEach(function(it){
          if(!('str' in it)) return;
          var x=it.transform[4],y=it.transform[5];
          if(lastY!==null&&Math.abs(y-lastY)>2){out.push(line);line='';lastX=null;}
          if(lastX!==null&&x-lastX>1.5&&!/\s$/.test(line)&&it.str&&!/^\s/.test(it.str)) line+=' ';
          line+=it.str;lastX=x+it.width;lastY=y;
          if(it.hasEOL){out.push(line);line='';lastY=null;lastX=null;}
        });
        if(line) out.push(line);
        return next();
      });
    }
    return next();
  });
}

function pdfFromDT(dt){
  var L=[],i;

  for(i=0;i<L.length;i++){if(/pdf/i.test(L[i].type||'')||/\.pdf$/i.test(L[i].name||'')) return L[i];}
  for(i=0;i<L.length;i++){if(!L[i].type) return L[i];} // a pasted file without a type: worth a try
  return null;
}

/* Calculator */
function calcKey(id,k){
  var f=find(id);if(!f) return;
  var m=f.node,e=m.expr,last=e.slice(-1),wasFresh=fresh.has(id),seg;
  fresh.delete(id);
  if(/^\d$/.test(k)){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg==='0') e=e.slice(0,-1);
    e+=k;
  }else if(k==='.'){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg.indexOf('.')>=0) return;
    e+=seg===''?'0.':'.';
  }else if(OPS.indexOf(k)>=0){
    if(e===''||e==='−') e=k==='−'?'−':'';
    else if(OPS.indexOf(last)>=0){
      if(k==='−'&&(last==='×'||last==='÷')) e+='−';
      else{e=e.replace(/[+−×÷]+$/,'');e=e===''?(k==='−'?'−':''):e+k;}
    }else{if(last==='.') e+='0';e+=k;}
  }else if(k==='C'){e='';
  }else if(k==='del'){e=e.slice(0,-1);
  }else if(k==='='){
    var ev=e.replace(/[+−×÷]+$/,'');
    if(!hasOp(ev)){if(wasFresh) fresh.add(id);return;}
    var r=calcEval(ev);
    if(r===null) return;
    if(r==='err'){toast('Can’t divide by zero');return;}
    m.hist.push({e:fmtExpr(ev.replace(/\.$/,'')),r:r});
    if(m.hist.length>8) m.hist=m.hist.slice(-8);
    e=r;fresh.add(id);
  }
  m.expr=e;saveSoon();updateCalc(m);
}
function calcHist(id,r){
  var f=find(id);if(!f||!r) return;
  var m=f.node;
  if(/[+−×÷]$/.test(m.expr)){m.expr+=r;fresh.delete(id);}
  else{m.expr=r;fresh.add(id);}
  saveSoon();updateCalc(m);
}
function updateCalc(m){
  var el=app.querySelector('[data-mod="'+m.id+'"]');if(!el) return;
  el.querySelector('[data-expr]').textContent=fmtExpr(m.expr)||'0';
  el.querySelector('[data-prev]').innerHTML=prevHTML(m.expr);
  el.querySelector('[data-hist]').innerHTML=histHTML(m);
}

/* Notepad */
function inkColor(){return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';}
function mountPad(el,m){
  var cv=el.querySelector('canvas'),wrap=cv.parentElement,ctx=cv.getContext('2d');
  var scale=1,lastW=0,tool='pen',curS=null,ink=inkColor();
  function dpr(){return Math.min(window.devicePixelRatio||1,3);}
  function size(force){
    var w=wrap.clientWidth;if(!w) return;
    if(w===lastW&&!force) return;
    lastW=w;scale=w/LW;
    var hpx=Math.round(m.h*scale),d=dpr();
    cv.style.height=hpx+'px';
    cv.width=Math.round(w*d);cv.height=Math.round(hpx*d);
    ctx.setTransform(d*scale,0,0,d*scale,0,0);
    redraw();
  }
  function setStyle(s,p){
    ctx.globalCompositeOperation=s.t==='e'?'destination-out':'source-over';
    ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineCap='round';ctx.lineJoin='round';
    return s.t==='e'?s.w:s.w*(0.35+p*1.3);
  }
  function seg(s,i){
    var P=s.pts,a=(i-1)*3,b=i*3;
    ctx.lineWidth=setStyle(s,(P[a+2]+P[b+2])/2);
    ctx.beginPath();ctx.moveTo(P[a],P[a+1]);ctx.lineTo(P[b],P[b+1]);ctx.stroke();
  }
  function dot(s){
    var P=s.pts,w=setStyle(s,P[2]);
    ctx.beginPath();ctx.arc(P[0],P[1],w/2,0,Math.PI*2);ctx.fill();
  }
  function drawStroke(s){var n=s.pts.length/3;dot(s);for(var i=1;i<n;i++) seg(s,i);}
  function redraw(){
    ink=inkColor();
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
    m.strokes.forEach(drawStroke);
    ctx.globalCompositeOperation='source-over';
  }
  function pt(e,r){
    return [+((e.clientX-r.left)/scale).toFixed(1),+((e.clientY-r.top)/scale).toFixed(1),e.pointerType==='pen'?+((e.pressure||0.5).toFixed(2)):0.5];
  }
  function down(e){
    if(curS) return;
    if(e.pointerType==='touch'&&!state.settings.fingerDraw) return;
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    curS={id:e.pointerId,s:{t:tool==='eraser'?'e':'p',w:tool==='eraser'?18:2.3,pts:pt(e,cv.getBoundingClientRect())}};
    dot(curS.s);
  }
  function move(e){
    if(!curS||e.pointerId!==curS.id) return;
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    var list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!list.length) list=[e];
    for(var i=0;i<list.length;i++){
      var p=pt(list[i],r),P=curS.s.pts;
      if(Math.abs(p[0]-P[P.length-3])<0.4&&Math.abs(p[1]-P[P.length-2])<0.4) continue;
      P.push(p[0],p[1],p[2]);seg(curS.s,P.length/3-1);
    }
  }
  function up(e){
    if(!curS||e.pointerId!==curS.id) return;
    m.strokes.push(curS.s);curS=null;
    ctx.globalCompositeOperation='source-over';
    saveSoon();
  }
  // Stop Apple Pencil (or a finger, when finger drawing is on) from scrolling the page
  function tstop(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].touchType==='stylus'||state.settings.fingerDraw){e.preventDefault();return;}
    }
  }
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('touchstart',tstop,{passive:false});
  cv.addEventListener('touchmove',tstop,{passive:false});
  var ro=window.ResizeObserver?new ResizeObserver(function(){size(false);}):null;
  if(ro) ro.observe(wrap);else window.addEventListener('resize',function(){size(false);});
  size(true);
  return {
    redraw:redraw,
    resize:function(){size(true);},
    setTool:function(t){tool=t;el.querySelectorAll('[data-act="padTool"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});},
    undo:function(){if(!m.strokes.length) return;m.strokes.pop();redraw();saveSoon();},
    dispose:function(){if(ro) ro.disconnect();}
  };
}

function promptSheet(title,value,ph,onOk,onCancel){
  openSheet('<h3>'+esc(title)+'</h3><div class="fld"><input id="fPrompt" type="text" value="'+esc(value)+'" placeholder="'+esc(ph)+'" autocomplete="off"></div>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button><button type="button" class="btn primary" data-sact="ok">Save</button></div>',
    function(act){
      if(act==='ok'){var v=$('#fPrompt').value.trim();if(!v){$('#fPrompt').focus();return;}closeSheet();onOk(v);}
      else{closeSheet();if(onCancel) onCancel();}
    });
  var inp=$('#fPrompt');inp.focus();inp.select();
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(sheetHandler) sheetHandler('ok');}});
}
function linkRowHTML(l){
  return '<div class="link-row"><input type="text" class="lLabel" value="'+esc(l.label)+'" placeholder="Label, e.g. FCOM" autocomplete="off">'+
    '<input type="text" class="lUrl" value="'+esc(l.url)+'" placeholder="docunet://… or https://…" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">'+
    '<button type="button" class="ib danger" data-sact="rmLink" aria-label="Remove link">'+I.x+'</button></div>';
}
function edThumbsHTML(imgs){
  return imgs.map(function(im){return '<div class="ed-thumb"><img data-img="'+esc(im)+'" alt=""><button type="button" class="ed-x" data-sact="rmImg" data-v="'+esc(im)+'" aria-label="Remove photo">'+I.x+'</button></div>';}).join('');
}
function openItemEditor(id,isNew,backTo){
  var f=find(id);if(!f) return;
  function back(){if(backTo&&find(backTo)) openItemEditor(backTo,false);}
  var it=f.node,n=f.arr.length,imgs=(it.imgs||[]).slice(),busy=0,info=!!it.info;
  var kind=it.dq?'dec':it.end?'end':it.fld?'fld':(info?'info':'check'),fk=it.fld?it.fld.k:'text',fopts=it.fld?it.fld.opts.join('\n'):'',endTone=it.end||'go',ls=it.ls==='tag'||it.ls==='icon'?it.ls:'button';
  var LS_HINT={button:'A button under the text, as before.',tag:'A tag in the item or its note opens the link with the same name, e.g. [OM-C 10.3.12] opens the link named OM-C 10.3.12. A link with no matching tag is added as a tag at the end.',
    icon:'A round ↗ button at the right of the row.'};
  function lsVis(){var r=$('#fLsRow');if(r) r.hidden=!sheetEl.querySelector('.link-row');}
  var inKids=f.anc.length&&f.arr===f.anc[f.anc.length-1].children,allowDec=!f.apn&&!inKids;
  // an airport note can be a row or text on its own; until one is picked it follows its section's style
  var topNote=!!(f.apn&&!f.anc.length),lay=isLay(it.lay)?it.lay:'';
  function secLayOf(sid){var x=state.apSections.filter(function(s){return s.id===sid;})[0];return layOf(x&&x.lay);}
  var lay0=lay||(topNote?secLayOf(f.apn.sec):'rows');
  function layUI(){
    var ss=$('#fApSec'),v=lay||secLayOf(ss?ss.value:f.apn.sec);
    sheetEl.querySelectorAll('#fLay button').forEach(function(b){var on=b.getAttribute('data-v')===v;b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));});
  }
  var answers=(it.dq||[{id:uid(),label:'YES',tone:'y',items:[]},{id:uid(),label:'NO',tone:'n',items:[]}]).map(function(x){return {id:x.id,label:x.label,tone:x.tone,items:x.items};});
  var TYPE_HINT={check:'Tap the item in the checklist to tick it. Dots between a check and its response, like “Parking brake .... SET”, line the response up on the right. Three spaces put the rest on the right without dots.',info:'Info items have no tick and aren’t counted in the progress.',
    fld:'A box to fill in for this flight. The answer stays until New flight, or until you choose Untick and clear answers.',
    dec:'Shows answer buttons. The steps for each answer are added in Edit mode: tap an answer under the question.',end:'Closes the procedure, e.g. Continue operation or Return to stand.'};
  function ansRowsHTML(){
    return answers.map(function(a,i){
      return '<div class="ansr"><button type="button" class="tone t-'+decTone(a.tone)+'" data-sact="ansTone" data-i="'+i+'" aria-label="Change colour"></button>'+
        '<input type="text" data-ai="'+i+'" value="'+esc(a.label)+'" placeholder="Answer" maxlength="40" autocomplete="off">'+(a.items.length?'<small>'+a.items.length+' step'+(a.items.length>1?'s':'')+'</small>':'')+
        '<button type="button" class="ib danger" data-sact="ansDel" data-i="'+i+'" aria-label="Remove answer">'+I.x+'</button></div>';
    }).join('');
  }
  function syncAns(){sheetEl.querySelectorAll('[data-ai]').forEach(function(inp){var a=answers[+inp.getAttribute('data-ai')];if(a) a.label=inp.value;});}
  var FK=[['text','Text'],['num','Number'],['yn','Yes/No'],['list','List'],['time','Time']];
  var FK_HINT={text:'Type anything, e.g. ICE 2 · 131.925',num:'Opens the number keypad, e.g. 75 or −3',yn:'Two buttons, Yes and No. Tap again to clear.',
    list:'Tap the field to choose one of your choices.',time:'A UTC time as HHMM, with a Now button.'};
  function kindUI(){
    sheetEl.querySelectorAll('#fType button').forEach(function(b){var on=b.getAttribute('data-v')===kind;b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));});
    $('#fTypeHint').textContent=TYPE_HINT[kind];
    $('#fTextLab').textContent=kind==='dec'?'Question':kind==='end'?'Text':kind==='fld'?'Label':'Item';
    $('#fText').placeholder=kind==='end'?'Optional':kind==='dec'?'e.g. Is dispatch allowed?':kind==='fld'?'e.g. Provider callsign and frequency':'e.g. TCAS BELOW';
    $('#fAnsBlk').hidden=kind!=='dec';$('#fEndBlk').hidden=kind!=='end';$('#fFldBlk').hidden=kind!=='fld';
    var rf=$('#fRemFld');if(rf) rf.hidden=kind==='dec'||kind==='end'||kind==='fld';
    var sb=$('#fSubBlk');if(sb) sb.hidden=kind==='dec'||kind==='end'||kind==='fld';
  }
  var r0=it.rem,remMode=r0?r0.mode:'off',remLead=r0&&r0.mode==='at'?r0.lead:0,remTimes=r0&&r0.mode==='at'?r0.times.join(' '):'',
      remCd=r0&&r0.mode==='cd'?r0.cd:'@eta',remMin=r0&&r0.mode==='cd'?String(r0.min):'';
  function remBodyHTML(){
    if(remMode==='at') return '<div class="rem-body"><input id="fRemTimes" type="text" inputmode="numeric" value="'+esc(remTimes)+'" placeholder="e.g. 0430 1030 1630" autocomplete="off">'+
      '<div class="seg lead" id="fRemLead">'+[[0,'On time'],[5,'−5'],[10,'−10'],[15,'−15'],[30,'−30']].map(function(x){return '<button type="button" data-sact="remLead" data-v="'+x[0]+'" class="'+(remLead===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div>'+
      '<p class="hint" style="margin:6px 0 0">UTC times, every day. Alert on time or minutes before, while the app is open. A ticked item is unticked when its reminder comes.</p></div>';
    if(remMode==='cd'){
      return '<div class="rem-body rem-cd"><select id="fRemCd" class="ap-tz">'+[{id:'@etd',title:'ETD'},{id:'@eta',title:'ETA'}].concat(state.tools.cds).map(function(c){return '<option value="'+c.id+'"'+(c.id===remCd?' selected':'')+'>'+esc(c.title)+'</option>';}).join('')+'</select>'+
        '<label class="rem-min"><input id="fRemMin" type="text" inputmode="numeric" maxlength="3" value="'+esc(remMin)+'" placeholder="40"><span>min before</span></label></div>'+
        '<p class="hint" style="margin:6px 0 0">Goes off that long before the time, e.g. 40 min before ETA or TOD. ETD and ETA are set in the Flight sheet (tap the clock), countdowns in Timers.</p>';
    }
    return '';
  }
  function remRead(){
    var a=$('#fRemTimes');if(a) remTimes=a.value;
    var b=$('#fRemCd');if(b) remCd=b.value;
    var c=$('#fRemMin');if(c) remMin=c.value;
  }
  function remBuild(strict){
    remRead();
    if(f.apn||remMode==='off'||kind==='dec'||kind==='end'||kind==='fld') return {ok:true,rem:null};
    if(remMode==='at'){
      var parts=remTimes.split(/[\s,;\/]+/).filter(Boolean),out=[],bad=false;
      parts.forEach(function(x){var m=parseHM(x);if(m===null) bad=true;else out.push(hmZ(m).slice(0,4));});
      if(strict&&(bad||!out.length)) return {ok:false,msg:'Enter the times as HHMM, e.g. 0430 1030'};
      var r=normRem({mode:'at',times:out,lead:remLead});
      return {ok:true,rem:r};
    }
    var mn=parseInt(String(remMin).replace(/[^0-9]/g,''),10);
    if(strict&&(!remCd||!isFinite(mn))) return {ok:false,msg:remCd?'Enter the minutes before the countdown':'Add a countdown first'};
    return {ok:true,rem:remCd&&isFinite(mn)?normRem({mode:'cd',cd:remCd,min:mn}):null};
  }
  function remSame(a,b){return JSON.stringify(a&&{m:a.mode,t:a.times,l:a.lead,c:a.cd,n:a.min})===JSON.stringify(b&&{m:b.mode,t:b.times,l:b.lead,c:b.cd,n:b.min});}
  var pi=f.arr.indexOf(it),canIn=pi>0&&nestOK(f,f.arr[pi-1]),canOut=!!parentOf(f),noKids=kind==='dec'||kind==='end'||kind==='fld';
  function kidRows(){return (it.children||[]).map(function(k){
    var mk=k.dq?'<span class="ol-mk">'+I.diamond+'</span>':k.fld?'<span class="ol-mk ol-i">'+I.field+'</span>':k.info?'<span class="ol-mk ol-i">'+I.info+'</span>':'<span class="box'+(k.done?' on':'')+'">'+(k.done?I.check:'')+'</span>';
    return '<button type="button" class="pg-kid" data-sact="kid" data-id="'+k.id+'">'+mk+'<span class="t">'+olText(k)+'</span>'+((k.children||[]).length?'<em>'+k.children.length+'</em>':'')+I.right+'</button>';
  }).join('');}
  pgCur=id;
  openSheet('<h3>'+(f.apn?(isNew?'New note for '+esc(f.apn.icao):'Note'):(isNew?'New item':'Item'))+'</h3>'+
    (f.apn&&!f.anc.length?'<label class="fld"><span class="fl">Section</span><select id="fApSec" class="ap-tz">'+state.apSections.map(function(x){return '<option value="'+x.id+'"'+(x.id===f.apn.sec?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select></label>':'')+

    '<div class="pg-grp pg-tn"><label><span class="vh" id="fTextLab">'+(kind==='dec'?'Question':kind==='end'?'Text':kind==='fld'?'Label':'Item')+'</span><input id="fText" type="text" value="'+esc(it.text)+'" placeholder="'+(kind==='end'?'Optional':kind==='dec'?'e.g. Is dispatch allowed?':kind==='fld'?'e.g. Provider callsign and frequency':'e.g. TCAS .... BELOW')+'" autocomplete="off" enterkeyhint="'+(isNew?'next':'done')+'"></label>'+
      '<label><span class="vh">Note</span><textarea id="fNote" rows="2" placeholder="Note (optional), shown under it">'+esc(it.note)+'</textarea></label></div>'+
    '<div class="fld"><span class="fl">Type</span><div class="seg big type-seg'+(allowDec?' five':f.apn?'':' three')+'" id="fType" role="radiogroup" aria-label="Item type">'+
      [['check',I.tickbox,'Checkbox'],['info',I.info,'Info']].concat(f.apn?[]:[['fld',I.field,'Field']]).concat(allowDec?[['dec',I.diamond,'Decision'],['end',I.flag,'End']]:[]).map(function(x){
        return '<button type="button" role="radio" aria-checked="'+(kind===x[0])+'" class="'+(kind===x[0]?'on':'')+'" data-sact="type" data-v="'+x[0]+'">'+x[1]+x[2]+'</button>';
      }).join('')+'</div>'+
    '<p class="hint" id="fTypeHint" style="margin:8px 0 0">'+TYPE_HINT[kind]+'</p></div>'+
    '<div class="fld" id="fAnsBlk"'+(kind==='dec'?'':' hidden')+'><span class="fl">Answers <em>(tap the colour to change it)</em></span><div class="ansl" id="fAns">'+ansRowsHTML()+'</div>'+
      '<button type="button" class="btn small ghost" data-sact="ansAdd">'+I.plus+'Add answer</button></div>'+
    '<div class="fld" id="fFldBlk"'+(kind==='fld'?'':' hidden')+'><span class="fl">Answer</span><div class="seg big fk-seg" id="fFk" role="radiogroup" aria-label="Answer">'+
      FK.map(function(x){var on=fk===x[0];return '<button type="button" role="radio" aria-checked="'+on+'" class="'+(on?'on':'')+'" data-sact="fk" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>'+
      '<label class="fld" id="fOptsFld"'+(fk==='list'?'':' hidden')+' style="margin:10px 0 0"><span class="fl">Choices <em>(one per line)</em></span><textarea id="fOpts" rows="4" placeholder="e.g. Type I">'+esc(fopts)+'</textarea></label>'+
      '<p class="hint" id="fFkHint" style="margin:8px 0 0">'+FK_HINT[fk]+'</p></div>'+
    '<div class="fld" id="fEndBlk"'+(kind==='end'?'':' hidden')+'><span class="fl">Colour</span><div class="seg big" id="fEndTone" style="display:grid;grid-template-columns:1fr 1fr">'+
      '<button type="button" data-sact="endTone" data-v="go" class="'+(endTone==='go'?'on':'')+'">Green · go</button><button type="button" data-sact="endTone" data-v="stop" class="'+(endTone==='stop'?'on':'')+'">Amber · stop</button></div></div>'+
    '<div class="fld" id="fSubBlk"'+(noKids?' hidden':'')+'><span class="fl">Sub-items</span><div class="pg-grp pg-list" id="fKids">'+kidRows()+'<button type="button" class="pg-add" data-sact="sub">'+I.plus+'Add sub-item</button></div></div>'+
    '<div class="fld"><span class="fl">Links</span><div class="pg-grp pg-list"><div id="fLinks">'+it.links.map(linkRowHTML).join('')+'</div><button type="button" class="pg-add" data-sact="addLink">'+I.plus+'Add link</button></div></div>'+
    '<div class="fld"><span class="fl">Photos</span><div class="pg-grp pg-ph"><div class="ed-thumbs" id="fImgs">'+edThumbsHTML(imgs)+'</div><input type="file" id="fPhoto" class="vh" accept="image/*" multiple><label class="pg-add" for="fPhoto">'+I.photo+'Add photo</label></div></div>'+
    (f.apn?'':'<div class="fld" id="fRemFld"'+(kind==='dec'||kind==='end'||kind==='fld'?' hidden':'')+'><span class="fl">Reminder</span><div class="seg big" id="fRem" style="display:grid;grid-template-columns:.8fr 1fr 1.2fr">'+
      [['off','Off'],['at','Times'],['cd','Countdown']].map(function(x){return '<button type="button" data-sact="remMode" data-v="'+x[0]+'" class="'+(remMode===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+
      '</div><div id="fRemBody"></div></div>')+
    (f.tool?'':'<div class="pg-two"><button type="button" class="btn small" data-sact="out"'+(canOut?'':' disabled')+'>'+IC_OUT+'Out a level</button><button type="button" class="btn small" data-sact="in"'+(canIn?'':' disabled')+'>'+IC_IN+'In a level</button></div>')+
    '<div class="pg-grp pg-list pg-acts">'+(isNew||f.apn||f.tool?'':'<button type="button" data-sact="dup">'+I.copy+'Duplicate</button><button type="button" data-sact="move">'+I.move+'Move to another section</button>')+'<button type="button" class="dg" data-sact="del">'+I.trash+'Delete</button></div>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button><button type="button" class="btn primary" data-sact="save">Save</button></div>',
  function(act,btn){
    function commit(){
      it.text=$('#fText').value.trim();
      it.note=$('#fNote').value.replace(/\s+$/,'');
      it.links=Array.prototype.map.call(sheetEl.querySelectorAll('.link-row'),function(r){return {label:r.querySelector('.lLabel').value.trim(),url:r.querySelector('.lUrl').value.trim()};}).filter(function(l){return l.url;});
      if(ls==='button') delete it.ls;else it.ls=ls;
      it.imgs=imgs.slice();
      it.info=info;if(info) it.done=false;
      if(topNote) delete it.lay;
      var rb=remBuild(false);
      if(!remSame(rb.rem,it.rem)) it.rem=rb.rem?remMark(rb.rem):null;
      syncAns();
      if(kind==='dec'){
        it.dq=answers.map(function(a,i){return {id:a.id,label:(a.label.trim()||('Answer '+(i+1))).slice(0,40),tone:decTone(a.tone),items:a.items};});
        if(!it.dq.some(function(x){return x.id===it.ans;})) it.ans='';
        it.info=false;it.done=false;it.rem=null;delete it.end;
      }else if(kind==='end'){it.end=endTone;it.info=false;it.done=false;it.rem=null;delete it.dq;delete it.ans;}
      else{delete it.dq;delete it.ans;delete it.end;}
      if(kind==='fld'){
        var op=($('#fOpts')?$('#fOpts').value:'').split('\n').map(function(x){return x.trim().slice(0,80);}).filter(Boolean).slice(0,40);
        var keep=it.fld&&it.fld.k===fk?it.fld.val:'';if(fk==='list'&&op.indexOf(keep)<0) keep='';if(fk==='yn'&&keep!=='Y'&&keep!=='N') keep='';
        it.fld={k:fk,opts:fk==='list'?op:[],val:keep};it.info=true;it.done=false;it.rem=null;it.children=[];
      }else delete it.fld;
    }
    if(busy&&['save','saveNext','up','down','sub','del','move','kid','in','out','dup'].indexOf(act)>=0){toast('Still adding photos…');return;}
    if(act==='remMode'){remRead();remMode=btn.getAttribute('data-v');sheetEl.querySelectorAll('#fRem button').forEach(function(b){b.classList.toggle('on',b===btn);});$('#fRemBody').innerHTML=remBodyHTML();var ft=$('#fRemTimes')||$('#fRemMin');if(ft) ft.focus();return;}
    if(act==='remLead'){remLead=+btn.getAttribute('data-v');sheetEl.querySelectorAll('#fRemLead button').forEach(function(b){b.classList.toggle('on',b===btn);});return;}
    if(act==='save'&&kind==='fld'&&fk==='list'&&!$('#fOpts').value.trim()){toast('Add the choices, one per line');$('#fOpts').focus();return;}
    if(act==='save'){var rv=remBuild(true);if(!rv.ok){toast(rv.msg);var fx=$('#fRemTimes')||$('#fRemMin');if(fx) fx.focus();return;}}
    var j,k;
    switch(act){
      case 'type':
        var nk=btn.getAttribute('data-v');if(nk===kind) break;
        if((nk==='dec'||nk==='end'||nk==='fld')&&it.children.length){toast('Remove its sub-items first');break;}
        syncAns();
        if(kind==='dec'&&answers.some(function(a){return a.items.length;})){toast('Remove the steps under its answers first');break;}
        kind=nk;info=kind==='info'||kind==='fld';
        kindUI();break;
      case 'ansAdd':
        syncAns();if(answers.length>=6){toast('Up to 6 answers');break;}
        answers.push({id:uid(),label:'',tone:'o',items:[]});$('#fAns').innerHTML=ansRowsHTML();
        var al=sheetEl.querySelectorAll('[data-ai]');al[al.length-1].focus();break;
      case 'ansTone':
        syncAns();var ai=+btn.getAttribute('data-i');answers[ai].tone={y:'n',n:'o',o:'y'}[decTone(answers[ai].tone)];$('#fAns').innerHTML=ansRowsHTML();break;
      case 'ansDel':
        syncAns();var ad=+btn.getAttribute('data-i');
        if(answers.length<=2){toast('A decision needs at least two answers');break;}
        if(answers[ad].items.length){toast('That answer has steps. Remove them first.');break;}
        answers.splice(ad,1);$('#fAns').innerHTML=ansRowsHTML();break;
      case 'lay':
        lay=layOf(btn.getAttribute('data-v'));layUI();break;
      case 'fk':
        fk=btn.getAttribute('data-v');
        sheetEl.querySelectorAll('#fFk button').forEach(function(b){var on=b===btn;b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));});
        $('#fOptsFld').hidden=fk!=='list';$('#fFkHint').textContent=FK_HINT[fk];if(fk==='list') $('#fOpts').focus();break;
      case 'endTone':
        endTone=btn.getAttribute('data-v');sheetEl.querySelectorAll('#fEndTone button').forEach(function(b){b.classList.toggle('on',b===btn);});break;
      case 'addLink':
        var d=document.createElement('div');d.innerHTML=linkRowHTML({label:'',url:''});
        var row=d.firstElementChild;$('#fLinks').appendChild(row);row.querySelector('.lLabel').focus();lsVis();break;
      case 'rmLink': btn.closest('.link-row').remove();lsVis();break;
      case 'ls':
        ls=btn.getAttribute('data-v');
        sheetEl.querySelectorAll('#fLs button').forEach(function(b){var on=b===btn;b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));});
        $('#fLsHint').textContent=LS_HINT[ls];break;
      case 'rmImg':
        k=imgs.indexOf(btn.getAttribute('data-v'));if(k>=0) imgs.splice(k,1);
        refreshThumbs();break;
      case 'save':
        commit();
        if(isNew&&!it.end&&!it.text&&!it.note&&!it.links.length&&!it.imgs.length&&!it.children.length) removeNode(f);
        else{
          var ss=$('#fApSec');
          if(ss&&f.apn&&ss.value!==f.apn.sec){var k2=f.arr.indexOf(it);if(k2>=0) f.arr.splice(k2,1);apArr(f.apn.icao,ss.value).push(it);}
        }
        save();closeSheet();render();back();break;
      case 'saveNext': // Return in a new item: keep it and start the next one below
        commit();
        if(!it.text&&!it.note&&!it.links.length&&!it.imgs.length&&!it.children.length){removeNode(f);save();closeSheet();render();back();break;}
        save();var nn=newCheck();if(plainItem(it)) nn.info=it.info;
        f.arr.splice(f.arr.indexOf(it)+1,0,nn);render();openItemEditor(nn.id,true,backTo);break;
      case 'cancel':
        if(isNew&&!it.children.length){removeNode(f);save();render();}
        closeSheet();back();break;
      case 'kid':
        commit();save();var kd=btn.getAttribute('data-id');closeSheet();render();openItemEditor(kd,false,id);break;
      case 'in': case 'out':
        commit();var lf=find(id);
        if(lf&&(act==='in'?indentNode(lf):outdentNode(lf))){save();render();openItemEditor(id,isNew,backTo);}
        else toast(act==='in'?'There’s no item above that can hold it':'Already at the top level');
        break;
      case 'dup':
        commit();var cp=dupNode(it);f.arr.splice(f.arr.indexOf(it)+1,0,cp);save();closeSheet();render();flash(cp.id);toast('Duplicated. The copy is right below.',2400);break;
      case 'up': case 'down':
        commit();j=f.arr.indexOf(it)+(act==='up'?-1:1);
        if(j<0||j>=f.arr.length) return;
        f.arr.splice(f.arr.indexOf(it),1);f.arr.splice(j,0,it);
        save();closeSheet();render();flash(it.id);break;
      case 'move':
        commit();save();openMoveSheet(id);break;
      case 'sub':
        commit();var nk=newCheck();it.children.push(nk);it.open=true;
        save();render();openItemEditor(nk.id,true,id);break;

function storRefresh(){
  var row=$('#storRow');if(!row) return;
  var done=function(est){var r=$('#storRow');if(r) r.innerHTML=storRowHTML(est);};
  try{if(navigator.storage&&navigator.storage.estimate){navigator.storage.estimate().then(done,function(){done(null);});return;}}catch(e){}
  done(null);
}
function storPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persisted) return;
    navigator.storage.persisted().then(function(p){return p||(navigator.storage.persist?navigator.storage.persist():false);})
      .then(function(v){storP=!!v;storRefresh();},function(){});
  }catch(e){}
}

function tileTime(min){min=Math.max(0,Math.ceil(min));return Math.floor(min/60)+':'+pad2(min%60);}

    var m=up[0]||set.slice().sort(function(a,b){return b.target-a.target;})[0],diff=m.target-now,more=set.length>1?' · +'+(set.length-1)+' more':'';

/* ---------- Online backup: a private GitHub repository, while the app is open and online ---------- */
var CKEY='flightChecklist.cloud',CLOUD_QUIET=60000,CLOUD_GAP=180000;
function loadCloud(){
  var c=null;try{c=JSON.parse(localStorage.getItem(CKEY)||'null');}catch(e){}
  if(!c||typeof c!=='object') c={};
  return {repo:str(c.repo),token:str(c.token),on:!!(c.on&&c.repo&&c.token),photos:c.photos!==false,sha:str(c.sha),hash:str(c.hash),
    last:+c.last||0,err:str(c.err),kind:str(c.kind),up:Array.isArray(c.up)?c.up.filter(function(x){return typeof x==='string';}):[]};
}
var cloud=loadCloud(),cloudUp=new Set(cloud.up),cloudBusy=false,cloudProg='',cloudTickHash='',cloudChangedAt=0,cloudRetryAt=0;
function saveCloud(){cloud.up=Array.from(cloudUp);try{localStorage.setItem(CKEY,JSON.stringify(cloud));}catch(e){}}
function strHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+'.'+s.length;}
function b64utf8(s){var b=new TextEncoder().encode(s),out='';for(var i=0;i<b.length;i+=0x8000) out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(out);}
function ghFetch(repo,token,method,path,body,accept){
  var o={method:method,cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':accept||'application/vnd.github+json'}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  return fetch('https://api.github.com/repos/'+repo+path,o);
}
function gh(method,path,body,accept){return ghFetch(cloud.repo,cloud.token,method,path,body,accept);}
function ghErr(r){
  var e=new Error('GitHub '+r.status);e.status=r.status;
  if((r.status===403||r.status===429)&&(r.headers.get('retry-after')||r.headers.get('x-ratelimit-remaining')==='0')) e.status=429; // asked to slow down
  return e;
}
function okJson(r){if(!r.ok) throw ghErr(r);return r.json();}
function whenZ(ms){
  var d=new Date(ms),n=new Date(),z=hmZ(d.getUTCHours()*60+d.getUTCMinutes());
  if(d.toISOString().slice(0,10)===n.toISOString().slice(0,10)) return z;
  return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+z;
}
function cloudPending(){
  var json=JSON.stringify(state,null,1);
  return {json:json,h:strHash(json),photos:cloud.photos?Array.from(allImgIds()).filter(function(id){return !cloudUp.has(id);}):[]};
}
function cloudDataSha(){
  return gh('GET','/contents/data.json',null,'application/vnd.github.object+json').then(function(r){
    if(r.status===404) return '';
    return okJson(r).then(function(j){return j.sha||'';});
  });

/* ---------- Search: checklists, airport notes and the flight log ---------- */
function srWords(q){return q.toLowerCase().split(/\s+/).filter(Boolean);}
function srRx(words){return new RegExp('('+words.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','gi');}
function srHL(text,words){
  if(!text) return '';
  return String(text).split(srRx(words)).map(function(part,i){return i%2?'<mark>'+esc(part)+'</mark>':esc(part);}).join('');
}
function srSnip(text,words){
  text=String(text||'').replace(/\s+/g,' ').trim();if(!text) return '';
  var low=text.toLowerCase(),i=-1;
  words.forEach(function(w){var k=low.indexOf(w);if(k>=0&&(i<0||k<i)) i=k;});
  if(i<0) return text.length>110?srHL(text.slice(0,110),words)+'…':srHL(text,words);
  var a=Math.max(0,i-35),b=Math.min(text.length,i+85);
  return (a>0?'…':'')+srHL(text.slice(a,b),words)+(b<text.length?'…':'');
}
function searchAll(q){
  var words=srWords(q);if(!words.length) return null;
  function hit(){var t=Array.prototype.join.call(arguments,' ').toLowerCase();return words.every(function(w){return t.indexOf(w)>=0;});}
  var items=[],notes=[],flights=[];
  state.lists.forEach(function(L){L.sections.forEach(function(sec){
    (function w(arr,path){arr.forEach(function(n){
      if(n.type==='head'){if(hit(n.title)) items.push({id:n.id,t:n.title,p:L.title+' › '+sec.title,n:''});}
      else if(n.type==='check'){
        if(hit(n.text,n.note,n.links.map(function(l){return l.label;}).join(' '))) items.push({id:n.id,t:n.text,p:L.title+' › '+sec.title+(path.length?' › '+path.join(' › '):''),n:n.note});
        w(n.children,path.concat([n.text]));
        (n.dq||[]).forEach(function(x){w(x.items,path.concat([(n.text||'Question')+' '+x.label]));});
      }else if(n.type==='pad'&&n.text&&hit(n.title,n.text)) items.push({id:n.id,t:n.title,p:L.title+' › '+sec.title,n:n.text});
    });})(sec.items,[]);
  });});
  Object.keys(state.apNotes).sort().forEach(function(ic){
    var a=state.apNotes[ic];
    state.apSections.forEach(function(sx){
      (function w(arr){(arr||[]).forEach(function(n){
        if(hit(ic,n.text,n.note,n.links.map(function(l){return l.label;}).join(' '))) notes.push({id:n.id,ic:ic,sec:sx.id,t:n.text,p:ic+' · '+sx.name,n:n.note});
        w(n.children);
      });})(a[sx.id]);
    });
  });
  flSorted().forEach(function(f){
    var d=f.dep,a=f.arr;
    if(hit(fmtDay(f.date),f.date,f.fno,f.reg,d.icao,d.stand,d.rwy,d.sid,d.taxi,d.notes,a.icao,a.star,a.app,a.rwy,a.taxi,a.stand,a.notes))
      flights.push({id:f.id,t:fmtDay(f.date)+' · '+(d.icao||'—')+' → '+(a.icao||'—')+(f.fno?' · '+f.fno:''),p:flRouteSub(f),n:[d.notes,a.notes].filter(Boolean).join(' / ')});
  });
  return {words:words,items:items,notes:notes,flights:flights};
}
function searchHTML(q){

  if(!R) return '<p class="hint">Type a word, an airport code, a runway or a stand.</p>';
  var w=R.words,h='';

    if(!list.length) return;
    h+='<div class="sr-h">'+title+' ('+list.length+')</div><div class="sr-list">'+list.slice(0,25).map(function(x){
      var snip=x.n?srSnip(x.n,w):'';

/* ---------- Time: UTC clock, destination, countdowns, crew rest ---------- */
// TIME-START
function pad2(n){return (n<10?'0':'')+n;}
function parseHM(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  if(t.length===3) t='0'+t;
  if(t.length!==4) return null;
  var h=+t.slice(0,2),m=+t.slice(2);
  if(h>23||m>59) return null;
  return h*60+m;
}
function hmZ(min){min=((Math.round(min)%1440)+1440)%1440;return pad2(Math.floor(min/60))+pad2(min%60)+'Z';}
function durHM(min){min=Math.round(min);return Math.floor(min/60)+':'+pad2(min%60);}
function durClock(ms){
  var t=Math.ceil(Math.abs(ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h+':'+pad2(m)+':'+pad2(s);
}
// Next occurrence of an HHMM UTC time; up to 30 minutes in the past counts as today
function targetFromHM(min,now){
  var d=new Date(now),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())+min*60000;
  if(t<now-30*60000) t+=86400000;
  return t;
}
function restCalc(m){
  var s=parseHM(m.start),e=parseHM(m.end);
  if(s===null||e===null) return {err:'Enter the rest start and end times in UTC.'};
  if(e<=s) e+=1440;
  var total=e-s,n=m.n,B=m.buffer,usable=total-B*(n-1);
  if(usable<n*10) return {err:'The rest window is too short for '+n+' break'+(n>1?'s':'')+'.'};
  var L=usable/n,rows=[];
  for(var i=0;i<n;i++){
    var bs=s+i*(L+B),be=bs+L;
    if(i>0) bs=m.round?Math.round(bs/5)*5:Math.round(bs);
    be=(i===n-1)?e:(m.round?Math.round(be/5)*5:Math.round(be));
    rows.push({s:bs,e:be});
  }
  return {s:s,e:e,total:total,rows:rows};
}
// TIME-END
function restOutHTML(m){
  var r=restCalc(m);
  if(r.err) return '<div class="rest-msg">'+esc(r.err)+'</div>';
  // while setting up: names can be typed, and tapping a break's times marks it as yours
  var me=restMineIdx(m,r),h=r.rows.map(function(x,i){
    var my=i===me;
    return '<div class="rrow'+(my?' mine':'')+'" data-ri="'+i+'"><input type="text" data-rlabel="'+i+'" data-id="'+m.id+'" value="'+esc(m.labels[i]||'')+'" placeholder="Break '+(i+1)+'" aria-label="Name for break '+(i+1)+'" autocomplete="off">'+
      '<button type="button" class="rright rpick" data-act="restMine" data-id="'+m.id+'" data-i="'+i+'" aria-pressed="'+my+'" aria-label="'+(my?'Your break. Tap to unmark it':'Mark break '+(i+1)+' as yours')+'">'+(my?'<i class="you">You</i>':'')+
      '<span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></button></div>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+h+'<div class="rest-sum">'+(me<0?'<span class="rest-hint">Tap the times of your break to mark it as yours.</span> ':'')+'Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}
function restMineIdx(m,r){return typeof m.mine==='number'&&m.mine>=0&&m.mine<r.rows.length?m.mine:-1;}
function restInfo(m,now){
  var r=restCalc(m);
  if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,txt='',on=false,idx=-1,me=restMineIdx(m,r);
  if(rel<r.total){
    for(var i=0;i<r.rows.length;i++){
      var x=r.rows[i];
      if(abs>=x.s&&abs<x.e){
        idx=i;on=true;
        txt=i===me?'Your rest: '+durHM(Math.ceil(x.e-abs))+' left':'Now: '+(m.labels[i]||'Break '+(i+1))+', '+durHM(Math.ceil(x.e-abs))+' left'+(me>i?' · yours in '+durHM(Math.ceil(r.rows[me].s-abs)):'');
        break;
      }
      if(abs<x.s){txt='Handover, next at '+hmZ(x.s)+(i===me?' (yours)':'');break;}
    }
  }else{
    var wait=1440-rel;
    txt=wait>720?'Rest finished':me>=0?'Your rest in '+durHM(Math.ceil(wait+r.rows[me].s-r.s)):'Starts in '+durHM(Math.ceil(wait));
  }
  return {txt:txt,on:on,idx:idx};
}
// The block once the times are set: the breaks to read, tap one to mark it as yours
function restReadHTML(m){
  var r=restCalc(m),me=restMineIdx(m,r);
  var rows=r.rows.map(function(x,i){
    var nm=m.labels[i]||'Break '+(i+1),my=i===me;
    return '<button type="button" class="rrow'+(my?' mine':'')+'" data-ri="'+i+'" data-act="restMine" data-id="'+m.id+'" data-i="'+i+'" aria-pressed="'+my+'" aria-label="'+esc(nm)+', '+hmZ(x.s)+' to '+hmZ(x.e)+(my?', your rest. Tap to unmark':'. Tap to mark it as your rest')+'">'+
      '<span class="rname"><span>'+esc(nm)+'</span>'+(my?'<i class="you">You</i>':'')+'</span>'+
      '<span class="rright"><span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></span></button>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+rows+'<div class="rest-sum">'+(me<0?'<span class="rest-hint">Tap your break to mark it as yours.</span> ':'')+
    'Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}

/* Countdown alerts */
var actx=null;
function audioUnlock(){
  try{
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC) actx=new AC();}
    if(actx&&actx.state==='suspended') actx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',audioUnlock,{passive:true});
document.addEventListener('touchend',audioUnlock,{passive:true});
function beep(count){
  if(!state.settings.sound||!actx) return;
  try{
    var t=actx.currentTime+0.05;
    for(var i=0;i<(count||3);i++){
      var o=actx.createOscillator(),g=actx.createGain(),d=t+i*0.3;
      o.type='sine';o.frequency.value=i%2?1046:880;
      g.gain.setValueAtTime(0.0001,d);g.gain.exponentialRampToValueAtTime(0.45,d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,d+0.22);
      o.connect(g);g.connect(actx.destination);o.start(d);o.stop(d+0.25);
    }
  }catch(e){}
}
function cdName(m){return m.title&&m.title!=='Countdown'?m.title:'the set time';}
function cdFire(m,msg){
  alerting.delete(m.id);alerting.set(m.id,msg); // newest alert last
  paintAlert();beep(3);
}
function paintAlert(){
  var ids=Array.from(alerting.keys());
  if(!ids.length){alertBar.hidden=true;return;}
  var id=ids[ids.length-1],msg=alerting.get(id)+(ids.length>1?' (+'+(ids.length-1)+' more)':'');
  if($('#alertMsg').textContent!==msg) $('#alertMsg').textContent=msg;
  alertBar.setAttribute('data-id',id);alertBar.hidden=false;
  var tb=document.querySelector('.topbar');if(tb) alertBar.style.top=(tb.getBoundingClientRect().bottom+6)+'px';
}
$('#alertOk').addEventListener('click',function(){alerting.delete(alertBar.getAttribute('data-id'));clockTick();});
$('#alertMsg').addEventListener('click',function(){
  var id=alertBar.getAttribute('data-id'),f=id&&find(id);if(!f) return;
  if(f.list){if(f.node.type==='check') revealItem(id);else{state.current=f.list.id;f.section.collapsed=false;save();render();setTimeout(function(){flash(id);},80);}}

function cdSetTarget(m,t,now){
  m.target=t;alerting.delete(m.id);
  m.aL=t===null||!m.lead||now>=t-m.lead*60000;
  m.aZ=t===null||now>=t;
}
function cdCheck(m,now){
  if(m.target===null) return;
  if(m.lead&&!m.aL){
    var tl=m.target-m.lead*60000;
    if(now>=tl){m.aL=true;saveSoon();if(now-tl<120000) cdFire(m,m.lead+' min to '+cdName(m));}
  }
  if(!m.aZ&&now>=m.target){
    m.aZ=true;m.aL=true;saveSoon();
    if(now-m.target<120000) cdFire(m,cdName(m).charAt(0).toUpperCase()+cdName(m).slice(1)+' now');
  }
}
function cdPaint(m,el,now){
  var rem=el.querySelector('[data-rem]'),sub=el.querySelector('[data-sub]'),meta=el.querySelector('[data-meta]');
  var unset=m.target===null,diff=unset?0:m.target-now;
  el.classList.toggle('unset',unset);
  el.classList.toggle('past',!unset&&diff<=0);
  el.classList.toggle('soon',!unset&&diff>0&&!!m.lead&&diff<=m.lead*60000);
  el.classList.toggle('alerting',alerting.has(m.id));
  if(alerting.has(m.id)){var am=el.querySelector('[data-amsg]');if(am&&am.textContent!==alerting.get(m.id)) am.textContent=alerting.get(m.id);}
  if(unset){rem.textContent='-:--:--';sub.textContent=el.classList.contains('rd')?'Not set':'Tap to set a time';meta.textContent='';return;}
  var tz=hmZ(new Date(m.target).getUTCHours()*60+new Date(m.target).getUTCMinutes());
  rem.textContent=(diff<=0?'+':'')+durClock(diff);
  sub.textContent=(diff<=0?'since ':'to ')+tz;
  meta.textContent=m.lead?'Alert '+m.lead+' min before, at '+hmZ(Math.round((m.target-m.lead*60000)%86400000/60000)):'No early alert';
}

/* Destination time */
var dtfCache={};
function tzInfo(tz,now){
  try{
    var f=dtfCache[tz]||(dtfCache[tz]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'}));
    var p={};f.formatToParts(new Date(now)).forEach(function(x){p[x.type]=x.value;});
    var h=(+p.hour)%24,base=Math.floor(now/60000)*60000;
    var off=Math.round((Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute)-base)/60000);
    return {hm:pad2(h)+':'+p.minute,wd:p.weekday,off:off};
  }catch(e){return null;}
}
function fmtOff(m){var sg=m<0?'−':'+';m=Math.abs(m);return 'UTC'+sg+Math.floor(m/60)+(m%60?':'+pad2(m%60):'');}
function paintClock(now){
  var d=new Date(now);
  utcEl.innerHTML=pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+':'+pad2(d.getUTCSeconds())+'<small>Z</small>';
  var dest=state.settings.dest,info=dest&&tzInfo(dest.tz,now);
  locEl.classList.toggle('noset',!info);
  var fno=state.settings.csign;
  if(!info){if(fno){locEl.classList.remove('noset');locEl.innerHTML='<b class="fno">'+esc(fno)+'</b> <span style="color:var(--accent)">· Set flight</span>';}else locEl.textContent='Set flight';locEl.removeAttribute('data-k');return;}
  var dep=state.settings.dep;
  locEl.classList.toggle('hasdep',!!(dep||fno));
  var key=fno+'|'+(dep?dep.icao:'')+dest.icao+info.hm+info.wd+info.off;
  if(locEl.getAttribute('data-k')===key) return;
  locEl.setAttribute('data-k',key);
  locEl.innerHTML=(fno?'<span class="route"><b class="fno">'+esc(fno)+'</b> → </span>':dep?'<span class="route">'+esc(dep.icao)+' → </span>':'')+(dest.icao?'<b>'+esc(dest.icao)+'</b> ':'')+'<span>'+info.hm+'</span><span class="lt">LT</span><span class="wd"> '+info.wd+'</span> <span class="off">('+fmtOff(info.off)+')</span>';
}

var tickT=0;
function allCds(){
  var out=[];
  state.lists.forEach(function(L){L.sections.forEach(function(s){s.items.forEach(function(n){if(n.type==='cd') out.push({node:n,list:L});});});});
  return out;
}
function restTop(m,now){
  // what the top bar shows for a rest plan: current break, next break, or time to rest start
  var r=restCalc(m);if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,me=restMineIdx(m,r);
  if(me>=0){
    // your own break: time until it starts, then what is left of it; nothing once it is over
    var y=r.rows[me];
    if(rel<r.total){
      if(abs<y.s) return {mode:'wait',min:y.s-abs,name:'to your rest',mine:true};
      if(abs<y.e) return {mode:'on',min:y.e-abs,name:'rest left',mine:true};
      return null;
    }
    var w=1440-rel;
    return w<=720?{mode:'wait',min:w+y.s-r.s,name:'to your rest',mine:true}:null;

function prepDuty(t,L){
  var home=prepHome(),A=L.slice().sort(function(a,b){return a.std-b.std;}),i=A.indexOf(t),a=i,b=i,G=10*86400000;

  while(b<A.length-1&&A[b].dest!==home&&A[b+1].dep===A[b].dest&&A[b+1].std-A[b].sta<G) b++;

// Keep the menu inside what can be seen: below the status bar and above the home bar. Next to the item when there is room,
// otherwise (a tall item) next to the finger; scrolls when even the whole screen is too short.
function lpPlace(m,ar,px,py){
  var cs=getComputedStyle(document.documentElement),W=window.innerWidth,H=window.innerHeight;
  var vv=window.visualViewport;if(vv&&vv.height) H=Math.min(H,vv.height);
  var T=(parseFloat(cs.paddingTop)||0)+8,B=H-(parseFloat(cs.paddingBottom)||0)-8,mw=m.offsetWidth,mh=m.offsetHeight;
  if(mh>B-T){m.style.maxHeight=(B-T)+'px';m.style.overflowY='auto';mh=B-T;}
  if(px==null){px=ar.left+ar.width/2;py=ar.top+ar.height/2;}
  var top,left=ar.left+16;
  if(ar.bottom+6+mh<=B&&ar.bottom>=T&&ar.bottom-py<160) top=ar.bottom+6;           // under the item, close to the finger
  else if(ar.top-6-mh>=T&&ar.top<=B&&py-ar.top<160) top=ar.top-6-mh;              // over the item
  else{left=px-mw/2;top=py+18+mh<=B?py+18:py-18-mh>=T?py-18-mh:py-mh/2;}       // tall item: by the finger
  m.style.left=Math.max(10,Math.min(left,W-mw-10))+'px';
  m.style.top=Math.max(T,Math.min(top,B-mh))+'px';
}

function selToggle(id){

// the picked items in screen order, leaving out any inside another picked item (they go with it)
function selTops(){
  var out=[];
  function w(arr,inside){arr.forEach(function(n){var p=sel.has(n.id);if(p&&!inside) out.push(n);if(n.children) w(n.children,inside||p);});}
  cur().sections.forEach(function(s){w(s.items,false);});
  return out;
}
function selPaint(){
  if(!selBar){
    selBar=document.createElement('div');selBar.className='selbar';selBar.hidden=true;
    selBar.setAttribute('role','toolbar');selBar.setAttribute('aria-label','Selected items');
    function b(a,ic,t,c){return '<button type="button" data-sel="'+a+'"'+(c?' class="'+c+'"':'')+'>'+ic+'<span>'+t+'</span></button>';}
    selBar.innerHTML='<b id="selN"></b>'+b('move',I.move,'Move')+b('out',IC_OUT,'Out')+b('in',IC_IN,'In')+b('dup',I.copy,'Duplicate')+b('type',I.info,'Type')+b('del',I.trash,'Delete','dg');
    selBar.addEventListener('click',function(e){var x=e.target.closest('[data-sel]');if(x&&!x.disabled) selAct(x.getAttribute('data-sel'));});
    document.body.appendChild(selBar);
  }
  var on=editMode&&selMode;selBar.hidden=!on;if(!on) return;
  // keep only picks that are still in this checklist, and show them
  var live=new Set();
  cur().sections.forEach(function(s){(function w(a){a.forEach(function(n){if(sel.has(n.id)) live.add(n.id);if(n.children) w(n.children);});})(s.items);});
  sel=live;
  app.querySelectorAll('.item.picked').forEach(function(el){if(!sel.has(el.getAttribute('data-item'))) el.classList.remove('picked');});
  sel.forEach(function(id){var el=app.querySelector('[data-item="'+id+'"]');if(el) el.classList.add('picked');});

function dupNode(n){
  var c=JSON.parse(JSON.stringify(n));
  (function re(x){x.id=uid();x.done=false;if(x.fld) x.fld.val='';if(x.dq){x.ans='';x.dq.forEach(function(a){a.id=uid();a.items.forEach(re);});}(x.children||[]).forEach(re);})(c);
  return c;
}
function selAct(a){
  var tops=selTops();if(!tops.length) return;
  var n=tops.length,nm=n===1?'“'+(tops[0].text||'item').slice(0,30)+'”':n+' items',before=JSON.stringify(state);
  function drop(){tops.forEach(function(x){var f=find(x.id);if(!f) return;var p=parentOf(f);removeNode(f);kidsDoneFix(p);});}
  if(a==='del'){drop();sel.clear();save();render();offerUndo(before,'Deleted '+nm);return;}
  if(a==='move'){selMoveSheet(tops,nm);return;}
  if(a==='type'){selTypeSheet(tops);return;}
  if(a==='dup'){
    // copies go right after the originals; items next to each other stay together
    var runs=[],last=null,cp=[];
    tops.forEach(function(x){var f=find(x.id);if(!f) return;var i=f.arr.indexOf(x);
      if(last&&last.arr===f.arr&&last.end===i-1){last.items.push(x);last.end=i;}else{last={arr:f.arr,items:[x],end:i};runs.push(last);}});
    runs.forEach(function(r){var at=r.arr.indexOf(r.items[r.items.length-1])+1,cs=r.items.map(dupNode);Array.prototype.splice.apply(r.arr,[at,0].concat(cs));cs.forEach(function(c){cp.push(c.id);});});
    sel=new Set(cp);save();render();toast('Duplicated '+nm+'. The copies are selected.',2600);return;
  }
  var moved=0;
  if(a==='in') tops.forEach(function(x){var f=find(x.id);if(f&&indentNode(f)) moved++;});
  if(a==='out') tops.slice().reverse().forEach(function(x){var f=find(x.id);if(f&&outdentNode(f)) moved++;});
  if(moved){save();render();}
  if(moved<n) toast(a==='in'?(moved?(n-moved)+' couldn’t go in: no item above that can hold them':'No item above that can hold them'):(moved?(n-moved)+' are already at the top level':'Already at the top level'),2600);
}
function selMoveSheet(tops,nm){
  var T=moveTargets(tops),h='',lastL=null;
  T.forEach(function(t,i){
    if(t.L!==lastL){lastL=t.L;h+='<div class="mvh">'+esc(t.L.title)+'</div>';}

    else h+='<button type="button" data-sact="to" data-i="'+i+'" style="padding-left:'+(10+t.depth*18)+'px">'+I.diamond+'<span class="q">'+esc(t.dec.text||'Untitled question')+'</span><b class="'+decTone(t.opt.tone)+'">'+esc(t.opt.label)+'</b></button>';
  });
  openSheet('<h3>Move '+nm+'</h3><p class="hint">To a section, or to an answer of a decision. They go to the end, in the order they’re in now.</p><div class="mvl">'+h+'</div>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button></div>',
  function(act,btn){
    if(act!=='to'){closeSheet();return;}
    var t=T[+btn.getAttribute('data-i')];if(!t) return;
    var before=JSON.stringify(state);

/* ---------- Edit mode: Undo, step by step ---------- */
// folding and unfolding aren't changes worth undoing, so they're left out when comparing
function undoKey(){return JSON.stringify(state,function(k,v){return k==='collapsed'||k==='open'?undefined:v;});}
function undoSnap(){return {js:JSON.stringify(state),key:undoKey()};}
// called by save() in Edit mode: keeps the checklists as they were before this change
function undoNote(){
  var s=undoSnap();
  if(!undoBase||s.key===undoBase.key){undoBase=s;undoPaint();return s.js;}
  var top=undoStk[undoStk.length-1];
  if(top&&top.key===s.key) undoStk.pop(); // back to how it was a step ago (an empty new item that went away)
  else{
    undoStk.push(undoBase);
    var tot=0;
    for(var i=undoStk.length-1;i>=0;i--){tot+=undoStk[i].js.length;if(tot>24e6||undoStk.length-i>50){undoStk.splice(0,i+1);break;}}
  }
  undoBase=s;undoPaint();return s.js;
}
function undoStep(){
  if(!editMode) return;
  ieDrop();if(selMode){selMode=false;sel.clear();}
  var s=undoStk.pop();if(!s){undoPaint();return;}
  var o=null;try{o=normalize(JSON.parse(s.js));}catch(e){}
  if(!o){toast('Couldn’t undo');undoPaint();return;}
  state=o;fresh.clear();
  undoBusy=true;save();undoBusy=false;
  undoBase=undoSnap();
  if(!sheetWrap.hidden) closeSheet();
  render();if(toolOpen) refreshTool();clockTick();undoPaint();
  toast(undoStk.length?'Undone':'Undone. Nothing more to undo.');
}
function undoPaint(){if(!undoBtn) return;undoBtn.hidden=!editMode;undoBtn.disabled=!undoStk.length;}

function paintTabs(now){
  if(!tabBar||!tabBar.firstChild) return;

  if(document.documentElement.classList.contains('kb')&&!kbUp()) document.documentElement.classList.remove('kb');

    if(b.classList.contains('on')!==a){b.classList.toggle('on',a);if(a) b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
  });

  var tl=tabBar.querySelector('[data-tab="tm"] .tl'),txt='Timers',live=false,warn=false;
  if(on!=='tm'){
    now=now||Date.now();
    var up=state.tools.cds.filter(function(c){return c.target!==null&&c.target>now;}).sort(function(a,b){return a.target-b.target;})[0];
    if(up){txt=tileTime(Math.floor((up.target-now)/60000));live=true;warn=!!up.lead&&up.target-now<=up.lead*60000;}
    else{var rm=restSource(),t=rm&&restTop(rm,now);if(t){txt=tileTime(t.min);live=true;}}
