      case 'del': confirmSheet('Delete this airport stats block?','Delete',function(){removeNode(f);save();render();},function(){openApstEditor(id);});break;
      default: closeSheet();
    }
  });
}
/* Reminders: at UTC times every day, or a set time before a countdown */
function remDue(r,now){
  if(r.mode==='cd'){
    var c=cdById(r.cd);if(!c||c.target===null) return {prev:null,next:null,c:c};
    var t=c.target-r.min*60000;return t<=now?{prev:t,next:null,c:c}:{prev:null,next:t,c:c};
  }
  var day=Math.floor(now/86400000)*86400000,prev=null,next=null;
  r.times.forEach(function(x){
    var m=(+x.slice(0,2))*60+(+x.slice(2));
    [-1,0,1].forEach(function(k){var t=day+k*86400000+(m-r.lead)*60000;if(t<=now){if(prev===null||t>prev) prev=t;}else if(next===null||t<next) next=t;});
  });
  return {prev:prev,next:next};
}
function hmOf(t){var d=new Date(t);return hmZ(d.getUTCHours()*60+d.getUTCMinutes());}
function remText(r,now){
  if(r.mode==='cd'){
    var c=cdById(r.cd);if(!c) return 'Countdown deleted';
    return c.title+' − '+r.min+' min'+(c.target!==null?' · '+hmOf(c.target-r.min*60000):'');
  }
  var d=remDue(r,now);
  return hmOf(d.next+r.lead*60000)+(r.times.length>1?' · '+r.times.length+' a day':'')+(r.lead?' · alert '+r.lead+' min before':'');
}
function remWalk(fn){
  state.lists.forEach(function(L){L.sections.forEach(function(s){
    (function w(arr){arr.forEach(function(n){if(n.type==='check'){if(n.rem) fn(n);w(n.children);}});})(s.items);
  });});
}
function remMsg(it,r,d,now){
  var name=it.text||'Reminder',late=now-d.prev>120000;
  if(r.mode==='cd') return name+' · '+r.min+' min to '+(d.c?d.c.title:'countdown');
  return name+(r.lead?' in '+r.lead+' min':'')+(late?' (was due '+hmOf(d.prev+r.lead*60000)+')':'');
}
function remCheck(now){
  remWalk(function(it){
    var r=it.rem,d=remDue(r,now);
    if(d.prev===null) return;
    if(r.mode==='cd'){
      if(r.lastT!==null&&Math.abs(d.c.target-r.lastT)<20*60000) return;
      r.lastT=d.c.target;
    }else{
      if(d.prev<=r.last) return;
      r.last=d.prev;
    }
    saveSoon();
    if(now-d.prev<15*60000) remFire(it,remMsg(it,r,d,now));
  });
}
function remFire(it,msg){
  if(!it.info&&it.done) tick(it.id); // a ticked item comes back as to-do
  alerting.delete(it.id);alerting.set(it.id,msg);paintAlert();beep(3);
}
function remPaint(now){
  document.querySelectorAll('[data-remid]').forEach(function(el){
    var f=find(el.getAttribute('data-remid'));if(!f||!f.node.rem) return;
    var r=f.node.rem,t=remText(r,now),sp=el.querySelector('span');
    if(sp&&sp.textContent!==t) sp.textContent=t;
    var d=remDue(r,now);el.classList.toggle('soon',d.next!==null&&d.next-now<=10*60000);
    var item=el.closest('.item');if(item) item.classList.toggle('rem-due',alerting.has(f.node.id));
  });
}
function remMark(r){
  // a reminder that is already past when you set it doesn't go off straight away
  var now=Date.now(),d=remDue(r,now);
  if(r.mode==='cd') r.lastT=d.prev!==null&&d.c?d.c.target:null;
  else r.last=d.prev||0;
  return r;
}
function revealItem(id){
  var f=find(id);if(!f||!f.list) return;
  state.current=f.list.id;f.section.collapsed=false;
  f.anc.forEach(function(a){a.open=true;});
  var top=f.anc[0]||f.node,i=f.section.items.indexOf(top);
  for(var j=i-1;j>=0;j--){var n=f.section.items[j];if(n.type==='head'){n.collapsed=false;break;}}
  if(toolOpen) closeTool();
  save();render();
  setTimeout(function(){flash(id);},80);
}
/* ---------- Weather: METAR and TAF through your relay, kept for offline use ---------- */
var WXKEY='flightChecklist.wx',WX_EVERY=300000;
var wx=(function(){try{var o=JSON.parse(localStorage.getItem(WXKEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}})();
var wxSt={busy:false,err:'',ok:0,retry:0};
function wxSave(){
  // keep the 30 most recent airports
  var ks=Object.keys(wx).sort(function(a,b){return (wx[b].f||0)-(wx[a].f||0);});
  ks.slice(30).forEach(function(k){delete wx[k];});
  try{localStorage.setItem(WXKEY,JSON.stringify(wx));}catch(e){}
}
function wxAirports(){
  var st=state.settings,out=[];
  function add(ic,role){if(ic&&!out.some(function(x){return x.ic===ic;})) out.push({ic:ic,role:role});}
  add(st.dep&&st.dep.icao,'From');add(st.dest&&st.dest.icao,'To');
  st.alts.forEach(function(a){add(a,'Alternate');});
  st.wxWatch.forEach(function(a){add(a,'Watching');});
  return out;
}
function wxMaybe(force){
  var url=state.settings.wxUrl,now=Date.now();
  if(!url||wxSt.busy) return;
  if(!force&&(navigator.onLine===false||now<wxSt.retry)) return;
  var ids=wxAirports().map(function(x){return x.ic;}).slice(0,12);
  if(!ids.length) return;
  if(!force&&ids.every(function(ic){return wx[ic]&&now-(wx[ic].f||0)<WX_EVERY;})) return;
  wxFetch(ids);
}
function wxFetch(ids){
  wxSt.busy=true;wxPaint();
  var ac=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ac) ac.abort();},20000);
  return fetch(state.settings.wxUrl+'/?ids='+ids.join(','),{cache:'no-store',signal:ac?ac.signal:undefined}).then(function(r){
    return r.json().catch(function(){return {ok:false,error:'The relay answered '+r.status};});
  }).then(function(j){
    if(!j||!j.ok) throw new Error(j&&j.error?j.error:'The relay didn’t answer properly');
    var now=Date.now();
    ids.forEach(function(ic){
      var o=wx[ic]||{},m=j.metar&&j.metar[ic],t=j.taf&&j.taf[ic];
      wx[ic]={m:m&&m.raw?{raw:String(m.raw),time:+m.time||null,cat:str(m.cat)}:(o.m||null),t:t&&t.raw?{raw:String(t.raw),time:+t.time||null}:(o.t||null),f:now,a:wxAtisOf(j,ic,o)};
    });
    wxSave();wxSt.err='';wxSt.ok=now;wxSt.retry=0;wxSt.oldRelay=!j.atis;
  }).catch(function(e){
    wxSt.err=navigator.onLine===false||(e&&e.name==='AbortError')||(e instanceof TypeError)?'No internet':String(e&&e.message||e);
    wxSt.retry=Date.now()+60000;
  }).then(function(){clearTimeout(tm);wxSt.busy=false;wxRefreshViews();});
}
function wxUS(ic){return /^[KP]/.test(ic);}
function wxAtisOf(j,ic,o){
  if(!wxUS(ic)) return null;
  if(!j.atis||typeof j.atis!=='object') return o.a||null; // relay without D-ATIS: keep what we had
  var a=j.atis[ic];
  if(!Array.isArray(a)) return [];
  return a.filter(function(x){return x&&x.text;}).slice(0,3).map(function(x){return {type:str(x.type)||'combined',code:str(x.code).slice(0,2),text:String(x.text).slice(0,4000),time:str(x.time),updated:+x.updated||null};});
}
function atisTime(x){
  var m=/^(\d{2})(\d{2})$/.exec(x.time||'');
  if(!m) return x.updated||null;
  var n=new Date(),t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),+m[1],+m[2]);
  if(t>Date.now()+10*60000) t-=86400000;
  return t;
}
var wxAtisOpen=new Set();
function wxAtisHTML(ic,list){
  var now=Date.now();
  if(!list.length) return '<div class="wxl">D-ATIS</div><div class="wxnone">None right now</div>';
  return list.map(function(x){
    var t=atisTime(x),age=t?now-t:0,key=ic+'|'+x.type,open=wxAtisOpen.has(key);
    var kind=x.type==='arr'?' · Arrival':x.type==='dep'?' · Departure':'';
    return '<div class="wxl">D-ATIS'+(x.code?' <span class="letter">'+esc(x.code)+'</span>':'')+kind+'</div>'+
      '<div class="wxraw atis'+(open?'':' clamp')+'" data-act="wxAtis" data-v="'+esc(key)+'">'+esc(x.text)+'</div>'+
      '<div class="wxm'+(age>60*60000?' old':'')+'">'+(t?hmOf(t)+' · '+ageText(age)+' old':'')+(open?'':'<span class="wxmore"> · tap to read all</span>')+'</div>';
  }).join('');
}
function wxRefreshViews(){
  app.querySelectorAll('.module.wx').forEach(function(el){refreshModule(el.getAttribute('data-mod'));});
  if(toolOpen&&toolKind==='wx') refreshTool();
}
function wxPaint(){document.querySelectorAll('[data-wxst]').forEach(function(el){el.innerHTML=wxStatusInner();el.classList.toggle('old',wxStale());});}
function ageText(ms){var m=Math.max(0,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');}
function wxLastFetch(ids){var f=0;ids.forEach(function(ic){if(wx[ic]&&wx[ic].f>f) f=wx[ic].f;});return f;}
function wxStale(){var f=wxLastFetch(wxAirports().map(function(x){return x.ic;}));return !!f&&Date.now()-f>60*60000;}
function wxStatusInner(){
  if(wxSt.busy) return '<span>Updating…</span>';
  var ids=wxAirports().map(function(x){return x.ic;}),f=wxLastFetch(ids),now=Date.now();
  var t=f?'Updated '+hmOf(f)+' · '+ageText(now-f)+' ago':'Not updated yet';
  if(wxSt.err) t+=' · '+wxSt.err;
  return '<span>'+esc(t)+'</span>';
}
function wxStatusHTML(){return '<div class="wxst'+(wxStale()?' old':'')+'" data-wxst>'+wxStatusInner()+'</div>';}
function wxObsTime(raw,fallback){
  // the DDHHMMZ group in the report, placed in the current or previous month
  var m=/\b(\d{2})(\d{2})(\d{2})Z\b/.exec(raw||'');if(!m) return fallback||null;
  var n=new Date(),t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),+m[1],+m[2],+m[3]);
  if(t>Date.now()+86400000) t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,+m[1],+m[2],+m[3]);
  return fallback||t;
}
function wxSig(raw){
  // highlight significant weather and CB/TCU, only after the report's time group (so station codes never light up)
  var on=false,WXR=/^(\+|-|VC)?(MI|PR|BC|DR|BL|SH|TS|FZ)?((?:DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS){0,3})$/;
  return String(raw).split(/(\s+)/).map(function(t){
    if(/^\s+$/.test(t)||!t) return t;
    if(!on){if(/^\d{6}Z$/.test(t)) on=true;return esc(t);}

/* Calculator */
function calcKey(id,k){
  var f=find(id);if(!f) return;
  var m=f.node,e=m.expr,last=e.slice(-1),wasFresh=fresh.has(id),seg;
  fresh.delete(id);
  if(/^\d$/.test(k)){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg==='0') e=e.slice(0,-1);
    e+=k;
  }else if(k==='.'){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg.indexOf('.')>=0) return;
    e+=seg===''?'0.':'.';
  }else if(OPS.indexOf(k)>=0){
    if(e===''||e==='−') e=k==='−'?'−':'';
    else if(OPS.indexOf(last)>=0){
      if(k==='−'&&(last==='×'||last==='÷')) e+='−';
      else{e=e.replace(/[+−×÷]+$/,'');e=e===''?(k==='−'?'−':''):e+k;}
    }else{if(last==='.') e+='0';e+=k;}
  }else if(k==='C'){e='';
  }else if(k==='del'){e=e.slice(0,-1);
  }else if(k==='='){
    var ev=e.replace(/[+−×÷]+$/,'');
    if(!hasOp(ev)){if(wasFresh) fresh.add(id);return;}
    var r=calcEval(ev);
    if(r===null) return;
    if(r==='err'){toast('Can’t divide by zero');return;}
    m.hist.push({e:fmtExpr(ev.replace(/\.$/,'')),r:r});
    if(m.hist.length>8) m.hist=m.hist.slice(-8);
    e=r;fresh.add(id);
  }
  m.expr=e;saveSoon();updateCalc(m);
}
function calcHist(id,r){
  var f=find(id);if(!f||!r) return;
  var m=f.node;
  if(/[+−×÷]$/.test(m.expr)){m.expr+=r;fresh.delete(id);}
  else{m.expr=r;fresh.add(id);}
  saveSoon();updateCalc(m);
}
function updateCalc(m){
  var el=app.querySelector('[data-mod="'+m.id+'"]');if(!el) return;
  el.querySelector('[data-expr]').textContent=fmtExpr(m.expr)||'0';
  el.querySelector('[data-prev]').innerHTML=prevHTML(m.expr);
  el.querySelector('[data-hist]').innerHTML=histHTML(m);
}

/* Notepad */
function inkColor(){return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';}
function mountPad(el,m){
  var cv=el.querySelector('canvas'),wrap=cv.parentElement,ctx=cv.getContext('2d');
  var scale=1,lastW=0,tool='pen',curS=null,ink=inkColor();
  function dpr(){return Math.min(window.devicePixelRatio||1,3);}
  function size(force){
    var w=wrap.clientWidth;if(!w) return;
    if(w===lastW&&!force) return;
    lastW=w;scale=w/LW;
    var hpx=Math.round(m.h*scale),d=dpr();
    cv.style.height=hpx+'px';
    cv.width=Math.round(w*d);cv.height=Math.round(hpx*d);
    ctx.setTransform(d*scale,0,0,d*scale,0,0);
    redraw();
  }
  function setStyle(s,p){
    ctx.globalCompositeOperation=s.t==='e'?'destination-out':'source-over';
    ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineCap='round';ctx.lineJoin='round';
    return s.t==='e'?s.w:s.w*(0.35+p*1.3);
  }
  function seg(s,i){
    var P=s.pts,a=(i-1)*3,b=i*3;
    ctx.lineWidth=setStyle(s,(P[a+2]+P[b+2])/2);
    ctx.beginPath();ctx.moveTo(P[a],P[a+1]);ctx.lineTo(P[b],P[b+1]);ctx.stroke();
  }
  function dot(s){
    var P=s.pts,w=setStyle(s,P[2]);
    ctx.beginPath();ctx.arc(P[0],P[1],w/2,0,Math.PI*2);ctx.fill();
  }
  function drawStroke(s){var n=s.pts.length/3;dot(s);for(var i=1;i<n;i++) seg(s,i);}
  function redraw(){
    ink=inkColor();
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
    m.strokes.forEach(drawStroke);
    ctx.globalCompositeOperation='source-over';
  }
  function pt(e,r){
    return [+((e.clientX-r.left)/scale).toFixed(1),+((e.clientY-r.top)/scale).toFixed(1),e.pointerType==='pen'?+((e.pressure||0.5).toFixed(2)):0.5];
  }
  function down(e){
    if(curS) return;
    if(e.pointerType==='touch'&&!state.settings.fingerDraw) return;
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    curS={id:e.pointerId,s:{t:tool==='eraser'?'e':'p',w:tool==='eraser'?18:2.3,pts:pt(e,cv.getBoundingClientRect())}};
    dot(curS.s);
  }
  function move(e){
    if(!curS||e.pointerId!==curS.id) return;
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    var list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!list.length) list=[e];
    for(var i=0;i<list.length;i++){
      var p=pt(list[i],r),P=curS.s.pts;
      if(Math.abs(p[0]-P[P.length-3])<0.4&&Math.abs(p[1]-P[P.length-2])<0.4) continue;
      P.push(p[0],p[1],p[2]);seg(curS.s,P.length/3-1);
    }
  }
  function up(e){
    if(!curS||e.pointerId!==curS.id) return;
    m.strokes.push(curS.s);curS=null;
    ctx.globalCompositeOperation='source-over';
    saveSoon();
  }
  // Stop Apple Pencil (or a finger, when finger drawing is on) from scrolling the page
  function tstop(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].touchType==='stylus'||state.settings.fingerDraw){e.preventDefault();return;}
    }
  }
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('touchstart',tstop,{passive:false});
  cv.addEventListener('touchmove',tstop,{passive:false});
  var ro=window.ResizeObserver?new ResizeObserver(function(){size(false);}):null;
  if(ro) ro.observe(wrap);else window.addEventListener('resize',function(){size(false);});
  size(true);
  return {
    redraw:redraw,
    resize:function(){size(true);},
    setTool:function(t){tool=t;el.querySelectorAll('[data-act="padTool"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});},
    undo:function(){if(!m.strokes.length) return;m.strokes.pop();redraw();saveSoon();},
    dispose:function(){if(ro) ro.disconnect();}
  };
}

var sheetHandler=null,hideT=0;

function closeSheet(){

  sheetHandler=null;

/* ---------- Online backup: a private GitHub repository, while the app is open and online ---------- */
var CKEY='flightChecklist.cloud',CLOUD_QUIET=60000,CLOUD_GAP=180000;
function loadCloud(){
  var c=null;try{c=JSON.parse(localStorage.getItem(CKEY)||'null');}catch(e){}
  if(!c||typeof c!=='object') c={};
  return {repo:str(c.repo),token:str(c.token),on:!!(c.on&&c.repo&&c.token),photos:c.photos!==false,sha:str(c.sha),hash:str(c.hash),
    last:+c.last||0,err:str(c.err),kind:str(c.kind),up:Array.isArray(c.up)?c.up.filter(function(x){return typeof x==='string';}):[]};
}
var cloud=loadCloud(),cloudUp=new Set(cloud.up),cloudBusy=false,cloudProg='',cloudTickHash='',cloudChangedAt=0,cloudRetryAt=0;
function saveCloud(){cloud.up=Array.from(cloudUp);try{localStorage.setItem(CKEY,JSON.stringify(cloud));}catch(e){}}
function strHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+'.'+s.length;}
function b64utf8(s){var b=new TextEncoder().encode(s),out='';for(var i=0;i<b.length;i+=0x8000) out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(out);}
function ghFetch(repo,token,method,path,body,accept){
  var o={method:method,cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':accept||'application/vnd.github+json'}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  return fetch('https://api.github.com/repos/'+repo+path,o);
}
function gh(method,path,body,accept){return ghFetch(cloud.repo,cloud.token,method,path,body,accept);}
function ghErr(r){
  var e=new Error('GitHub '+r.status);e.status=r.status;
  if((r.status===403||r.status===429)&&(r.headers.get('retry-after')||r.headers.get('x-ratelimit-remaining')==='0')) e.status=429; // asked to slow down
  return e;
}
function okJson(r){if(!r.ok) throw ghErr(r);return r.json();}
function whenZ(ms){
  var d=new Date(ms),n=new Date(),z=hmZ(d.getUTCHours()*60+d.getUTCMinutes());
  if(d.toISOString().slice(0,10)===n.toISOString().slice(0,10)) return z;
  return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+z;
}
function cloudPending(){
  var json=JSON.stringify(state,null,1);
  return {json:json,h:strHash(json),photos:cloud.photos?Array.from(allImgIds()).filter(function(id){return !cloudUp.has(id);}):[]};
}
function cloudDataSha(){
  return gh('GET','/contents/data.json',null,'application/vnd.github.object+json').then(function(r){
    if(r.status===404) return '';
    return okJson(r).then(function(j){return j.sha||'';});
  });
}
function cloudPutData(json){
  var body={message:'Backup '+new Date().toISOString().slice(0,16).replace('T',' ')+'Z',content:b64utf8(json)};
  if(cloud.sha) body.sha=cloud.sha;
  return gh('PUT','/contents/data.json',body).then(function(r){
    if(r.status!==409&&r.status!==422) return r;
    // the copy on GitHub changed (or we don't know it yet): fetch its id and try once more
    return cloudDataSha().then(function(sha){if(sha) body.sha=sha;else delete body.sha;return gh('PUT','/contents/data.json',body);});
  }).then(okJson).then(function(j){cloud.sha=(j.content&&j.content.sha)||'';});
}
function cloudPutPhoto(id){
  return imgGet(id).then(function(v){
    if(!v||typeof v.f!=='string'){cloudUp.add(id);return;}
    return gh('PUT','/contents/photos/'+id+'.jpg',{message:'Photo '+id,content:v.f.slice(v.f.indexOf(',')+1)}).then(function(r){
      if(r.ok||r.status===422){cloudUp.add(id);return;} // 422: it is already there
      throw ghErr(r);
    });
  });
}
function cloudFail(e){
  var st=e&&e.status,now=Date.now();
  if(!st){cloud.err='';cloud.kind='net';cloudRetryAt=now+60000;return;}
  if(st===429){cloud.err='';cloud.kind='wait';cloudRetryAt=now+900000;return;}
  if(st===401){cloud.kind='auth';cloud.err='GitHub no longer accepts the access token. It may have expired. Make a new one and enter it in Online backup.';cloudRetryAt=now+1800000;}
  else if(st===403||st===404){cloud.kind='access';cloud.err='The token can’t write to '+cloud.repo+'. It needs Contents: Read and write for that repository.';cloudRetryAt=now+1800000;}
  else{cloud.kind='other';cloud.err='GitHub had a problem ('+st+'). The app will try again.';cloudRetryAt=now+300000;}
}
function cloudRun(withData,p){
  if(cloudBusy||!cloud.on) return Promise.resolve(false);
  p=p||cloudPending();cloudBusy=true;cloudProg='Backing up…';cloudPaint();
  var chain=Promise.resolve(),ids=p.photos;
  if(withData&&p.h!==cloud.hash) chain=chain.then(function(){return cloudPutData(p.json);}).then(function(){cloud.hash=p.h;cloud.last=Date.now();saveCloud();});
  ids.forEach(function(id,i){
    chain=chain.then(function(){return i?new Promise(function(res){setTimeout(res,1200);}):null;}) // GitHub limits uploads per minute
      .then(function(){cloudProg='Uploading photo '+(i+1)+' of '+ids.length;cloudPaint();return cloudPutPhoto(id);})
      .then(function(){if(i%5===4) saveCloud();});
  });
  return chain.then(function(){cloud.err='';cloud.kind='';cloudRetryAt=0;return true;},function(e){cloudFail(e);return false;})
    .then(function(ok){cloudBusy=false;cloudProg='';saveCloud();cloudPaint();return ok;});
}
function cloudMaybe(){
  if(!cloud.on||cloudBusy||navigator.onLine===false||Date.now()<cloudRetryAt) return;
  var p=cloudPending(),now=Date.now();
  if(p.h!==cloudTickHash){cloudTickHash=p.h;cloudChangedAt=now;}
  // a minute after the last change, and not more often than every few minutes
  var due=p.h!==cloud.hash&&now-cloudChangedAt>=CLOUD_QUIET&&now-cloud.last>=CLOUD_GAP;
  if(due||p.photos.length) cloudRun(due,p);
}
function cloudStatus(){
  if(!cloud.on) return {txt:'Off',bad:false};
  if(cloudBusy) return {txt:cloudProg||'Backing up…',busy:true};
  if(cloud.err) return {txt:cloud.err,bad:true};
  var p=cloudPending(),t;
  if(!cloud.last) t='Not backed up yet';
  else t='Last backup '+whenZ(cloud.last);
  var waiting=[];
  if(p.h!==cloud.hash) waiting.push('changes');
  if(p.photos.length) waiting.push(p.photos.length+' photo'+(p.photos.length>1?'s':''));
  if(waiting.length) t+=(navigator.onLine===false||cloud.kind==='net'?' · waiting for internet: ':' · to upload: ')+waiting.join(', ');
  return {txt:t,bad:false};
}
function cloudMenuText(){
  if(!cloud.on) return 'Off: back up automatically to GitHub';

  return s.bad?'Needs attention':s.txt;
}
function cloudPaint(){
  var el=$('#cloudStat');if(!el) return;

function cloudConnect(repo,tok,photos){

      '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button></div>',

function srRx(words){return new RegExp('('+words.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','gi');}

function srSnip(text,words){

/* ---------- Time: UTC clock, destination, countdowns, crew rest ---------- */
// TIME-START
function pad2(n){return (n<10?'0':'')+n;}
function parseHM(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  if(t.length===3) t='0'+t;
  if(t.length!==4) return null;
  var h=+t.slice(0,2),m=+t.slice(2);
  if(h>23||m>59) return null;
  return h*60+m;
}
function hmZ(min){min=((Math.round(min)%1440)+1440)%1440;return pad2(Math.floor(min/60))+pad2(min%60)+'Z';}
function durHM(min){min=Math.round(min);return Math.floor(min/60)+':'+pad2(min%60);}
function durClock(ms){
  var t=Math.ceil(Math.abs(ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h+':'+pad2(m)+':'+pad2(s);
}
// Next occurrence of an HHMM UTC time; up to 30 minutes in the past counts as today
function targetFromHM(min,now){
  var d=new Date(now),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())+min*60000;
  if(t<now-30*60000) t+=86400000;
  return t;
}
function restCalc(m){
  var s=parseHM(m.start),e=parseHM(m.end);
  if(s===null||e===null) return {err:'Enter the rest start and end times in UTC.'};
  if(e<=s) e+=1440;
  var total=e-s,n=m.n,B=m.buffer,usable=total-B*(n-1);
  if(usable<n*10) return {err:'The rest window is too short for '+n+' break'+(n>1?'s':'')+'.'};
  var L=usable/n,rows=[];
  for(var i=0;i<n;i++){
    var bs=s+i*(L+B),be=bs+L;
    if(i>0) bs=m.round?Math.round(bs/5)*5:Math.round(bs);
    be=(i===n-1)?e:(m.round?Math.round(be/5)*5:Math.round(be));
    rows.push({s:bs,e:be});
  }
  return {s:s,e:e,total:total,rows:rows};
}
// TIME-END
function restOutHTML(m){
  var r=restCalc(m);
  if(r.err) return '<div class="rest-msg">'+esc(r.err)+'</div>';
  var h=r.rows.map(function(x,i){
    return '<div class="rrow" data-ri="'+i+'"><input type="text" data-rlabel="'+i+'" data-id="'+m.id+'" value="'+esc(m.labels[i]||'')+'" placeholder="Break '+(i+1)+'" aria-label="Name for break '+(i+1)+'" autocomplete="off">'+
      '<span class="rright"><span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></span></div>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+h+'<div class="rest-sum">Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}
function restInfo(m,now){
  var r=restCalc(m);
  if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,txt='',on=false,idx=-1;
  if(rel<r.total){
    for(var i=0;i<r.rows.length;i++){
      var x=r.rows[i];
      if(abs>=x.s&&abs<x.e){idx=i;txt='Now: '+(m.labels[i]||'Break '+(i+1))+', '+durHM(Math.ceil(x.e-abs))+' left';on=true;break;}
      if(abs<x.s){txt='Handover, next at '+hmZ(x.s);break;}
    }
  }else{
    var wait=1440-rel;
    txt=wait<=720?'Starts in '+durHM(Math.ceil(wait)):'Rest finished';
  }

}

function restTop(m,now){

function apRec(l){return {icao:l.slice(0,4),tz:window.AIRPORT_TZ[parseInt(l.slice(4,6),36)],cc:l.slice(6,8),name:l.slice(8)};}
function apFind(q){

  function add(l){var c=l.slice(0,4);if(!seen[c]){seen[c]=1;out.push(apRec(l));}}

  if(/^[A-Z0-9]{2,3}$/.test(q)){for(var i=0;i<ix.lines.length&&out.length<8;i++){if(ix.lines[i].lastIndexOf(q,0)===0) add(ix.lines[i]);}}

/* ---------- Photo viewer: pinch, double-tap, pan, swipe ---------- */
var lb=$('#lb'),lbStage=$('#lbStage'),lbImg=$('#lbImg'),lbCount=$('#lbCount'),lbPrev=$('#lbPrev'),lbNext=$('#lbNext');
var lbList=[],lbIdx=0,zs=1,ztx=0,zty=0,zL=1,baseW=0,baseH=0,lbPts=new Map(),gest=null,lastTap=0,lastTapPos=null,lbHideT=0,commitT=0;
$('#lbClose').innerHTML=I.x;lbPrev.innerHTML=I.left;lbNext.innerHTML=I.right;
// After each gesture the photo is laid out at its zoomed size (zL), so the iPad redraws it
// at full detail instead of stretching the screen-sized picture.
function zLayout(){lbImg.style.width=(baseW*zL)+'px';lbImg.style.height=(baseH*zL)+'px';}
function zApply(anim){lbImg.style.transition=anim?'transform .2s ease':'none';lbImg.style.transform='translate('+ztx+'px,'+zty+'px) scale('+(zs/zL)+')';}
function zCommit(){clearTimeout(commitT);if(gest||zL===zs) return;zL=zs;zLayout();zApply(false);}
function zCommitSoon(ms){clearTimeout(commitT);commitT=setTimeout(zCommit,ms);}
function zBase(){
  var w=lbImg.naturalWidth,h=lbImg.naturalHeight;if(!w||!h) return;
  var cs=getComputedStyle(lbStage);
  var W=lbStage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  var H=lbStage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  var k=Math.min(W/w,H/h);baseW=Math.round(w*k);baseH=Math.round(h*k);
  zLayout();
}
function lbSetSrc(src){lbImg.src=src;if(lbImg.complete&&lbImg.naturalWidth){zBase();lbImg.classList.add('ready');}}
function zReset(anim){zs=1;ztx=0;zty=0;zApply(anim);if(zL!==1) zCommitSoon(anim?220:0);}
function zCenter(){var r=lbStage.getBoundingClientRect();return {x:r.left+lbImg.offsetLeft+lbImg.offsetWidth/2,y:r.top+lbImg.offsetTop+lbImg.offsetHeight/2};}

  var mx=w>W?(w-W)/2:0,my=h>H?(h-H)/2:0;
  ztx=Math.max(-mx,Math.min(mx,ztx));zty=Math.max(-my,Math.min(my,zty));

function zZoomAt(x,y,ns,anim){
  var c=zCenter(),px=(x-c.x-ztx)/zs,py=(y-c.y-zty)/zs;

  lbIdx=(i+lbList.length)%lbList.length;
  clearTimeout(commitT);zs=1;ztx=0;zty=0;zL=1;zApply(false);

  imgGet(id).then(function(v){
    if(!v||lbList[lbIdx]!==id) return;
    thumbCache.set(id,v.t);
    var full=new Image();full.src=v.f;
    (full.decode?full.decode():Promise.resolve()).catch(function(){}).then(function(){
      if(lbList[lbIdx]===id&&!lb.hidden) lbSetSrc(v.f);
    });
  }).catch(function(){});

  if(!lbPts.has(e.pointerId)||!gest) return;
  lbPts.set(e.pointerId,{x:e.clientX,y:e.clientY});

    var arr=Array.from(lbPts.values()),a=arr[0],b=arr[1],c=zCenter(),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;

    var dx=e.clientX-gest.x0,dy=e.clientY-gest.y0;
    if(Math.abs(dx)+Math.abs(dy)>8) gest.moved=true;
    if(zs>1){ztx=gest.tx0+dx;zty=gest.ty0+dy;zClamp();zApply(false);}
    else if(gest.moved&&!gest.fromPinch){
      lbImg.style.transition='none';

function lbEnd(e){
  if(!lbPts.has(e.pointerId)) return;

    if(!gest.moved){

        lastTap=0;
        if(zs>1) zReset(true);else zZoomAt(e.clientX,e.clientY,2.5,true);
      }else{lastTap=now;lastTapPos={x:e.clientX,y:e.clientY};}
    }else if(zs===1){
      if(gest.fromPinch) zReset(true);
      else if(lbList.length>1&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)) lbShow(lbIdx+(dx<0?1:-1));

    }else zCommitSoon(0);

    lbBegin();if(gest){gest.moved=true;gest.fromPinch=true;}
  }else if(lbPts.size===0){

lbStage.addEventListener('pointerup',lbEnd);
lbStage.addEventListener('pointercancel',lbEnd);
lbStage.addEventListener('wheel',function(e){
  e.preventDefault();

window.addEventListener('resize',function(){if(!lb.hidden){zBase();zClamp();zApply(false);}});

var drag=null,dragEndT=0,dragSuppress=false;
function dragLabel(kind,id){
  if(kind==='sec'){var r=findSec(id);return {t:r?r.section.title:'',s:''};}
  var f=find(id);if(!f) return {t:'',s:''};
  var n=f.node,k=n.type==='check'?n.children.length:0;
  if(n.type==='head'){var g=headGroups(f.section)[n.id]||{n:0};return {t:n.title||'Heading',s:g.n?g.n+' item'+(g.n>1?'s':''):''};}
  return {t:n.type==='check'?(n.text||'Untitled item'):n.title,s:k?k+' sub-item'+(k>1?'s':''):''};
}
function dragSibs(box,kind){
  return Array.prototype.filter.call(box.children,function(el){
    if(el===drag.orig||(drag.group&&drag.group.indexOf(el)>=0)) return false;
    if(kind==='sec') return el.classList.contains('sec');
    if(kind==='sub') return el.classList.contains('item');
    if(drag.isHead&&drag.group&&drag.group.length) return el.classList.contains('hd'); // a heading with items lands between groups
    return el.classList.contains('item')||el.classList.contains('module')||el.classList.contains('hd');

    var v=parseHM(t.value);if(v!==null){t.value=hmZ(v).slice(0,4);var f=find(t.getAttribute('data-id'));if(f){f.node[t.getAttribute('data-rest')]=t.value;saveSoon();}}
  }
  if(t.matches&&t.matches('[data-rest="buffer"]')){var bf=find(t.getAttribute('data-id'));if(bf&&bf.node.buffer!==(+t.value||0)){bf.node.buffer=+t.value||0;saveSoon();restRefresh(bf.node);}}
  if(t.matches&&t.matches('[data-rlabel]')){var lf=find(t.getAttribute('data-id'));if(lf) restStatus(lf.node,t.closest('.module'),Date.now());}
}

  if(!lb.hidden){
    if(e.key==='Escape') closeViewer();
    else if(e.key==='ArrowLeft'&&lbList.length>1) lbShow(lbIdx-1);
    else if(e.key==='ArrowRight'&&lbList.length>1) lbShow(lbIdx+1);
    return;
  }
  if(e.key==='Escape'&&!sheetWrap.hidden){if(sheetHandler) sheetHandler('cancel',null);else closeSheet();return;}
  if(e.key==='Escape'&&toolOpen) closeTool();
});

  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var onTheme=function(){ctl.forEach(function(c){c.redraw();});};
  if(mq.addEventListener) mq.addEventListener('change',onTheme);else if(mq.addListener) mq.addListener(onTheme);
}

tickLoop();
if(loadedOK) setTimeout(gcImages,4000);
setInterval(cloudMaybe,30000);
setInterval(function(){wxMaybe();wxPaint();},60000);

var cloudWasOn=cloud.on;
setTimeout(function(){
  // changes made last time but not yet backed up can go straight away
  if(!cloud.on||!cloudWasOn) return;
  var p=cloudPending();cloudTickHash=p.h;cloudChangedAt=Date.now()-CLOUD_QUIET;cloudMaybe();
  if(cloud.kind==='auth'||cloud.kind==='access') toast('Online backup needs attention. Open Menu → Online backup.',4500);
},5000);
window.addEventListener('online',function(){cloudRetryAt=0;cloudMaybe();});
document.addEventListener('visibilitychange',function(){
  if(!cloud.on||cloudBusy) return;
  if(document.visibilityState==='visible'){cloudMaybe();return;}
  // leaving the app: send any waiting changes now
  if(navigator.onLine!==false&&Date.now()>=cloudRetryAt){var p=cloudPending();if(p.h!==cloud.hash) cloudRun(true,p);}
});
if(loadedOK&&blocksMigrated) save();
if(!storageOK) toast('Storage is off here, so changes won’t be kept');
if('serviceWorker' in navigator&&location.protocol==='https:'){var hadCtl=!!navigator.serviceWorker.controller,swReloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtl||swReloaded) return;swReloaded=true;try{save();}catch(e){}location.reload();});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible') navigator.serviceWorker.getRegistration().then(function(r){if(r) r.update();}).catch(function(){});});}
})();
