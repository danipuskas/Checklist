      // the exact one: search and pick (or paste a link); offline it's saved by name to pin later
      if(navigator.onLine===false){addP(null);toast('Saved by name. Pin it when you’re online.');return;}
      prepFindSheet({title:'Which '+pv+'?',q:pv,from:geoFrom(hp,v),fromName:hp&&hp.n,city:prepCity(v),plain:true,pick:addP});return;
    case 'prepHoFind': prepFindHotel(id,v);return;
    case 'prepPlOpen': prepPlaceSheet(v,id);return;
    case 'prepPlF': prepPlF=v||'';refreshTool();return;
    case 'prepHoPick': prepHoPick(id);return;
    case 'prepHoEdit': var th=prepTripOf(id);if(th) prepHotelSheet(th.dest,v||null,id);return;
    case 'prepHoSet':
      var ts=prepTripOf(id);if(!ts) return;
      var ps=prepPlace(ts.dest),fs=fnoKey(ts.fno),ds=prepData(ts.id);
      // the first time a flight number meets a hotel, they stay together
      if(fs&&!ps.hotels.some(function(x){return x.f.indexOf(fs)>=0;})){ps.hotels.forEach(function(x){if(x.id===v) x.f.push(fs);});ds.hotel='';toast('Linked to '+fs);}else ds.hotel=v;
      save();refreshTool();return;
    case 'prepHoCopy':
      var hc=prepPlace(v).hotels.filter(function(x){return x.id===id;})[0];if(!hc||!hc.wp) return;
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(hc.wp):Promise.reject()).then(function(){toast('Wi-Fi password copied');},function(){toast(hc.wp,4000);});return;
    case 'prepGoElse': prepGoElse(id);return;
    case 'prepTipAdd': var ti=$('#prepTipIn'),tv=String(ti&&ti.value||'').trim();if(!tv) return;prepPlace(v).tips.push({id:uid(),t:tv.slice(0,300)});save();refreshTool();return;
    case 'prepTipDel': var pq=prepPlace(v);pq.tips=pq.tips.filter(function(x){return x.id!==id;});save();refreshTool();return;
    case 'prepBuy': prepPlace(v).buy.forEach(function(x){if(x.id===id){x.done=!x.done;x.at=x.done?Date.now():0;}});save();refreshTool();return;
    case 'prepBuyAdd': var bu=$('#prepBuyIn'),bw=String(bu&&bu.value||'').trim();if(!bw) return;prepPlace(v).buy.push({id:uid(),t:bw.slice(0,80),done:false,at:0});save();refreshTool();var b4=$('#prepBuyIn');if(b4) b4.focus();return;
    case 'prepBuyDel': var pb=prepPlace(v);pb.buy=pb.buy.filter(function(x){return x.id!==id;});save();refreshTool();return;
    case 'prepBuyClr': var pc=prepPlace(v);pc.buy=pc.buy.filter(function(x){return !x.done;});save();refreshTool();return;
    case 'prepSay': prepSay(v,id);return;
    case 'prepMaps': state.settings.maps=v==='google'?'google':'apple';save();refreshTool();toast('Maps open in '+mapsName());return;
    case 'prepPlDel': var pp=prepPlace(v);pp.items=pp.items.filter(function(x){return x.id!==id;});save();refreshTool();return;
    case 'prepBi': var db=prepData(id);db.before.forEach(function(x){if(x.id===v) x.done=!x.done;});save();refreshTool();return;
    case 'prepBiDel': var dd=prepData(id);dd.before.forEach(function(x){if(x.id===v&&x.auto){(dd.skip||(dd.skip=[])).push(x.t.toLowerCase());}});dd.before=dd.before.filter(function(x){return x.id!==v;});save();refreshTool();return;
    case 'prepBiAdd': var bi=$('#prepBiIn'),bv=String(bi&&bi.value||'').trim();if(!bv) return;prepData(id).before.push({id:uid(),t:bv.slice(0,80),done:false});save();refreshTool();var b2=$('#prepBiIn');if(b2) b2.focus();return;
    case 'prepTpl': state.prepTpl=prepData(id).before.filter(function(x){return !x.auto;}).map(function(x){return x.t;});save();toast('New trips start with this list');return;
  }
}

// Roster as text: CrewPulse's event notes ("201 / DXB - 12 Nov 2026 08:30 / JFK - 12 Nov 2026 14:05"), local times at each airport,
// with an optional "Report 12 Nov 2026 07:05" line before a trip. Claude can read the calendar and hand this over.
function localToUTC(s,tz){
  var m=/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})\s+(\d{1,2}):(\d{2})/.exec(s);if(!m) return null;
  var mo=MONS.indexOf(m[2].charAt(0).toUpperCase()+m[2].slice(1,3).toLowerCase());if(mo<0) return null;
  var g=Date.UTC(+m[3],mo,+m[1],+m[4],+m[5]),t=g;if(!tz) return g;
  for(var i=0;i<3;i++){var inf=tzInfo(tz,t);if(!inf) return g;t=g-inf.off*60000;}
  return t;
}
function rosterParse(txt){
  var D='(\\d{1,2}\\s+[A-Za-z]{3,9}\\s+\\d{4}\\s+\\d{1,2}:\\d{2})';
  var re=new RegExp('(?:^|\\n)[ \\t]*report[ \\t:]*'+D+'|(?:^|\\n)[ \\t]*(?:EK[ \\t]?)?(\\d{1,4}[A-Z]?)[ \\t]*\\n[ \\t]*([A-Z]{3,4})[ \\t]*[-–][ \\t]*'+D+'[ \\t]*\\n[ \\t]*([A-Z]{3,4})[ \\t]*[-–][ \\t]*'+D,'gi');
  var out=[],m,rep=null;txt=String(txt||'').replace(/\r/g,'');
  while((m=re.exec(txt))){
    if(m[1]){rep=m[1];continue;}
    var dep=apCode(m[3].toUpperCase()),dest=apCode(m[5].toUpperCase()),a=apRecOf(dep),b=apRecOf(dest);if(!a||!b) continue;
    var std=localToUTC(m[4],a.tz),sta=localToUTC(m[6],b.tz);if(std===null||sta===null||sta<=std) continue;
    var t={fno:/^\d/.test(m[2])?'EK'+m[2]:m[2].toUpperCase(),dep:dep,dest:dest,std:std,sta:sta};
    if(rep){var r=localToUTC(rep,a.tz);if(r!==null&&r<std&&std-r<6*3600000) t.rep=r;rep=null;}
    out.push(t);
  }
  return out;
}

/* The roster report from the crew portal (Crystal Reports PDF, "Emirates Crew Roster (Detailed Report)"): one row per day,
   "25-FRI 201 07:05 08:30-14:05 EK201 [DXB-JFK] 388 14:35 14: 35", times local at each airport, (+) the day after departure.
   Only the flights are read: no names, staff numbers or anything else */
var MONTHS_RE=/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d\d)\b/;
function rosterCrystal(txt){
  var lines=String(txt||'').replace(/\r/g,'').split('\n'),mm=MONTHS_RE.exec(txt),out=[],day=0,prev=null;
  if(!mm) return out;
  var y=+mm[2],mo=MONTHS.indexOf(mm[1]);
  lines.forEach(function(ln){
    var dm=/^\s*(\d{1,2})-(MON|TUE|WED|THU|FRI|SAT|SUN)\b/i.exec(ln);
    if(dm){day=+dm[1];prev=null;}
    var f=/\b([A-Z0-9]{2})\s?(\d{1,4}[A-Z]?)\s*\[\s*([A-Z]{3})\s*-\s*([A-Z]{3})\s*\]/.exec(ln);
    if(!f||!day) return;
    var tm=/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\s*(\(\s*([+-])\s*(\d?)\s*\))?/.exec(ln);if(!tm) return;
    var before=ln.slice(0,tm.index),rp=dm?/(\d{1,2}):(\d{2})\s*$/.exec(before.replace(/\s+$/,'')):null;
    var dep=apCode(f[3]),dest=apCode(f[4]),a=apRecOf(dep),b=apRecOf(dest);if(!a||!b) return;
    var ymd=new Date(Date.UTC(y,mo,day)).toISOString().slice(0,10),sh=tm[6]?(tm[6]==='-'?-1:1)*(+tm[7]||1):0;
    var std=locUTC(ymd,(+tm[1])*60+(+tm[2]),a.tz),ds=0;
    if(prev&&std<prev.sta){std+=86400000;ds=1;}
    var sta=locUTC(new Date(Date.UTC(y,mo,day+ds+sh)).toISOString().slice(0,10),(+tm[3])*60+(+tm[4]),b.tz);
    if(sta<=std) sta+=86400000;
    if(sta-std>20*3600000) return;
    var t={fno:(f[1]==='EK'||/^\d/.test(f[1])?'EK':f[1])+f[2],dep:dep,dest:dest,std:std,sta:sta};
    if(rp){var r=locUTC(ymd,(+rp[1])*60+(+rp[2]),a.tz);if(r>std) r-=86400000;if(std-r<6*3600000) t.rep=r;}
    out.push(t);prev=t;
  });
  return out;
}
// a PDF's text rebuilt row by row from where each piece sits (the roster report writes its table column by column)
function pdfRows(lib,buf){
  return lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
    var out=[],p=1;
    function next(){
      if(p>pdf.numPages){try{pdf.destroy();}catch(e){}return out.join('\n');}
      return pdf.getPage(p++).then(function(page){return page.getTextContent();}).then(function(tc){
        var rows=[];
        tc.items.forEach(function(it){
          if(!('str' in it)||!it.str.trim()) return;
          var x=it.transform[4],y=it.transform[5],r=null;
          for(var i=0;i<rows.length;i++){if(Math.abs(rows[i].y-y)<=2.5){r=rows[i];break;}}
          if(!r){r={y:y,its:[]};rows.push(r);}
          r.its.push({x:x,s:it.str});
        });
        rows.sort(function(a,b){return b.y-a.y;}).forEach(function(r){out.push(r.its.sort(function(a,b){return a.x-b.x;}).map(function(i){return i.s.trim();}).join(' '));});
        return next();
      });
    }
    return next();
  });
}
function rosterAny(txt){var L=rosterCrystal(txt);return L.length?L:rosterParse(txt);}
// what an import would do: new, changed (same flight, other times) or the same; trips you added by hand stay
function rosterDiff(list){
  var old=(state.trips||[]).filter(function(t){return t.src==='roster';}),mine=(state.trips||[]).filter(function(t){return t.src!=='roster';});
  return list.map(function(t){
    if(mine.some(function(x){return x.dep===t.dep&&x.dest===t.dest&&Math.abs(x.std-t.std)<3*3600000;})) return {t:t,st:'mine'};
    var o=old.filter(function(x){return x.fno===t.fno&&x.dep===t.dep&&Math.abs(x.std-t.std)<18*3600000;})[0];
    if(!o) return {t:t,st:'new'};
    return {t:t,st:o.std===t.std&&o.sta===t.sta&&(o.rep||0)===(t.rep||0)?'same':'changed',o:o};
  });
}
function rosterImport(list){
  if(!list.length) return 0;
  var D=rosterDiff(list),n=0,H=state.prepHidden||[];
  var lo=Math.min.apply(null,list.map(function(t){return t.std;})),hi=Math.max.apply(null,list.map(function(t){return t.std;}));
  var used={};D.forEach(function(x){if(x.o) used[x.o.id]=1;});
  // roster flights in the same days that aren't in the report any more go; the rest stays
  var keep=(state.trips||[]).filter(function(t){return t.src!=='roster'||t.std<lo-3600000||t.std>hi+3600000||used[t.id];});
  D.forEach(function(x){
    var t=x.t;if(x.st==='mine') return;
    if(x.o){var o=x.o;if(x.st==='changed'){o.std=t.std;o.sta=t.sta;o.rep=t.rep||o.rep||0;n++;}return;} // the same id: your wake-up, pick-up and plan stay with it
    var id='r-'+t.fno+'-'+t.dep+'-'+new Date(t.std).toISOString().slice(0,13);
    if(H.indexOf(id)>=0) return;
    keep.push({id:id,fno:t.fno,dep:t.dep,dest:t.dest,std:t.std,sta:t.sta,rep:t.rep||0,src:'roster',alts:[]});n++;
  });
  state.trips=keep;save();return n;
}
function rosterSheet(){
  var found=[],on=[];
  function res(){
    var D=rosterDiff(found),nn=0,nc=0;
    var h=found.length?'<div class="ri-h">Found '+found.length+' flight'+(found.length>1?'s':'')+'</div>'+D.map(function(x,i){
      var t=x.t,a=apRecOf(t.dep),tz=a&&a.tz,act=x.st!=='same'&&x.st!=='mine'&&on[i];
      if(act&&x.st==='new') nn++;if(act&&x.st==='changed') nc++;
      return '<button type="button" class="ri-row'+(x.st==='same'||x.st==='mine'?' off':'')+'" data-sact="tog" data-v="'+i+'"'+(x.st==='same'||x.st==='mine'?' disabled':'')+'><i class="'+(act?'on':'')+'">'+(act?I.check:'')+'</i>'+
        '<span><b>'+esc(t.fno+' '+ap3(t.dep)+' → '+ap3(t.dest))+'</b><small>'+esc(dayLbl(t.std,tzOffAt(tz,t.std))+(t.rep?' · report '+hmAt(tz,t.rep):'')+' · off '+hmAt(tz,t.std)+' '+(prepCity(t.dep)||t.dep))+'</small></span>'+
        '<em class="'+x.st+'">'+(x.st==='new'?'new':x.st==='changed'?'time changed':x.st==='mine'?'yours':'same')+'</em></button>';
    }).join(''):'';
    $('#riRes').innerHTML=h;
    var b=sheetEl.querySelector('[data-sact="save"]');b.disabled=!(nn+nc);
    b.textContent=nn+nc?['Add '+nn,'update '+nc].filter(function(s){return !/ 0$/.test(s);}).join(' · '):found.length?'Nothing new':'Add';
  }
  function got(txt){
    var L=rosterAny(txt);
    if(!L.length){$('#riRes').innerHTML='<p class="pa-err">No flights found in it. It needs the roster report (“Emirates Crew Roster”) or CrewPulse notes.</p>';return;}
    found=L;on=L.map(function(){return true;});res();
  }
  openSheet('<h3>Import your roster</h3><p class="hint">The roster report from the crew portal, as the PDF or its text. Times are local at each airport. Only the flights are read: days off, standby, training and names are left out.</p>'+
    '<div class="ri-pick"><input type="file" id="riFile" class="vh" accept="application/pdf,.pdf"><label for="riFile" class="ri-b">'+IX.file+'Choose the PDF</label><button type="button" class="ri-b" data-sact="paste">'+I.copy+'Paste text</button></div>'+
    '<div id="riP" hidden><textarea id="riTx" class="ev-in" rows="6" placeholder="25-FRI 201 07:05 08:30-14:05 EK201 [DXB-JFK] …"></textarea><button type="button" class="btn small" data-sact="read">Read it</button></div>'+
    '<div id="riRes"></div>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button><button type="button" class="btn primary" data-sact="save" disabled>Add</button></div>',
  function(act,btn){
    switch(act){
      case 'paste': var p=$('#riP');p.hidden=false;var ta=$('#riTx');ta.focus();
        if(navigator.clipboard&&navigator.clipboard.readText) navigator.clipboard.readText().then(function(t){if(t&&!ta.value){ta.value=t;got(t);}},function(){});
        break;
      case 'read': got($('#riTx').value);break;
      case 'tog': var i=+btn.getAttribute('data-v');on[i]=!on[i];res();break;
      case 'save':
        var D=rosterDiff(found),pick=found.filter(function(t,i){return on[i]&&D[i].st!=='same'&&D[i].st!=='mine';});
        var n=rosterImport(pick);closeSheet();prepSel=null;refreshTool();
        toast(n?n+' flight'+(n>1?'s':'')+' added or updated':'Nothing changed');break;
      default: closeSheet();
    }
  });
  $('#riFile').addEventListener('change',function(ev){
    var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f) return;
    $('#riRes').innerHTML='<p class="hint">Reading '+esc(f.name)+'…</p>';
    var ready=window.AIRPORT_DATA?Promise.resolve():loadAirports();
    ready.then(function(){return loadPdfJs();}).then(function(lib){return fileBuf(f).then(function(b){return pdfRows(lib,b);});}).then(got,function(e){
      $('#riRes').innerHTML='<p class="pa-err">'+esc(e&&e.mine?e.message:'That file couldn’t be read. Is it the roster PDF?')+'</p>';
    });

function sunRS(lat,lon,t){
  // sunrise and sunset for the solar day nearest t (standard sunrise equation, about a minute accurate)
  var r=Math.PI/180,J=t/86400000+2440587.5,best=null;
  function toMs(j){return (j-2440587.5)*86400000;}
  function day(n){
    var Js=n-lon/360,M=((357.5291+0.98560028*Js)%360+360)%360,Mr=M*r;
    var C=1.9148*Math.sin(Mr)+0.02*Math.sin(2*Mr)+0.0003*Math.sin(3*Mr);
    var L=(M+C+180+102.9372)%360,Lr=L*r;
    var Jt=2451545+Js+0.0053*Math.sin(Mr)-0.0069*Math.sin(2*Lr);
    var sd=Math.sin(Lr)*Math.sin(23.4397*r),cd=Math.cos(Math.asin(sd));
    var cw=(Math.sin(-0.833*r)-Math.sin(lat*r)*sd)/(Math.cos(lat*r)*cd);
    if(cw>1) return {polar:'night',noon:toMs(Jt)};
    if(cw<-1) return {polar:'day',noon:toMs(Jt)};
    var w0=Math.acos(cw)/r;
    return {rise:toMs(Jt-w0/360),set:toMs(Jt+w0/360),noon:toMs(Jt)};
  }
  var n0=Math.floor(J-2451545+0.0008);
  [n0-1,n0,n0+1].forEach(function(n){var d=day(n);if(!best||Math.abs(d.noon-t)<Math.abs(best.noon-t)) best=d;});
  return best;
}

  var h='<div class="pb-card pb-time'+(w?'':' one')+'"><div><small>Local now</small><b>'+info.hm+'</b><i>'+info.wd+' · '+fmtOff(info.off)+' · '+esc(rel)+'</i></div>';

  return {icao:l.slice(0,4),tz:window.AIRPORT_TZ[parseInt(l.slice(4,6),36)],cc:l.slice(6,8),name:p[0].slice(8),iata:p[1]||'',lat:ll.length===2?+ll[0]:null,lon:ll.length===2?+ll[1]:null};
}
function apLookup(ic){if(!window.AIRPORT_DATA) return null;var l=apIndex().map.get(ic);return l?apRec(l):null;}
// an airport typed as IATA (JFK) becomes its ICAO code (KJFK) once the airport list is loaded
function iataToIcao(v){
  var c=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length===3&&window.AIRPORT_DATA){var l=apIndex().iata.get(c);if(l) return l.slice(0,4);}
  return c;
}
function apCode(v){return icaoClean(iataToIcao(v));}
function apFind(q){
  q=q.trim().toUpperCase();
  var ix=apIndex(),out=[],seen={};
  function add(l){var c=l.slice(0,4);if(!seen[c]){seen[c]=1;out.push(apRec(l));}}
  if(/^[A-Z0-9]{4}$/.test(q)&&ix.map.has(q)) add(ix.map.get(q));
  if(/^[A-Z]{3}$/.test(q)&&ix.iata.has(q)) add(ix.iata.get(q));
  if(/^[A-Z0-9]{2,3}$/.test(q)){for(var i=0;i<ix.lines.length&&out.length<8;i++){if(ix.lines[i].lastIndexOf(q,0)===0) add(ix.lines[i]);}}
  if(q.length>=3&&out.length<8){for(var j=0;j<ix.lines.length&&out.length<8;j++){if(apRec(ix.lines[j]).name.toUpperCase().indexOf(q)>=0) add(ix.lines[j]);}}
  return out;
}
function zoneList(){
  var z=[];
  try{if(Intl.supportedValuesOf) z=Intl.supportedValuesOf('timeZone');}catch(e){}
  if(!z.length&&window.AIRPORT_TZ) z=window.AIRPORT_TZ.slice();
  if(z.indexOf('UTC')<0) z.unshift('UTC');
  return z;
}

function olAddSheet(sid){

    o('check',I.tickbox,'Item','Something to tick off')+o('info',I.info,'Info','Text to read, with a note, links or photos')+o('head',I.heading,'Header','Groups the items below it')+

var lp=null,lpSwallow=0,lpEl=null;
function lpTarget(e){
  if(editMode||selMode||drag) return null;
  var t=e.target;if(!t||!t.closest) return null;
  if(t.closest('a,input,select,textarea,label,.thumb,.kid-toggle,.fx-c,.ans,.ab,.lnk,.grip,.ie-bar')) return null;
  var row=t.closest('.item > .row');
  if(row&&!row.closest('.mod-body')){var it=row.parentNode;return {id:it.getAttribute('data-item'),el:row};}
  var hd=t.closest('.sec-body > .hd');if(hd) return {id:hd.getAttribute('data-mod'),el:hd};
  var mh=t.closest('.sec-body > .module > .mod-head');if(mh) return {id:mh.parentNode.getAttribute('data-mod'),el:mh};
  var mb=t.closest('.sec-body > .module > .mod-body');
  if(mb&&!t.closest('button,canvas,[contenteditable],.pkg-drop,.canvas-wrap,.item')) return {id:mb.parentNode.getAttribute('data-mod'),el:mb.parentNode};
  return null;
}

function lpMenu(id,anchor,px,py){
  var f=find(id);if(!f) return;
  lpClose();
  var n=f.node,isItem=n.type==='check',plain=isItem&&plainItem(n),isHead=n.type==='head',rows=[];
  function r(a,t,ic,cls){rows.push('<button type="button" data-lp="'+a+'"'+(cls?' class="'+cls+'"':'')+'><span>'+t+'</span>'+ic+'</button>');}
  r('edit','Edit…',I.edit);
  if(plain){r('note',n.note?'Change the note':'Add a note',IC_NOTE);r('link','Add a link',I.link);if(f.anc.length+1<=MAXD) r('sub','Add a sub-item',IC_SUB);}
  if(isItem||isHead) r('below',isHead?'Add an item under it':'Add an item below',I.plus);
  if(isItem){r('dup','Duplicate',I.copy,'sp');if(!f.apn) r('move','Move…',I.move);}
  r('del','Delete',I.trash,'sp dg');
  anchor.classList.add('lp-on');

// Keep the menu inside what can be seen: below the status bar and above the home bar. Next to the item when there is room,
// otherwise (a tall item) next to the finger; scrolls when even the whole screen is too short.
function lpPlace(m,ar,px,py){
  var cs=getComputedStyle(document.documentElement),W=window.innerWidth,H=window.innerHeight;
  var vv=window.visualViewport;if(vv&&vv.height) H=Math.min(H,vv.height);
  var T=(parseFloat(cs.paddingTop)||0)+8,B=H-(parseFloat(cs.paddingBottom)||0)-8,mw=m.offsetWidth,mh=m.offsetHeight;
  if(mh>B-T){m.style.maxHeight=(B-T)+'px';m.style.overflowY='auto';mh=B-T;}
  if(px==null){px=ar.left+ar.width/2;py=ar.top+ar.height/2;}
  var top,left=ar.left+16;
  if(ar.bottom+6+mh<=B&&ar.bottom>=T&&ar.bottom-py<160) top=ar.bottom+6;           // under the item, close to the finger
  else if(ar.top-6-mh>=T&&ar.top<=B&&py-ar.top<160) top=ar.top-6-mh;              // over the item
  else{left=px-mw/2;top=py+18+mh<=B?py+18:py-18-mh>=T?py-18-mh:py-mh/2;}       // tall item: by the finger
  m.style.left=Math.max(10,Math.min(left,W-mw-10))+'px';
  m.style.top=Math.max(T,Math.min(top,B-mh))+'px';
}
function lpAct(a,id){
  lpClose();
  var f=find(id);if(!f) return;var n=f.node,nm=n.text||n.title||BLK_NM[n.type]||'this item';
  switch(a){
    case 'edit': if(n.type==='check') openItemEditor(id,false);else editModOpen(id);break;
    case 'note': openItemEditor(id,false);var fn=$('#fNote');if(fn){fn.focus();var L=fn.value.length;try{fn.setSelectionRange(L,L);}catch(_){}}break;
    case 'link': openItemEditor(id,false);if(sheetHandler) sheetHandler('addLink',null);break;
    case 'sub': var k=newCheck();n.children.push(k);n.open=true;render();openItemEditor(k.id,true,id);break;
    case 'below':
      var b=newCheck();if(plainItem(n)) b.info=n.info;
      f.arr.splice(f.arr.indexOf(n)+1,0,b);if(n.type==='head') n.collapsed=false;
      render();openItemEditor(b.id,true);break;
    case 'dup': var before=JSON.stringify(state),c=dupNode(n);f.arr.splice(f.arr.indexOf(n)+1,0,c);save();render();flash(c.id);offerUndo(before,'Duplicated “'+String(nm).slice(0,30)+'”');break;
    case 'move': openMoveSheet(id);break;
    case 'del':
      confirmSheet(n.type==='head'?'Delete the header “'+esc(nm)+'”? The items under it stay.':'Delete “'+esc(nm)+'”'+((n.children||[]).length?' and its sub-items':'')+'?','Delete',
        function(){var p=parentOf(f);removeNode(f);kidsDoneFix(p);save();render();});
      break;
  }
}

/* ---------- Edit mode: select several items and act on them at once ---------- */
var selBar=null;
function selStart(){ieDrop();selMode=true;sel.clear();render();}
function selEnd(){selMode=false;sel.clear();render();}
function selToggle(id){
  var f=find(id);if(!f||f.apn||f.tool||f.opt||f.node.type!=='check') return;
  if(sel.has(id)) sel.delete(id);else sel.add(id);
  var el=app.querySelector('[data-item="'+id+'"]');if(el) el.classList.toggle('picked',sel.has(id));
  selPaint();
}
// the picked items in screen order, leaving out any inside another picked item (they go with it)
function selTops(){
  var out=[];
  function w(arr,inside){arr.forEach(function(n){var p=sel.has(n.id);if(p&&!inside) out.push(n);if(n.children) w(n.children,inside||p);});}
  cur().sections.forEach(function(s){w(s.items,false);});
  return out;
}
function selPaint(){
  if(!selBar){
    selBar=document.createElement('div');selBar.className='selbar';selBar.hidden=true;
    selBar.setAttribute('role','toolbar');selBar.setAttribute('aria-label','Selected items');
    function b(a,ic,t,c){return '<button type="button" data-sel="'+a+'"'+(c?' class="'+c+'"':'')+'>'+ic+'<span>'+t+'</span></button>';}
    selBar.innerHTML='<b id="selN"></b>'+b('move',I.move,'Move')+b('out',IC_OUT,'Out')+b('in',IC_IN,'In')+b('dup',I.copy,'Duplicate')+b('type',I.info,'Type')+b('del',I.trash,'Delete','dg');
    selBar.addEventListener('click',function(e){var x=e.target.closest('[data-sel]');if(x&&!x.disabled) selAct(x.getAttribute('data-sel'));});
    document.body.appendChild(selBar);
  }
  var on=editMode&&selMode;selBar.hidden=!on;if(!on) return;
  // keep only picks that are still in this checklist, and show them
  var live=new Set();
  cur().sections.forEach(function(s){(function w(a){a.forEach(function(n){if(sel.has(n.id)) live.add(n.id);if(n.children) w(n.children);});})(s.items);});
  sel=live;
  app.querySelectorAll('.item.picked').forEach(function(el){if(!sel.has(el.getAttribute('data-item'))) el.classList.remove('picked');});
  sel.forEach(function(id){var el=app.querySelector('[data-item="'+id+'"]');if(el) el.classList.add('picked');});
  var n=sel.size;
  $('#selN').textContent=n?n+' selected':'None selected';
  selBar.querySelectorAll('[data-sel]').forEach(function(x){x.disabled=!n;});
}
function dupNode(n){
  var c=JSON.parse(JSON.stringify(n));
  (function re(x){x.id=uid();x.done=false;if(x.fld) x.fld.val='';if(x.dq){x.ans='';x.dq.forEach(function(a){a.id=uid();a.items.forEach(re);});}(x.children||[]).forEach(re);})(c);
  return c;
}
function selAct(a){
  var tops=selTops();if(!tops.length) return;
  var n=tops.length,nm=n===1?'“'+(tops[0].text||'item').slice(0,30)+'”':n+' items',before=JSON.stringify(state);
  function drop(){tops.forEach(function(x){var f=find(x.id);if(!f) return;var p=parentOf(f);removeNode(f);kidsDoneFix(p);});}
  if(a==='del'){drop();sel.clear();save();render();offerUndo(before,'Deleted '+nm);return;}
  if(a==='move'){selMoveSheet(tops,nm);return;}
  if(a==='type'){selTypeSheet(tops);return;}
  if(a==='dup'){
    // copies go right after the originals; items next to each other stay together
    var runs=[],last=null,cp=[];
    tops.forEach(function(x){var f=find(x.id);if(!f) return;var i=f.arr.indexOf(x);
      if(last&&last.arr===f.arr&&last.end===i-1){last.items.push(x);last.end=i;}else{last={arr:f.arr,items:[x],end:i};runs.push(last);}});
    runs.forEach(function(r){var at=r.arr.indexOf(r.items[r.items.length-1])+1,cs=r.items.map(dupNode);Array.prototype.splice.apply(r.arr,[at,0].concat(cs));cs.forEach(function(c){cp.push(c.id);});});
    sel=new Set(cp);save();render();toast('Duplicated '+nm+'. The copies are selected.',2600);return;
  }
  var moved=0;
  if(a==='in') tops.forEach(function(x){var f=find(x.id);if(f&&indentNode(f)) moved++;});
  if(a==='out') tops.slice().reverse().forEach(function(x){var f=find(x.id);if(f&&outdentNode(f)) moved++;});
  if(moved){save();render();}
  if(moved<n) toast(a==='in'?(moved?(n-moved)+' couldn’t go in: no item above that can hold them':'No item above that can hold them'):(moved?(n-moved)+' are already at the top level':'Already at the top level'),2600);
}
function selMoveSheet(tops,nm){
  var T=moveTargets(tops),h='',lastL=null;
  T.forEach(function(t,i){
    if(t.L!==lastL){lastL=t.L;h+='<div class="mvh">'+esc(t.L.title)+'</div>';}
    if(t.kind==='sec') h+='<button type="button" data-sact="to" data-i="'+i+'">'+I.list+'<span class="t">'+esc(t.sec.title)+'</span><small>At the end</small></button>';
    else h+='<button type="button" data-sact="to" data-i="'+i+'" style="padding-left:'+(10+t.depth*18)+'px">'+I.diamond+'<span class="q">'+esc(t.dec.text||'Untitled question')+'</span><b class="'+decTone(t.opt.tone)+'">'+esc(t.opt.label)+'</b></button>';
  });
  openSheet('<h3>Move '+nm+'</h3><p class="hint">To a section, or to an answer of a decision. They go to the end, in the order they’re in now.</p><div class="mvl">'+h+'</div>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button></div>',
  function(act,btn){
    if(act!=='to'){closeSheet();return;}
    var t=T[+btn.getAttribute('data-i')];if(!t) return;
    var before=JSON.stringify(state);
    tops.forEach(function(x){var f=find(x.id);if(!f) return;var p=parentOf(f);removeNode(f);kidsDoneFix(p);});
    Array.prototype.push.apply(t.arr,tops);
    if(t.L.id===state.current&&t.sec.collapsed) t.sec.collapsed=false;
    sel.clear();save();closeSheet();render();
    if(t.L.id===state.current) flash(t.kind==='ans'?t.dec.id:tops[0].id);
    offerUndo(before,'Moved '+nm+' to '+(t.kind==='ans'?t.opt.label:t.sec.title));
  });
}
function selTypeSheet(tops){
  var pl=tops.filter(plainItem),skip=tops.length-pl.length;
  if(!pl.length){toast('Decisions, fields and ends keep their type. Change them one at a time.',3000);return;}
  openSheet('<h3>Change '+pl.length+' item'+(pl.length>1?'s':'')+' to</h3>'+(skip?'<p class="hint">'+skip+' decision'+(skip>1?'s, fields or ends stay':', field or end stays')+' as '+(skip>1?'they are':'it is')+'.</p>':'')+
    '<div class="mvl"><button type="button" data-sact="check">'+I.check+'<span class="t">Checkbox</span><small>Ticked and counted</small></button>'+
    '<button type="button" data-sact="info">'+I.info+'<span class="t">Info</span><small>No tick, not counted</small></button></div>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="cancel">Cancel</button></div>',
  function(act){
    closeSheet();if(act!=='check'&&act!=='info') return;
    pl.forEach(function(x){x.info=act==='info';if(x.info) x.done=false;});
    save();render();
  });
}

/* ---------- Edit mode: Undo, step by step ---------- */
// folding and unfolding aren't changes worth undoing, so they're left out when comparing
function undoKey(){return JSON.stringify(state,function(k,v){return k==='collapsed'||k==='open'?undefined:v;});}
function undoSnap(){return {js:JSON.stringify(state),key:undoKey()};}
// called by save() in Edit mode: keeps the checklists as they were before this change
function undoNote(){
  var s=undoSnap();
  if(!undoBase||s.key===undoBase.key){undoBase=s;undoPaint();return s.js;}
  var top=undoStk[undoStk.length-1];
  if(top&&top.key===s.key) undoStk.pop(); // back to how it was a step ago (an empty new item that went away)
  else{
    undoStk.push(undoBase);
    var tot=0;
    for(var i=undoStk.length-1;i>=0;i--){tot+=undoStk[i].js.length;if(tot>24e6||undoStk.length-i>50){undoStk.splice(0,i+1);break;}}
  }
  undoBase=s;undoPaint();return s.js;
}
function undoStep(){
  if(!editMode) return;
  ieDrop();if(selMode){selMode=false;sel.clear();}
  var s=undoStk.pop();if(!s){undoPaint();return;}
  var o=null;try{o=normalize(JSON.parse(s.js));}catch(e){}
  if(!o){toast('Couldn’t undo');undoPaint();return;}
  state=o;fresh.clear();
  undoBusy=true;save();undoBusy=false;
  undoBase=undoSnap();
  if(!sheetWrap.hidden) closeSheet();
  render();if(toolOpen) refreshTool();clockTick();undoPaint();
  toast(undoStk.length?'Undone':'Undone. Nothing more to undo.');
}
function undoPaint(){if(!undoBtn) return;undoBtn.hidden=!editMode;undoBtn.disabled=!undoStk.length;}

/* ---------- Events ---------- */
function onAct(e){
  if(e.target.closest('a')) return;
  if(e.target.closest('.grip')){dragSuppress=false;return;}
  if(dragSuppress){dragSuppress=false;if(Date.now()-dragEndT<300) return;}
  var root=e.currentTarget,el=e.target.closest('[data-act]');if(!el||!root.contains(el)) return;
  var id=el.getAttribute('data-id'),c,act0=el.getAttribute('data-act');
  if((root===app||root===toolPanel)&&lpSwallow&&Date.now()-lpSwallow<900){lpSwallow=0;return;} // the finger lifting after a long press
  if(selMode&&root===app&&['editItem','olOpen','selMode','toggleSec','toggleKids','headFold','lists'].indexOf(act0)<0) return; // while selecting, a tap only picks items
  switch(act0){
    case 'tick': tick(id);break;
    case 'editItem': if(selMode) selToggle(id);else openItemEditor(id,false);break;
    case 'olOpen': olOpen(id);break;
    case 'olAdd': olAddSheet(id);break;
    case 'selMode': if(selMode) selEnd();else selStart();break;
    case 'toggleKids': toggleKids(id);break;
    case 'toggleSec': toggleSec(id);break;
    case 'editSec': openSecEditor(id);break;
    case 'addItem': addItem(id);break;
    case 'addBlock': openBlockPicker(id);break;
    case 'fxSet': fxSet(id,el.getAttribute('data-v'),el);break;
    case 'fxNow': fxNow(id,el);break;
    case 'hotFluid': case 'hotNow': case 'hotClear': hotAct(el.getAttribute('data-act'),id,el);break;
    case 'addCalc': addModule(id,newCalc());break;
    case 'addPad': addModule(id,newPad());break;
    case 'addSection': addSection();break;
    case 'lists': openLists();break;
    case 'modToggle': modToggle(id);break;
    case 'editMod': editModOpen(id);break;
    case 'editModOld':
      var mf=find(id);
      if(mf&&mf.node.type==='apn') openApnEditor(id);
      else if(mf&&mf.node.link&&mf.node.type==='cd') openCdBlockEditor(id);
      else if(mf&&mf.node.link&&mf.node.type==='rest') openRestBlockEditor(id);
      else if(mf&&mf.node.type==='flog') openFlogBlockEditor(id);
      else if(mf&&mf.node.type==='apst') openApstEditor(id);
      else if(mf&&mf.node.type==='wx') openWxBlockEditor(id);
      else if(mf&&mf.node.type==='nt') openNtBlockEditor(id);
      else openModEditor(id);
      break;
    case 'cdPick': openCdBlockEditor(id);break;
    case 'calcKey': calcKey(id,el.getAttribute('data-k'));break;
    case 'calcHist': calcHist(id,el.getAttribute('data-r'));break;
    case 'padMode': padMode(id,el.getAttribute('data-m'));break;
    case 'padTool': c=ctl.get(id);if(c) c.setTool(el.getAttribute('data-t'));break;
    case 'padUndo': c=ctl.get(id);if(c) c.undo();break;
    case 'padClear': padClear(id);break;
    case 'padExtend': padExtend(id);break;
    case 'addCd': var nb=newCdBlock();addModule(id,nb);openCdBlockEditor(nb.id,true);break;
    case 'addRest': addModule(id,newRestBlock());break;
    case 'addApn': addModule(id,newApn());break;
    case 'addFlog': var fb=newFlogBlock();addModule(id,fb);openFlogBlockEditor(fb.id,true);break;
    case 'addApst': addModule(id,newApstBlock());break;
    case 'addWx': addModule(id,newWxBlock());wxMaybe();break;
    case 'wxRefresh':
      if(!state.settings.wxUrl) break;
      if(!wxIdsAll().length){toast('Set the flight or load a package first');break;}
      wxSt.retry=0;wxFetch(wxIdsAll());break;
    case 'wxOpen': openTool('wx');break;
    case 'wxOneNow': if(state.settings.wxUrl&&!wxSt.busy){wxSt.retry=0;wxFetch([el.getAttribute('data-v')]);}break;
    case 'wxAtis':
      var ak=el.getAttribute('data-v');if(wxAtisOpen.has(ak)) wxAtisOpen.delete(ak);else wxAtisOpen.add(ak);
      el.classList.toggle('clamp',!wxAtisOpen.has(ak));
      var am=el.nextElementSibling&&el.nextElementSibling.querySelector('.wxmore');if(am) am.style.display=wxAtisOpen.has(ak)?'none':'';
      break;
    case 'wxSetUrl': wxSetUrl();break;
    case 'brTab': brTabTo(el.getAttribute('data-v'));break;
    case 'kwList': openKwList();break;
    case 'ntKeptOnly': ntKeptOnly();break;
