.pb-time{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-variant-numeric:tabular-nums}
.pb-time.one{grid-template-columns:1fr}
.pb-time > div{display:flex;flex-direction:column;min-width:0}
.pb-time small{font-size:12px;color:var(--muted);font-weight:600}
.pb-time b{font-size:calc(18px*var(--ts));font-weight:750}
.pb-time i{font-style:normal;font-size:calc(12.5px*var(--ts));color:var(--muted)}
.pb-time .pb-sun{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:calc(13.5px*var(--ts));font-weight:650;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:7px;margin-top:2px}
.pb-time .pb-sun.dark{color:var(--warn)}
.pb-time .pb-sun svg{width:16px;height:16px;flex:none}
.pb-alts{margin-top:8px;padding:2px 4px 2px 12px}
.pb-alt{appearance:none;border:0;background:none;color:var(--text);width:100%;display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line-soft);font:500 calc(14px*var(--ts)) -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:left}
.pb-alt:first-child{border-top:0}
.pb-alt b{font-size:calc(15px*var(--ts));font-weight:700;flex:none}
.pb-alt .wxcat{flex:none}
.pb-alt .q{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-alt svg{width:16px;height:16px;color:var(--muted);flex:none}
.pb-vis{appearance:none;border:0;background:none;color:var(--text);width:100%;display:block;text-align:left;padding:9px 0;border-top:1px solid var(--line-soft);font:500 calc(14px*var(--ts))/1.35 -apple-system,system-ui,sans-serif}
.pb-vis:first-child{border-top:0}
.pb-vis .d{display:block;color:var(--muted);font-size:calc(12.5px*var(--ts));font-weight:650}
.pb-vis b{font-weight:650}
.pb-vis .nt{display:block;color:var(--muted);font-size:calc(13.5px*var(--ts));margin-top:2px}
.pb-visits{padding:2px 12px}
.pb-mini .mini{padding:0}
.pb-none{color:var(--muted);font-size:calc(14px*var(--ts));margin:4px 4px 0}
.pb-notes{border:1px solid var(--line);border-radius:12px;overflow:hidden}

/* Countdown and crew rest blocks: the result once set, controls on tap */
.mod-head .mod-x{text-decoration:none;padding:8px 12px;font-size:calc(15px*var(--ts));flex:none}
.cd.rd .cd-row{appearance:none;border:0;background:none;color:var(--text);width:100%;display:flex;align-items:center;gap:11px;padding:calc(11px*var(--sp)) 14px;text-align:left;font:inherit;border-radius:13px}
.cd.rd .cd-row:active{background:var(--press)}
.cd.rd .cd-row > svg{width:20px;height:20px;color:var(--accent);flex:none}
.cd-rt{flex:1;min-width:0;display:flex;flex-direction:column}
.cd-rt b{font-size:calc(16px*var(--ts));font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-rt small{font-size:calc(13px*var(--ts));color:var(--muted);font-variant-numeric:tabular-nums}
.cd.rd .cd-rem{font-size:calc(28px*var(--ts))}
.cd.rd.unset .cd-rem{display:none}
.cd-setpill{background:var(--accent-weak);color:var(--accent);font-weight:650;font-size:calc(14px*var(--ts));padding:8px 13px;border-radius:10px;flex:none}
.cd.rd .cd-alert{margin:0 10px 10px}
.rest.rd .rest-out{margin-top:0}
.rest-out.rd .rrow{appearance:none;border:0;border-top:1px solid var(--line-soft);background:none;color:var(--text);width:100%;text-align:left;font:inherit;padding:9px 12px}
.rest-out.rd .rrow:active{background:var(--press)}
.rname{display:flex;align-items:center;gap:7px;min-width:0;font-size:calc(16px*var(--ts));font-weight:600}
.rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:5px;padding:2px 6px;flex:none}
.rrow.mine{box-shadow:inset 4px 0 0 var(--accent)}
.rrow.mine:not(.now){background:var(--accent-weak)}
.rest-hint{color:var(--accent);font-weight:600}
.rpick{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:4px 2px 4px 10px;margin:-4px 0;border-radius:8px;cursor:pointer;text-align:right;-webkit-tap-highlight-color:transparent}
.rpick:active{background:var(--press)}
.rpick .you{margin-bottom:3px}
/* Straight on to the next checklist */
.nextcl{appearance:none;border:0;width:100%;display:flex;align-items:center;gap:12px;margin:2px 0 calc(14px*var(--sp));padding:14px 14px 14px 16px;border-radius:16px;background:var(--accent);color:var(--on-accent);text-align:left;font:inherit}
.nextcl[hidden]{display:none}
.nextcl:active{filter:brightness(.92)}
.nextcl .nc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.nextcl small{font-size:calc(13px*var(--ts));font-weight:650;opacity:.82}
.nextcl b{font-size:calc(21px*var(--ts));font-weight:750;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextcl i{font-style:normal;font-size:calc(13px*var(--ts));opacity:.82}
.nextcl svg{width:26px;height:26px;flex:none;stroke-width:2.4}
.tb-chips.pair{column-gap:4px}
.tb-chips.pair .restchip{padding-right:9px}
.tb-chips.pair .etachip{padding:3px 9px}
.tb-chips.pair .etachip svg{display:none}
.chip.next{color:var(--accent);font-weight:700;cursor:pointer;max-width:55%;overflow:hidden;text-overflow:ellipsis}
/* Menu as live tiles */
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.mtiles button{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:14px;padding:10px 12px 11px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;font:inherit}
.mtiles button:active{background:var(--press)}
.mtiles .wide{grid-column:1/-1}
.mtiles .mi{display:flex;align-items:center;gap:7px;width:100%;font-size:calc(13px*var(--ts));color:var(--muted);font-weight:650;white-space:nowrap}
.mtiles .mi svg{width:18px;height:18px;color:var(--accent);flex:none}
.mtiles .mi .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:auto}
.mtiles b{font-size:calc(23px*var(--ts));font-weight:750;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;margin-top:5px;line-height:1.15;max-width:100%;white-space:nowrap}
.mtiles b.on{color:var(--done)}
.mtiles i{font-style:normal;font-size:calc(12.5px*var(--ts));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.mtiles .wxcat{font-size:11px}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 -2px 2px}
.mrow button{appearance:none;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:5px;font:600 calc(13px*var(--ts)) -apple-system,system-ui,sans-serif;padding:9px 2px 8px;border-radius:12px;text-align:center}
.mrow button:active{background:var(--press)}
.mrow svg{width:22px;height:22px;color:var(--accent)}
.mrow .pri{background:var(--accent-weak);color:var(--accent)}

/* Reference tags: [FCOM] etc. in a check */
.rtag{display:inline-block;font-size:.7em;font-weight:750;letter-spacing:.03em;line-height:1.35;color:var(--muted);border:1px solid var(--line-strong);border-radius:5px;padding:0 5px;margin:0 3px;vertical-align:.12em;white-space:nowrap}
.label > .rtag:first-child{margin-left:0;margin-right:6px}
/* Checklist picker */
.lpks{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}
.lpk{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:13px;padding:11px 14px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;width:100%}
.lpk:active{background:var(--press)}
.lpk.on{border-color:var(--accent);background:var(--accent-weak)}
.lpk-t{display:flex;align-items:baseline;gap:10px;min-width:0}
.lpk-t b{flex:1;min-width:0;font-size:calc(17px*var(--ts));font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpk.on .lpk-t b{color:var(--accent)}
.lpk-t small{flex:none;font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px}
.lpk-t small svg{width:14px;height:14px;stroke-width:3}
.lpk.done .lpk-t small{color:var(--done)}
.lpk-bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lpk-bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.lpk.done .lpk-bar i{background:var(--done)}
/* Folded blocks say what is inside */
.mod-title .msub{display:none}
.module.collapsed .mod-title{display:flex;flex-direction:column;line-height:1.25}
.module.collapsed .mod-title .mt1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.module.collapsed .mod-title .msub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.msub b{color:var(--text);font-weight:650}
.module.collapsed .mod-toggle .apn-tag,.module.collapsed .mod-toggle .fl-tag{display:none}
.msub .wxcat{display:inline-block;font-size:10px;padding:0 5px;line-height:1.5;vertical-align:1px}

/* Links shown as a tag in the text, or as an icon at the right */
a.rtag.rl{color:var(--accent);border-color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-weak);text-decoration:none;font-size:.76em;padding:1px 5px 1px 6px}
a.rtag.rl svg{width:.95em;height:.95em;vertical-align:-.12em;margin-left:2px;stroke-width:2.6}
.rgo-w{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:center;margin-left:8px}
.rgo{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-size:calc(13px*var(--ts));font-weight:700;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.rgo svg{width:17px;height:17px;stroke-width:2.4;flex:none}
.rgo:active{filter:brightness(.92)}
.ls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.ls-row .fl{margin:0}
.ls-hint{font-size:calc(13px*var(--ts));color:var(--muted);margin:6px 2px 0;line-height:1.35}

/* Photos */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.thumb{appearance:none;padding:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;overflow:hidden;height:calc(88px*var(--sp));min-width:calc(88px*var(--sp));max-width:176px;display:block;position:relative}
.thumb img{display:block;height:100%;width:auto;min-width:100%;max-width:176px;object-fit:cover}
.ed-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ed-thumbs:empty{display:none}
.ed-thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.ed-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ed-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding:0}
.ed-x svg{width:14px;height:14px;stroke-width:2.6}
.missing img{display:none}
.missing::after{content:"Photo missing";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(11px*var(--ts));color:var(--muted);text-align:center}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.985);opacity:0;transition:opacity .18s}
.lb[hidden]{display:none}
.lb.show{opacity:1}
.lb-stage{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 60px) 8px calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lb-img{flex:none;max-width:none;max-height:none;transform-origin:50% 50%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;visibility:hidden}
.lb-img.ready{visibility:visible}
.lb-note{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:rgba(0,0,0,.72);color:#fff;font:600 14px -apple-system,system-ui,sans-serif;line-height:1.4;padding:8px 14px;border-radius:12px;text-align:center;pointer-events:none;z-index:3}
.lb-btn{position:absolute;appearance:none;border:0;width:44px;height:44px;border-radius:999px;background:rgba(18,22,28,.74);box-shadow:0 0 0 1px rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb-btn svg{width:22px;height:22px;stroke-width:2.4}
.lb-btn[hidden]{display:none}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 8px);right:10px}
.lb-prev,.lb-next{top:50%;margin-top:-22px}
.lb-prev{left:8px}
.lb-next{right:8px}
.lb-count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:60px;right:60px;text-align:center;color:#fff;font-size:15px;font-weight:600;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lb-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

@media (max-width:380px){
  main{padding-left:8px;padding-right:8px}
  .module{margin:8px}
  .mod-body{padding:0 8px 8px}
  .list-title{font-size:calc(30px*var(--ts))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
/* Briefing: the LIDO package with NOTAMs, weather and SIGMETs */
.nt-pkg{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 13px;margin:0 0 10px}
.nt-pkg-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wxnone.old{color:var(--warn)}
.wxnone .lnkbtn{font-weight:700;text-decoration:none}
.brwx{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:calc(13px*var(--ts));color:var(--muted)}
.brwx > span{flex:1;min-width:0;display:inline-flex;align-items:center;gap:6px}
.brwx > span svg{width:14px;height:14px}
.brwx em{font-style:normal;color:var(--warn)}
.brwx .lnkbtn{display:inline-flex;align-items:center;gap:4px;font-weight:700;text-decoration:none;font-size:calc(13.5px*var(--ts))}
.brwx .lnkbtn svg{width:15px;height:15px}
.brwx.old > span{color:var(--warn)}
.rw-row{appearance:none;width:100%;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:9px 12px;margin:0 0 10px;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.rw-row > svg{width:19px;height:19px;color:var(--muted);flex:none}
.rw-row > svg:last-child{width:15px;height:15px}
.rw-l{flex:1;min-width:0;font-size:calc(14.5px*var(--ts));font-weight:650}
.rw-l small{display:block;font-size:calc(12.5px*var(--ts));font-weight:600;color:var(--muted)}
.rw-row b{font:750 calc(19px*var(--ts)) ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.rw-c{color:var(--accent);font-weight:700;font-size:calc(14px*var(--ts))}
.rw-row.ch{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--paper))}
.rw-row.ch .rw-l small{color:var(--warn)}
.rw-row.ch > svg:first-child{color:var(--warn)}
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin:0 0 12px}
.rw-grid button{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--text);border-radius:12px;padding:11px 4px 9px;font:750 calc(18px*var(--ts)) ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.rw-grid button small{font:700 calc(10.5px*var(--ts)) -apple-system,system-ui,sans-serif;letter-spacing:.06em;color:var(--muted)}
.rw-grid button.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.rw-back{width:100%;margin:0 0 4px}
.nt-pkg-t b{flex:1 1 auto;font-size:calc(16px*var(--ts));font-weight:700}
.nt-pkg-t span{font-size:calc(13px*var(--ts));color:var(--muted);font-weight:600}
.nt-pkg small{display:block;margin-top:3px;font-size:calc(13px*var(--ts));color:var(--muted)}
.nt-pkg .lnkbtn{font-size:inherit}
.nt-other{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line-soft);font-size:calc(13.5px*var(--ts));color:var(--warn);font-weight:600}
.nt-tabs{display:flex;width:100%;margin:12px 0 4px}
.nt-tabs button{flex:1;min-width:0;padding:9px 2px!important;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden}
.nt-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--warn);color:var(--paper);font-size:11.5px;font-weight:800;font-style:normal;flex:none}
@media (max-width:400px){.nt-tabs button{font-size:calc(13.5px*var(--ts))!important;gap:3px}.nt-tabs .nt-badge{min-width:17px;height:17px;padding:0 4px;font-size:10.5px}}
.nt-sec{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin:16px 3px 7px}
.nt-sec b{font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* Flight strip under the clock: departure to arrival, a plane at the time now, your rest in purple */
:root{--rest:#7c5cd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rest:#a58cf0}}
:root[data-theme="dark"]{--rest:#a58cf0}:root[data-theme="night"]{--rest:#6c5fa0}:root[data-theme="red"]{--rest:#a3402f}
.fstrip{grid-column:1/-1;justify-self:center;width:100%;max-width:560px;position:relative;padding:25px 8px 1px;font-variant-numeric:tabular-nums;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;outline:none}
.fstrip[hidden]{display:none}
.fs-bar{position:relative;height:8px;border-radius:4px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.fs-dn{position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;background:var(--accent)}
.fs-rs{position:absolute;top:-3px;bottom:-3px;border-radius:5px;background:color-mix(in srgb,var(--rest) 30%,transparent);border:1.5px solid var(--rest)}
.fs-rs.past{opacity:.4}
.fs-pl{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:none}
.fs-pl svg{display:block;width:28px;height:28px;transform:rotate(90deg);fill:var(--accent);stroke:var(--bg);stroke-width:1.6;paint-order:stroke}
.fs-tag{position:absolute;top:1px;left:0;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:750;line-height:16px;white-space:nowrap}
.fs-tag svg{width:12px;height:12px;flex:none}
.fs-fl{color:var(--accent)}.fs-rt{color:var(--rest)}
.fs-lab{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;font-weight:650;color:var(--muted);white-space:nowrap}
.fs-lab b{color:var(--text);font-weight:750}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app a{-webkit-touch-callout:default}
#app input,#app textarea,#app select,#app [contenteditable],#app .ie-in,#app .item.ie > .row{-webkit-user-select:text;user-select:text}
.lp-wrap,.lp-wrap *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* ---------- Edit mode: the outline ---------- */
.sec.ol .sec-toggle{gap:8px;padding-left:10px}
.sec.ol .sec-toggle .chev{order:-1;width:22px;display:inline-grid;place-items:center;color:var(--muted)}
.sec.ol .sec-title{font-size:calc(18px*var(--ts));font-weight:750}
.sec.ol .sec-count{font-size:calc(14px*var(--ts))}
.item.ol > .row{min-height:calc(44px*var(--sp));padding-top:calc(9px*var(--sp));padding-bottom:calc(9px*var(--sp));align-items:center}
.item.ol .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(16px*var(--ts));font-weight:500}
.item.ol > .row .box{width:20px;height:20px;margin:0}
.ol-mk{flex:none;width:20px;height:20px;display:grid;place-items:center;color:var(--accent)}
.ol-mk svg{width:19px;height:19px}
.ol-mk.ol-i{color:var(--muted)}
.ol-nt{color:var(--muted)}
.ol-tags{display:flex;gap:4px;flex:none}
.ol-tags span{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:6px;padding:2px 5px}
.ol-tags svg{width:13px;height:13px;stroke-width:2.3}
.hd.ol .hd-row{padding:calc(9px*var(--sp)) 10px calc(9px*var(--sp)) 16px;color:var(--muted);cursor:pointer}
.hd.ol .hd-title{font-size:calc(12.5px*var(--ts));font-weight:750}
.module.ol .mod-toggle{font-size:calc(16px*var(--ts));padding-top:calc(10px*var(--sp));padding-bottom:calc(10px*var(--sp))}
.module.ol .mod-toggle > svg{width:20px;height:20px}
.ol-ans{appearance:none;border:0;border-top:1px solid var(--line-soft);background:none;width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px 8px calc(50px*var(--sp));font:inherit;font-size:calc(14.5px*var(--ts));color:var(--text);text-align:left}
.ol-ans b{font-size:12px;font-weight:800;padding:1px 7px;border-radius:5px;color:#fff;background:var(--accent)}
.ol-ans b.y{background:var(--done)}.ol-ans b.n{background:var(--danger)}
.ol-ans span{flex:1;color:var(--muted)}
.ol-ans svg{width:15px;height:15px;color:var(--box)}
.item.ol.cur > .row,.hd.ol.cur .hd-row,.module.ol.cur .mod-head{background:var(--accent-weak);box-shadow:inset 4px 0 0 var(--accent)}
.sec.ol .add-row button{flex:1 1 100%}
/* ---------- The item as a page ---------- */
.sheet-wrap.page{background:var(--surface2);padding:0!important;align-items:stretch}
.sheet-wrap.page .sheet{max-width:none;border:0;border-radius:0;box-shadow:none;background:var(--surface2);padding:0 16px calc(env(safe-area-inset-bottom,0px) + 40px);transform:none;min-height:100%}
.sheet-wrap.page .sheet > :not(.pg-h){max-width:640px;margin-left:auto;margin-right:auto}
.pg-h{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;margin:0 -16px 16px;padding:env(safe-area-inset-top,0px) 4px 0;min-height:calc(52px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--surface2) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.iphone .sheet-wrap.page .pg-h{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
.pg-h b{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-h button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:17px;padding:12px;min-width:84px;text-align:left}
.pg-h .pg-d{font-weight:700;text-align:right}
.pg-h > span{min-width:84px}
.pg-grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pg-tn{margin-bottom:16px}
.pg-tn label{display:block}
.pg-tn label + label{border-top:1px solid var(--line-soft)}
.sheet .pg-tn input[type=text],.sheet .pg-tn textarea{border:0;border-radius:0;background:none;padding:13px 14px}
.sheet .pg-tn input[type=text]{font-size:max(16px,calc(19px*var(--ts)));font-weight:600}
.sheet-wrap.page .fld > .fl{margin-left:4px;text-transform:uppercase;font-size:calc(12.5px*var(--ts));letter-spacing:.05em}
.pg-list > button,.pg-list > .pg-add,.pg-ph > .pg-add{appearance:none;display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line-soft);background:none;color:var(--text);font:inherit;font-size:calc(16px*var(--ts));padding:12px 14px;text-align:left;cursor:pointer;margin:0}
.pg-list > :first-child{border-top:0}
.pg-add{color:var(--accent)!important;font-weight:600}
.pg-add svg,.pg-list > button svg{width:19px;height:19px;flex:none}
.pg-kid .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-kid em{font-style:normal;color:var(--muted);font-size:13px;font-weight:700}
.pg-kid > svg:last-child{color:var(--box);width:16px!important;height:16px!important}
.pg-kid .box{width:21px;height:21px;margin:0}
.pg-kid .box.on{background:var(--done);border-color:var(--done)}
.pg-kid .box.on svg{opacity:1;transform:none}
#fLinks:empty{display:none}
#fLinks:empty + .pg-add{border-top:0}
#fLinks .link-row{border:0;border-radius:0;border-bottom:1px solid var(--line-soft);margin:0;padding:10px 12px}
.pg-ph{padding-top:10px}
.pg-ph .ed-thumbs{padding:0 12px}
.pg-ph .ed-thumbs:empty + input + .pg-add,.pg-ph .ed-thumbs:empty ~ .pg-add{border-top:0}
.pg-ph:has(.ed-thumbs:empty){padding-top:0}
.pg-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.pg-two .btn{background:var(--surface);color:var(--accent)}
.pg-two .btn:disabled{color:var(--muted);opacity:.6}
.pg-acts{margin-bottom:10px}
.pg-acts > button{color:var(--accent)!important;font-weight:600}
.pg-acts > button.dg{color:var(--danger)!important}
/* ---------- iPad in full screen: the outline on the left, the page on the right ---------- */
html.split{--olw:440px}
html.split main{max-width:none;margin:0;width:var(--olw);padding-left:12px;padding-right:12px}
.split-hint{display:none;position:fixed;left:var(--olw);right:0;top:calc(env(safe-area-inset-top,0px) + var(--tbh,64px));bottom:0;z-index:5;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);font-size:calc(16px*var(--ts));background:var(--surface2);border-left:1px solid var(--line)}
html.split .split-hint{display:flex}
html.split.pg-open .split-hint{display:none}
.sheet-wrap.page.dock{left:var(--olw);top:calc(env(safe-area-inset-top,0px) + var(--tbh,64px));z-index:46;border-left:1px solid var(--line);transition:none}
.sheet-wrap.dock .pg-h{padding-top:0!important;min-height:52px}

/* new since the last copy: green, in every theme */
:root{--nw:#1b8a4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nw:#4cc98a}}
:root[data-theme="dark"]{--nw:#4cc98a}
:root[data-theme="night"]{--nw:#3d8f66}
:root[data-theme="red"]{--nw:var(--accent)}
/* the Wind and Trend buttons on a weather card */
.wxtg{display:inline-flex;gap:5px;flex:none}
.wxtgb{appearance:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;height:28px;padding:0 9px;font:inherit;font-size:calc(12.5px*var(--ts));font-weight:700;cursor:pointer}
.wxtgb svg{width:15px;height:15px}
.wxtgb.on{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent)}
@media (max-width:640px){.wxtgb{padding:0 7px}.wxtgb span{display:none}}
.wxtg-f{display:flex;justify-content:flex-end;margin-top:8px}
.nt-ap span.wxtg{flex:none;overflow:visible;margin-left:4px}
.nt-ap .wxtgb span{flex:none;overflow:visible;font-size:inherit;color:inherit;white-space:nowrap}
.wxext{container-type:inline-size;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}

.wxext-out:empty{display:none}
.wxext-out > .wxext{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 12px}
/* wind on the runway */
.wxw{display:flex;gap:14px;align-items:flex-start}
.wxw-cmp{width:96px;height:96px;flex:none}
.wxw-cmp .c0{fill:none;stroke:var(--line);stroke-width:1.5}
.wxw-cmp .t0{fill:var(--muted);stroke:none;font:700 8px -apple-system,system-ui,sans-serif}
.wxw-cmp .r0{fill:var(--surface2);stroke:var(--muted);stroke-width:1.2}
.wxw-cmp .r1{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.wxw-cmp .t1{fill:var(--text);stroke:none;font:800 9.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.wxw-cmp .w0{fill:none;stroke:var(--accent);stroke-width:3.2}
.wxw-cmp .w1{fill:var(--accent);stroke:none}
.wxw-c{flex:1;min-width:0}
.wxw-c > .wxl:first-child,.wxw-o > .wxl:first-child,.wxw > .wxl:first-child,.wxtr > .wxl:first-child{margin-top:0}
.wxw-big{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 2px}

.wxw-big .x b,.wxw-t .x{color:var(--warn)}
.wxw-p,.wxw-t{margin:5px 0 0;font-size:calc(13.5px*var(--ts));line-height:1.4;color:var(--muted)}
.wxw-t b{color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.wxw-p.mut{font-size:calc(12.5px*var(--ts))}
.wxw-o{flex:0 0 235px;border-left:1px solid var(--line-soft);padding-left:14px}
.wxw-rw{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.wxw-rw span{font:650 calc(12.5px*var(--ts)) ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 8px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.wxw-rw span b{font-weight:800}

@container (max-width:640px){

.rwchip{display:inline-flex;gap:4px;font:650 calc(12.5px*var(--ts)) ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);flex:none}

/* the trend */
.wxtr-n{font-weight:600;letter-spacing:0;margin-left:6px}

.wxtr-g{display:none;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:end;margin-top:4px;font-size:calc(12px*var(--ts));color:var(--muted);font-weight:650}
.wxtr-b{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:16px}
.wxtr-b i{flex:1;border-radius:4px 4px 1px 1px;background:color-mix(in srgb,var(--accent) 80%,transparent);position:relative}

.wxtr-b i em{position:absolute;bottom:100%;left:-4px;right:-4px;margin-bottom:2px;text-align:center;font:700 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);font-style:normal;white-space:nowrap}
.wxtr-b i.w em{color:var(--warn)}
.wxtr-a{display:flex;gap:5px;font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace}

<script>/* LIDO package readers: NOTAM bulletin, OFP, weather and crew alerts (plain ES5) */
/* LIDO NOTAM bulletin reader: splits the bulletin into NOTAMs, checks each against the flight and ranks it.
   Plain ES5 so it can drop into the app as it is. */
(function(root){
var MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
var WD={SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};
function t10(s){ // YYMMDDhhmm -> UTC ms
  var m=/^(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)$/.exec(s);if(!m) return null;
  return Date.UTC(2000+ +m[1],+m[2]-1,+m[3],+m[4],+m[5]);
}
function cleanLines(text){
  var L=String(text).replace(/\r/g,'').split('\n'),out=[];
  for(var i=0;i<L.length;i++){
    var l=L[i].replace(/\s+$/,'');
    if(/^\s*Page \d+ of \d+\s*$/.test(l)) continue;
    if(/^\s*\S+\/\d{1,2}[A-Za-z]{3}\d{2}\/[A-Z]{3}-[A-Z]{3}\s+\S+\s+OFP:/.test(l)) continue; // running page header
    out.push(l);
  }
  return out;
}
var SECTIONS=[['DEPARTURE AIRPORT','dep'],['DESTINATION AIRPORT','dest'],['DESTINATION ALTERNATE','altn'],['ENROUTE ALTERNATE','enalt'],['ENROUTE AIRPORT','enroute'],
  ['EXTENDED AREA AROUND DEPARTURE','area'],['AREA ENROUTE DEPARTURE','area'],['EXTENDED AREA AROUND DESTINATION ALTERNATE','area'],['EXTENDED AREA AROUND DESTINATION','area'],['AREA ENROUTE DESTINATION','area'],
  ['TAKEOFF ALTERNATE','toalt'],['CREW BULLETIN','end']];
var NOTAM_RE=/^\s*((?:\d[A-Z]|[A-Z]{2})\d{1,5}\/\d{2})(?:\s+-\s+CHART NOTAM)?\s+VALID:\s*(\d{10})\s*-\s*(\d{10}|UFN|PERM)(\s+EST)?\s*$/;
function parse(text,hint){
  hint=hint||{};
  var L=cleanLines(text),res={flight:{},groups:[],count:0};
  var all=L.join('\n');
  // flight details from the OFP and the bulletin heading
  var m=/^([A-Z]{2,3}\d{1,4})\s+(\d{2}[A-Z]{3})\s+([A-Z]{4})\/[A-Z]{3}-([A-Z]{4})\/[A-Z]{3}\s+(\S+)/m.exec(all);
  if(m){res.flight.fno=m[1];res.flight.date=m[2];res.flight.dep=m[3];res.flight.dest=m[4];res.flight.type=m[5];}
  m=/MFT\/R\s*:\s*([A-Z]{4})\/(\d{2}[LRC]?)[\s\S]*?([A-Z]{4})\/(\d{2}[LRC]?)\s*$/m.exec(all);
  if(m){res.flight.depRwy=m[2];res.flight.arrRwy=m[4];}
  m=/VALID:\s*(\d{10})\s*-\s*(\d{10})\s+ETD/.exec(all);
  if(m){res.flight.from=t10(m[1]);res.flight.to=t10(m[2]);}
  m=/^\s*ROUTE:\s*([A-Z]{4})\s*-\s*([A-Z]{4})\s+ALTN:\s*([A-Z ]+)$/m.exec(all);
  if(m){res.flight.dep=res.flight.dep||m[1];res.flight.dest=res.flight.dest||m[2];res.flight.altns=m[3].trim().split(/\s+/);}
  m=/^\s*ARR\s+(\d{4})\b/m.exec(all)||/\bARR\s+(\d{4})\b/.exec(all);
  if(m&&res.flight.from){var a=new Date(res.flight.from),eta=Date.UTC(a.getUTCFullYear(),a.getUTCMonth(),a.getUTCDate(),+m[1].slice(0,2),+m[1].slice(2));if(eta<res.flight.from) eta+=86400000;res.flight.eta=eta;res.flight.etd=res.flight.from;}
  // the bulletin itself
  var start=-1;for(var i=0;i<L.length;i++){if(/LIDO-NOTAM-BULLETIN/.test(L[i])){start=i;break;}}
  var loose=start<0;if(loose) start=0; // pasted NOTAMs without the bulletin heading
  res.full=!loose;
  function guess(c){return c===hint.dep?'dep':c===hint.dest?'dest':(hint.alts||[]).indexOf(c)>=0?'altn':'enroute';}
  var sec=null,grp=null,cat='',cur=null;
  function flush(){if(cur){cur.text=cur.lines.join('\n').trim();grp.notams.push(cur);res.count++;cur=null;}}
  function nx(j){j++;while(j<L.length&&!L[j].trim()) j++;return j;} // next line with text (page breaks leave gaps)
  for(i=start;i<L.length;i++){
    var l=L[i],t=l.trim(),j1=nx(i);
    if(/^=+$/.test(t)) continue;
    var s=null;
    if(/^[A-Z][A-Z ()\-\/]+$/.test(t)&&L[j1]!==undefined&&/^=+$/.test(L[j1].trim())){
      for(var k=0;k<SECTIONS.length;k++){if(t.indexOf(SECTIONS[k][0])===0){s=SECTIONS[k];break;}}
      if(s){flush();sec={title:t,kind:s[1]};if(s[1]==='end') break;continue;}
    }
    if(t&&L[j1]!==undefined&&/^-{5,}$/.test(L[j1].trim())&&!NOTAM_RE.test(l)){
      var ap=/^([A-Z]{4})\s+\/([A-Z]{3})?\s+(.+?)(?:\s+-\s+DETAILED INFO)?$/.exec(t),ar=/^([A-Z0-9]{2,5})\s+(.+)$/.exec(t);
      if(sec||(loose&&ap)){
        flush();
        var sk=sec?sec.kind:guess(ap[1]),stt=sec?sec.title:'';
        grp=ap?{section:sk,sectionTitle:stt,code:ap[1],iata:ap[2]||'',name:ap[3],ad:true,notams:[]}:
          {section:sk,sectionTitle:stt,code:ar?ar[1]:t,iata:'',name:ar?ar[2]:t,ad:false,notams:[]};
        res.groups.push(grp);cat='';i=j1;continue;
      }
    }
    var c=/^\++\s*([A-Z][A-Z \/&-]*?)\s*\++$/.exec(t);
    if(c){flush();cat=c[1];continue;}
    var n=NOTAM_RE.exec(l);
    if(n&&!grp&&loose){grp={section:'enroute',sectionTitle:'',code:'NOTAMS',iata:'',name:'Pasted NOTAMs',ad:false,notams:[]};res.groups.push(grp);}
    if(n&&grp){flush();cur={id:n[1],cat:cat||'',from:t10(n[2]),to:n[3]==='UFN'||n[3]==='PERM'?null:t10(n[3]),toTxt:n[3],est:!!n[4],chart:/CHART NOTAM/.test(l),lines:[]};continue;}
    if(cur){if(t||cur.lines.length) cur.lines.push(t);}
  }
  flush();
  res.groups.forEach(function(g){g.notams.forEach(function(n){splitSched(n);});});
  return res;
}
// schedule lines come straight after VALID: "DAILY 1100-1900", "0600-1400", "OCT 16 17 23 0300-1500", "OCT 24 0601-0626, OCT 25 ..."
var SCH_TOK=/^(?:(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC|MON|TUE|WED|THU|FRI|SAT|SUN|DAILY|H24|EXC|AND|TIL|\d{1,2}|\d{4}-\d{4}|,|-)\s*)+$/;
function splitSched(n){
  var s=[];
  while(n.lines.length&&SCH_TOK.test(n.lines[0].replace(/,/g,' , ').replace(/\s+/g,' ').trim())&&/\d{4}-\d{4}|H24|DAILY/.test(n.lines.slice(0,3).join(' '))){
    s.push(n.lines.shift());
    if(/\d{4}-\d{4}\s*$/.test(s[s.length-1])&&!(n.lines[0]&&/^\d{4}-\d{4}/.test(n.lines[0]))) break;
  }
  n.sched=s.join(' ');
  n.body=n.lines.join('\n').trim();
  delete n.lines;
}
// intervals (UTC ms) when a scheduled NOTAM is in force, within [a,b]; null when we can't tell
function schedIntervals(n,a,b){
  if(!n.sched) return [[n.from,n.to===null?Infinity:n.to]];
  var toks=n.sched.replace(/,/g,' ').split(/\s+/).filter(Boolean),out=[],mon=null,days=[],wds=[],daily=false,ok=true;
  var y=new Date(n.from).getUTCFullYear(),m0=new Date(n.from).getUTCMonth();
  function emit(s,e){
    var dates=[];
    if(days.length) dates=days.slice();
    else{for(var d=a-86400000;d<=b+86400000;d+=86400000){var dd=new Date(d);if(!wds.length||wds.indexOf(dd.getUTCDay())>=0) dates.push([dd.getUTCFullYear(),dd.getUTCMonth(),dd.getUTCDate()]);}}
    dates.forEach(function(x){var st=Date.UTC(x[0],x[1],x[2],+s.slice(0,2),+s.slice(2)),en=Date.UTC(x[0],x[1],x[2],+e.slice(0,2),+e.slice(2));if(en<=st) en+=86400000;out.push([Math.max(st,n.from),n.to===null?en:Math.min(en,n.to)]);});
  }
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    if(MON[t]!==undefined){mon=MON[t];continue;}
    if(WD[t]!==undefined){wds.push(WD[t]);continue;}
    if(t==='DAILY'){daily=true;continue;}

  midBusy=true;
  var ids=Array.from(allImgIds());

    imgGet(ids[i]).then(function(v){return v&&!v.m&&v.f?imgMid(ids[i],v):null;}).catch(function(){}).then(function(){setTimeout(function(){next(i+1);},400);});
  })(0);
}

function cur(){for(var i=0;i<state.lists.length;i++){if(state.lists[i].id===state.current) return state.lists[i];}return state.lists[0];}
function walk(arr,anc,id){
  for(var i=0;i<arr.length;i++){
    var n=arr[i];
    if(n.id===id) return {node:n,arr:arr,idx:i,anc:anc};
    if(n.children&&n.children.length){var r=walk(n.children,anc.concat([n]),id);if(r) return r;}
    if(n.dq) for(var k=0;k<n.dq.length;k++){var rd=walk(n.dq[k].items,anc.concat([n]),id);if(rd){if(!rd.opt) rd.opt=n.dq[k];return rd;}}
  }
  return null;
}
function find(id){
  for(var a=0;a<state.lists.length;a++){var L=state.lists[a];
    for(var b=0;b<L.sections.length;b++){var r=walk(L.sections[b].items,[],id);if(r){r.section=L.sections[b];r.list=L;return r;}}}
  var T=state.tools;
  if(T) for(var k=0;k<T.cds.length;k++){if(T.cds[k].id===id) return {node:T.cds[k],arr:T.cds,idx:k,anc:[],tool:true};}
  if(T&&T.rest.id===id) return {node:T.rest,arr:[T.rest],idx:0,anc:[],tool:true};
  var AN=state.apNotes;
  if(AN) for(var ic in AN){for(var sid in AN[ic]){var rr=walk(AN[ic][sid],[],id);if(rr){rr.apn={icao:ic,sec:sid};return rr;}}}
  return null;
}
function findSec(id){
  for(var a=0;a<state.lists.length;a++){var L=state.lists[a];
    for(var b=0;b<L.sections.length;b++){if(L.sections[b].id===id) return {section:L.sections[b],idx:b,list:L};}}
  return null;
}
function removeNode(f){var i=f.arr.indexOf(f.node);if(i>=0) f.arr.splice(i,1);}
function tallyTask(it,c){
  if(isTask(it)){c.t++;if(it.done) c.d++;return;}
  if(it.type==='check'&&it.dq){
    var ch=null;it.dq.forEach(function(x){if(x.id===it.ans) ch=x;});
    if(!ch){c.t++;return;}
    ch.items.forEach(function(k){tallyTask(k,c);});
  }
}
function secCount(s){var c={d:0,t:0};s.items.forEach(function(it){tallyTask(it,c);});return c;}
function listCount(L){var d=0,t=0;L.sections.forEach(function(s){var c=secCount(s);d+=c.d;t+=c.t;});return {d:d,t:t};}
function untickItems(arr,clr){arr.forEach(function(n){
  if(n.type==='check'){n.done=false;if(clr&&n.fld) n.fld.val='';untickItems(n.children,clr);if(n.dq){n.ans='';n.dq.forEach(function(x){untickItems(x.items,clr);});}}
  else if(clr&&n.type==='hot'){n.fluid='';n.t0=0;n.hm='';n.min='';n.max='';n.aMin=n.aMax=false;alerting.delete(n.id);}
});}
// anything filled in: a field's answer or a holdover time
function hasAnswers(arr){return arr.some(function(n){
  if(n.type==='hot') return !!(n.t0||n.min||n.max||n.fluid);
  return n.type==='check'&&(!!(n.fld&&n.fld.val)||hasAnswers(n.children||[])||!!(n.dq&&n.dq.some(function(x){return hasAnswers(x.items);})));
});}
function isTask(it){return it.type==='check'&&!it.info&&!it.dq&&!it.end;}
function newFlight(){
  // every checklist starts clean: ticks, answers, calculators and notepads
  state.lists.forEach(function(L){L.sections.forEach(function(s){
    untickItems(s.items,true);
    s.items.forEach(function(n){
      if(n.type==='calc'){n.expr='';n.hist=[];fresh.delete(n.id);}
      if(n.type==='pad'){n.strokes=[];n.text='';}
      if(n.type==='hot'){n.fluid='';n.t0=0;n.hm='';n.min='';n.max='';n.aMin=n.aMax=false;alerting.delete(n.id);}
    });
  });});
  var T=state.tools;
  T.cds.forEach(function(c){c.target=null;c.aL=c.aZ=false;alerting.delete(c.id);});
  T.rest.start='';T.rest.end='';T.rest.mine=-1;restEditing.clear();cdOpen.clear();
  state.evFrom=Date.now();
  state.settings.etdT=0;state.settings.etaT=0;state.settings.csign='';
  state.settings.dep=null;state.settings.dest=null;state.settings.alts=[];locEl.removeAttribute('data-k'); // the route goes too: pick it again from Recent
  Object.keys(state.apNotes).forEach(function(ic){var a=state.apNotes[ic];Object.keys(a).forEach(function(k){untickItems(a[k]);});});
}
function cloneList(L){
  var c=JSON.parse(JSON.stringify(L));c.id=uid();
  function re(n){n.id=uid();(n.children||[]).forEach(re);if(n.fld) n.fld.val='';if(n.dq){n.ans='';n.dq.forEach(function(x){x.id=uid();x.items.forEach(re);});}}
  c.sections.forEach(function(s){s.id=uid();s.items.forEach(re);});
  return c;
}

/* ---------- Links ---------- */
function safeUrl(u){
  u=String(u||'').trim();
  if(/^(javascript|data|vbscript):/i.test(u)) return '#';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u='https://'+u;
  return u;
}
function linkHTML(l){
  var label=l.label||l.url.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'');
  return '<a class="lnk" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener"><span>'+esc(label)+'</span>'+I.ext+'</a>';
}
function linkName(l){return l.label||l.url.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'');}
// Tag style: a [FCOM] tag whose text matches a link's name opens that link; links with no matching tag are added as tags at the end
function lnKey(s){return String(s||'').replace(/^\s*\[/,'').replace(/\]\s*$/,'').trim().toLowerCase();}
function tagA(l,inner){return '<a class="rtag rl" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener" aria-label="Open '+esc(linkName(l))+'">'+inner+I.ext+'</a>';}
// every tag whose text is a link's name becomes that link
function tagOnly(h,links,used){
  if(!links||!links.length) return h;
  return h.replace(/<span class="rtag">([^<]*)<\/span>/g,function(m,x){
    var k=lnKey(x);
    for(var i=0;i<links.length;i++){if(k&&lnKey(esc(linkName(links[i])))===k){if(used) used[i]=1;return tagA(links[i],x);}}
    return m;
  });
}
function tagLinks(h,links,note,used0){
  var used=used0||{};
  h=tagOnly(h,links,used);
  // a link whose tag is in the note opens from there
  var nt=String(note||'').toLowerCase();
  links.forEach(function(l,i){var k=lnKey(linkName(l));if(k&&nt.indexOf('['+k+']')>=0) used[i]=1;});
  var extra=links.filter(function(l,i){return !used[i];}).map(function(l){return tagA(l,esc(linkName(l)));}).join(' ');
  return h+(extra?(h?' ':'')+extra:'');
}
// Icon style: a round ↗ at the right of the row (with the name when there is more than one link)
function iconLinksHTML(links){
  return '<span class="rgo-w">'+links.map(function(l){
    return '<a class="rgo" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener" aria-label="Open '+esc(linkName(l))+'">'+(links.length>1?'<span>'+esc(linkName(l))+'</span>':'')+I.ext+'</a>';
  }).join('')+'</span>';
}
// anything in square brackets in a check, like [FCOM] or [QRH 2.3], shows as a small tag
function refTags(h){return h.replace(/\[([^\[\]<>\n]{1,30})\]/g,function(m,x){x=x.trim();return x?'<span class="rtag">'+x+'</span>':m;});}
function linkify(escaped){
  return escaped.replace(/\b([a-z][a-z0-9+.-]{1,24}:\/\/[^\s<]+)/gi,function(m){
    if(/^(javascript|data|vbscript):/i.test(m)) return m;
    var t=m.match(/[.,;:!?)\]]+$/),tail=t?t[0]:'',u=tail?m.slice(0,-tail.length):m;
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'+tail;
  });
}

/* ---------- Calculator maths ---------- */
// CALC-START
var OPS='+−×÷';
function fmtNumStr(s){
  s=String(s);var neg=false;
  if(s[0]==='−'||s[0]==='-'){neg=true;s=s.slice(1);}
  var dot=s.indexOf('.'),i=dot<0?s:s.slice(0,dot),d=dot<0?'':s.slice(dot);
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'−':'')+i+d;
}
function fmtExpr(e){
  var out='',num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(num){out+=fmtNumStr(num);num='';}
    var prev=e[j-1],binary=prev!==undefined&&/[\d.]/.test(prev);
    out+=(ch==='−'&&!binary)?'−':' '+ch+' ';
  }
  if(num) out+=fmtNumStr(num);
  return out.replace(/\s+/g,' ').trim();
}
function hasOp(e){return /[+×÷]/.test(e)||/[\d.]−/.test(e);}
function calcEval(e){
  var t=[],num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(OPS.indexOf(ch)>=0){
      if(num===''){if(ch==='−'){num='-';continue;}return null;}
      if(num==='-') return null;
      t.push(parseFloat(num));num='';t.push(ch);
    }
  }
  if(num!==''&&num!=='-') t.push(parseFloat(num));
  while(t.length&&typeof t[t.length-1]==='string') t.pop();
  if(!t.length) return null;
  for(var k=0;k<t.length;k++){if(typeof t[k]==='number'&&isNaN(t[k])) return null;}
  var a=[t[0]];
  for(var i=1;i<t.length;i+=2){
    var op=t[i],n=t[i+1];
    if(op==='×') a[a.length-1]*=n;
    else if(op==='÷') a[a.length-1]/=n;
    else a.push(op,n);
  }
  var r=a[0];
  for(var q=1;q<a.length;q+=2) r=a[q]==='+'?r+a[q+1]:r-a[q+1];
  if(!isFinite(r)) return 'err';
  r=parseFloat(r.toPrecision(12));
  var s=String(r);
  if(/e/i.test(s)) return 'err';
  return s.replace('-','−');
}
// CALC-END

/* ---------- Rendering ---------- */
function countHTML(d,t){if(!t) return '';return d===t?I.check+'<span>Done</span>':d+'/'+t;}
function headGroups(s){
  // progress of the items under each heading, up to the next heading
  var m={},cur=null;
  s.items.forEach(function(it){
    if(it.type==='head'){cur=m[it.id]={d:0,t:0,n:0};return;}
    if(!cur) return;
    cur.n++;
    tallyTask(it,cur);
  });
  return m;
}
function renderHead(hd,c){
  c=c||{d:0,t:0,n:0};
  var chev=c.n?'<span class="chev">'+I.chev+'</span>':'<span class="chev-sp"></span>';
  var cnt='<span class="hd-count">'+countHTML(c.d,c.t)+'</span>';
  var title='<span class="hd-title">'+(esc(hd.title)||'<span class="ph">Heading</span>')+'</span>';
  var cls='hd'+(hd.collapsed&&c.n?' collapsed':'')+(c.t&&c.d===c.t?' complete':'');
  if(editMode) return '<div class="'+cls+'" data-mod="'+hd.id+'"><div class="hd-row" data-act="editMod" data-id="'+hd.id+'" role="button" tabindex="0">'+
    (c.n?'<button type="button" class="hd-fold" data-act="headFold" data-id="'+hd.id+'" aria-label="Fold or unfold">'+chev+'</button>':chev)+
    title+cnt+'<span class="edit-hint">'+I.edit+'</span><span class="grip" data-drag="item" data-id="'+hd.id+'" aria-hidden="true">'+I.grip+'</span></div></div>';
  if(!c.n) return '<div class="'+cls+'" data-mod="'+hd.id+'"><div class="hd-row">'+title+cnt+'</div></div>';
  return '<div class="'+cls+'" data-mod="'+hd.id+'"><button type="button" class="hd-row" data-act="headFold" data-id="'+hd.id+'" aria-expanded="'+!hd.collapsed+'">'+title+cnt+chev+'</button></div>';
}
function renderItems(s){
  var g=headGroups(s),fold=false;
  return s.items.map(function(it){
    if(it.type==='head'){fold=!!it.collapsed&&g[it.id].n>0;return renderHead(it,g[it.id]);}
    var x=renderNode(it,0);
    return fold?x.replace('class="','class="hfold '):x;
  }).join('');
}
// ---------- Reference sections: each heading is a card, notes read as text, no boxes ----------
function rfInfoTree(it){return it.type==='check'&&it.info&&!it.dq&&!it.end&&!it.fld&&(it.children||[]).every(rfInfoTree);}
// a note: lines starting with •, -, – or * become a bulleted list
function rfNoteHTML(note,cls,top,links){
  // under a card item, bullets read as its items; after a line of text they stay in the note's grey
  var out='',ul=[];
  function flush(){if(ul.length){out+='<ul class="'+(top?'rf-ul rf-nl'+(out?' mu':''):'rf-sub')+'">'+ul.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';ul=[];}}
  String(note).split('\n').forEach(function(l){
    var m=/^\s*[•\-–*·]\s*(.*)$/.exec(l),t=tagOnly(refTags(linkify(esc(m?m[1]:l))),links);
    if(m){ul.push(t);return;}
    flush();if(l.trim()) out+='<div class="'+(cls||'rf-n')+'">'+t+'</div>';
  });
  flush();return out;
}
// a short name is a title (bold); a sentence or a lead-in ("...from the:") reads as text
function rfIsTitle(t){t=String(t||'').trim();return t.length<=48&&!/[.:;,]$/.test(t);}
// button-style links as small chips right after the text they belong to
function smLinks(it,ls){return ls==='button'&&it.links.length?' '+it.links.map(function(l){return linkHTML(l).replace('class="lnk"','class="lnk sm"');}).join(' '):'';}
// "Parking brake .... SET": two or more dots, or …, between a check and its response
var CR_RE=/^(.*?\S)\s*(?:\.{2,}|\u2026+)\s*(\S.*)$/;
// "Fuel   12.4 t": three or more spaces put the rest on the right, without dots. On an iPhone two quick spaces become ". ", so a full stop and two spaces count too
var RT_RE=/^(.*?\S)[ \u00a0\t]{3,}(\S.*)$/,RT_IOS=/^(.*?[^\s.])\.[ \u00a0\t]{2}(\S.*)$/;
function crSplit(t){t=String(t||'');var m=CR_RE.exec(t);if(m) return {c:m[1],r:m[2],rt:false};t=t.trim();m=RT_RE.exec(t)||RT_IOS.exec(t);return m?{c:m[1],r:m[2],rt:true}:null;}
function crWrap(c,r,rt){return '<span class="cr'+(rt?' rt':'')+'"><span class="cr-c">'+c+'</span><span class="cr-l" aria-hidden="true"></span><span class="cr-r">'+r+'</span></span>';}
function rfLabel(it){
  var ls=it.links.length&&(it.ls==='tag'||it.ls==='icon')?it.ls:'button',m=crSplit(it.text),lab;
  if(m){
    var c=refTags(esc(m.c)),r=refTags(esc(m.r));
    if(ls==='tag'){var used={};c=tagOnly(c,it.links,used);r=tagLinks(r,it.links,it.note,used);}
    lab=crWrap(c,r,m.rt);
  }else{
    lab=refTags(esc(it.text));
    if(ls==='tag') lab=tagLinks(lab,it.links,it.note);
  }
  return {ls:ls,lab:lab||'<span class="ph">Untitled item</span>'};
}
function rfExtras(it){
  var h='';
  if(it.rem) h+='<div class="remchip" data-remid="'+it.id+'">'+I.bell+'<span>'+esc(remText(it.rem,Date.now()))+'</span></div>';
  if(it.imgs&&it.imgs.length) h+=thumbsHTML(it);
  return h;
}
function rfKidHTML(k){
  var L=rfLabel(k),kids=k.children||[];
  var inner='<span class="rf-kl">'+L.lab+smLinks(k,L.ls)+'</span>'+(k.note?rfNoteHTML(k.note,'',false,L.ls==='tag'?k.links:null):'')+rfExtras(k)+(kids.length?'<ul class="rf-ul">'+kids.map(rfKidHTML).join('')+'</ul>':'');
  return '<li data-item="'+k.id+'">'+(L.ls==='icon'?'<div class="rf-ir"><div class="rf-tx">'+inner+'</div>'+iconLinksHTML(k.links)+'</div>':inner)+'</li>';
}
function rfItemHTML(it){
  if(!rfInfoTree(it)) return renderCheck(it,0); // anything you tick keeps its box
  var L=rfLabel(it),kids=it.children||[],big=!!(it.note||kids.length);
  var inner='<div class="rf-l">'+L.lab+smLinks(it,L.ls)+'</div>'+(it.note?rfNoteHTML(it.note,'',true,L.ls==='tag'?it.links:null):'')+rfExtras(it)+(kids.length?'<ul class="rf-ul">'+kids.map(rfKidHTML).join('')+'</ul>':'');
  return '<div class="rf-i'+(big?(rfIsTitle(it.text)?' t':' rf-ld'):'')+'" data-item="'+it.id+'">'+(L.ls==='icon'?'<div class="rf-ir"><div class="rf-tx">'+inner+'</div>'+iconLinksHTML(it.links)+'</div>':inner)+'</div>';
}
function renderRefItems(s){
  if(!s.items.some(function(x){return x.type==='head';})) return s.items.map(function(it){return it.type==='check'?rfItemHTML(it):renderNode(it,0);}).join('');
  var g=headGroups(s),cards=[],cur=null;
  s.items.forEach(function(it){
    if(it.type==='head'){cur={hd:it,parts:[]};cards.push(cur);return;}
    if(!cur){cur={hd:null,parts:[]};cards.push(cur);}
    cur.parts.push(it.type==='check'?rfItemHTML(it):renderNode(it,0));
  });
  return cards.map(function(c){
    if(!c.hd) return '<div class="rf-card nohead"><div class="rf-b">'+c.parts.join('')+'</div></div>';
    var hd=c.hd,n=(g[hd.id]||{n:0}).n,gc=g[hd.id]||{d:0,t:0},shut=!!hd.collapsed&&n>0;
    var cnt=gc.t?countHTML(gc.d,gc.t):n?String(n):'';
    var head='<b>'+(esc(hd.title)||'<span class="ph">Heading</span>')+'</b>'+(cnt?'<em>'+cnt+'</em>':'')+(n?'<span class="chev">'+I.chev+'</span>':'');
    return '<div class="rf-card'+(shut?' shut':'')+'" data-mod="'+hd.id+'">'+
      (n?'<button type="button" class="rf-h" data-act="headFold" data-id="'+hd.id+'" aria-expanded="'+!shut+'">'+head+'</button>':'<div class="rf-h">'+head+'</div>')+
      (shut||!n?'':'<div class="rf-b">'+c.parts.join('')+'</div>')+'</div>';
  }).join('');
}
function renderNode(it,depth){
  if(it.type==='head'){var hf=find(it.id);return renderHead(it,hf?headGroups(hf.section)[it.id]:null);}
  if(it.type==='calc') return renderCalc(it);
  if(it.type==='pad') return renderPad(it);
  if(it.type==='cd') return it.link?renderCdBlock(it):renderCd(it);
  if(it.type==='rest') return it.link?renderRest(state.tools.rest,it):renderRest(it);
  if(it.type==='apn') return renderApn(it);
  if(it.type==='flog') return renderFlog(it);
  if(it.type==='apst') return renderApst(it);
  if(it.type==='hot') return renderHot(it);
  if(it.type==='wx') return renderWx(it);
  if(it.type==='nt') return renderNtBlock(it);
  return renderCheck(it,depth);
}
function thumbsHTML(it){
  return it.imgs&&it.imgs.length?'<div class="thumbs">'+it.imgs.map(function(im,i){return '<button type="button" class="thumb" data-act="viewImg" data-id="'+it.id+'" data-n="'+i+'" aria-label="Enlarge photo '+(i+1)+'"><img data-img="'+esc(im)+'" alt=""></button>';}).join('')+'</div>':'';
}
// a note: as typed, or as a list when its lines start with a bullet
function noteHTML(note,top,links){return /^\s*[•\-–*·]\s/m.test(note)?'<div class="note nb">'+rfNoteHTML(note,'nl',top,links)+'</div>':'<div class="note">'+tagOnly(refTags(linkify(esc(note))),links)+'</div>';}
function decTone(t){return t==='y'||t==='n'?t:'o';}
// a fill-in field: its label, and a box to type in, Yes/No, a list to choose from or a UTC time
function renderField(it,depth,o){
  var nt=!!(o&&o.note),em=nt?!!o.edit:editMode,stripe=o&&o.stripe?' stripe-'+o.stripe:'';
  var ls=it.links.length&&(it.ls==='tag'||it.ls==='icon')?it.ls:'button',lab=refTags(esc(it.text));
  if(ls==='tag') lab=tagLinks(lab,it.links,it.note);
  var h='<div class="item d'+Math.min(depth,3)+' fx'+stripe+'" data-item="'+it.id+'">'+(em?'<div class="row" data-act="editItem" data-id="'+it.id+'" tabindex="0" role="button">':'<div class="row">')+
    (depth?'<span class="ibox dot" aria-hidden="true"></span>':'')+'<div class="txt"><div class="fx-l">'+(lab||'<span class="ph">Untitled field</span>')+smLinks(it,ls)+'</div>';

// ---------- the holdover time block: start of anti-icing and the HOT from the table; the app does the clock ----------
function hotTimes(m){
  var mn=parseInt(m.min,10),mx=parseInt(m.max,10);
  if(!m.t0||!(mn>0)) return null;
  return {t0:m.t0,mn:mn,min:m.t0+mn*60000,max:mx>=mn?m.t0+mx*60000:null};
}
function utcMinOf(ms){var d=new Date(ms);return d.getUTCHours()*60+d.getUTCMinutes();}
function minsTxt(ms){var m=Math.max(0,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+' h '+pad2(m%60)+' min';}
function hotAbs(hm){
  // the start is now or earlier: a time more than an hour ahead is yesterday's
  var mins=parseHM(hm);if(mins===null) return 0;
  var d=new Date(),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0,mins);
  if(t>Date.now()+3600000) t-=86400000;
  return t;
}
function hotSync(m){
  var T=hotTimes(m),now=Date.now();
  m.aMin=!!T&&now>=T.min;m.aMax=!!(T&&T.max)&&now>=T.max;alerting.delete(m.id);
}
function hotCheck(m,now){
  var T=hotTimes(m);if(!T) return;
  if(!m.aMin&&now>=T.min){m.aMin=true;saveSoon();if(now-T.min<120000) cdFire(m,'Minimum HOT expired');}
  if(T.max&&!m.aMax&&now>=T.max){m.aMax=true;saveSoon();if(now-T.max<120000) cdFire(m,'Maximum HOT expired');}
}
function hotLiveHTML(m,now){
  var T=hotTimes(m);
  if(!T) return '<p class="hot-empty">Enter the start of anti-icing and the minimum and maximum HOT from the table.</p>';
  var end=T.max||T.min+(T.min-T.t0)*0.5,span=end-T.t0,pc=function(x){return Math.max(0,Math.min(100,x/span*100));};
  var st,tx,t1=m.fluid==='I',pre='If precipitation has occurred since the start of the fluid: ';
  if(now<T.min){st='g';tx='<b>Within the minimum HOT</b>Minimum HOT in '+minsTxt(T.min-now)+'.';}
  else if(!T.max||now<T.max){
    st='a';tx='<b>Minimum HOT expired '+minsTxt(now-T.min)+' ago</b>'+(t1?'Type I fluid: if precipitation has occurred since the start of the fluid, return for treatment.':pre+'PCI within 5 min of take-off'+(m.fluid?'.':' (Type II, III or IV fluid; with Type I, return for treatment).'));
  }else{
    st='r';tx='<b>Maximum HOT expired '+minsTxt(now-T.max)+' ago</b>'+(t1?'Type I fluid: if precipitation has occurred since the start of the fluid, return for treatment.':
      T.mn>=20?pre+'external PCI (the minimum HOT is 20 min or more), or return for a complete de-icing treatment.':pre+'return for a complete de-icing treatment. An external PCI needs a minimum HOT of 20 min or more.');
  }
  var h='<div class="hot-bar'+(now>=end&&T.max?' over':'')+'"><i class="g" style="width:'+pc(T.min-T.t0)+'%"></i><i class="a" style="width:'+(100-pc(T.min-T.t0))+'%"></i><em style="left:'+pc(now-T.t0)+'%"></em></div>'+
    '<div class="hot-tl"><span>'+hmZ(utcMinOf(T.t0)).slice(0,4)+'</span><span style="left:'+pc(T.min-T.t0)+'%">Min '+hmZ(utcMinOf(T.min)).slice(0,4)+'</span>'+(T.max?'<span class="r">Max '+hmZ(utcMinOf(T.max)).slice(0,4)+'</span>':'')+'</div>'+
    '<div class="hot-st '+st+'">'+tx+'</div>';
  if(T.max) h+='<div class="hot-r2"><span>Maximum HOT</span><b>'+hmZ(utcMinOf(T.max))+' · '+(now<T.max?'in '+minsTxt(T.max-now):'expired')+'</b></div>';
  return h+'<div class="hot-cl"><button type="button" class="lnkbtn" data-act="hotClear" data-id="'+m.id+'">Clear the times</button></div>';
}

function hotInput(t,fin){
  var f=find(t.getAttribute('data-id'));if(!f||f.node.type!=='hot') return;

/* Reminders: at UTC times every day, or a set time before a countdown */
function remDue(r,now){
  if(r.mode==='cd'){
    var c=cdById(r.cd);if(!c||c.target===null) return {prev:null,next:null,c:c};
    var t=c.target-r.min*60000;return t<=now?{prev:t,next:null,c:c}:{prev:null,next:t,c:c};
  }
  var day=Math.floor(now/86400000)*86400000,prev=null,next=null;
  r.times.forEach(function(x){
    var m=(+x.slice(0,2))*60+(+x.slice(2));
    [-1,0,1].forEach(function(k){var t=day+k*86400000+(m-r.lead)*60000;if(t<=now){if(prev===null||t>prev) prev=t;}else if(next===null||t<next) next=t;});
  });
  return {prev:prev,next:next};
}
function hmOf(t){var d=new Date(t);return hmZ(d.getUTCHours()*60+d.getUTCMinutes());}
function remText(r,now){
  if(r.mode==='cd'){
    var c=cdById(r.cd);if(!c) return 'Countdown deleted';
    return c.title+' − '+r.min+' min'+(c.target!==null?' · '+hmOf(c.target-r.min*60000):'');
  }
  var d=remDue(r,now);
  return hmOf(d.next+r.lead*60000)+(r.times.length>1?' · '+r.times.length+' a day':'')+(r.lead?' · alert '+r.lead+' min before':'');
}
function remWalk(fn){
  state.lists.forEach(function(L){L.sections.forEach(function(s){
    (function w(arr){arr.forEach(function(n){if(n.type==='check'){if(n.rem) fn(n);w(n.children);(n.dq||[]).forEach(function(x){w(x.items);});}});})(s.items);
  });});
}
function remMsg(it,r,d,now){
  var name=it.text||'Reminder',late=now-d.prev>120000;
  if(r.mode==='cd') return name+' · '+r.min+' min to '+(d.c?d.c.title:'countdown');
  return name+(r.lead?' in '+r.lead+' min':'')+(late?' (was due '+hmOf(d.prev+r.lead*60000)+')':'');
}
function remCheck(now){
  remWalk(function(it){
    var r=it.rem,d=remDue(r,now);
    if(d.prev===null) return;
    if(r.mode==='cd'){
      if(r.lastT!==null&&Math.abs(d.c.target-r.lastT)<20*60000) return;
      r.lastT=d.c.target;
    }else{
      if(d.prev<=r.last) return;
      r.last=d.prev;
    }
    saveSoon();
    if(now-d.prev<15*60000) remFire(it,remMsg(it,r,d,now));
  });
}
function remFire(it,msg){
  if(!it.info&&it.done) tick(it.id); // a ticked item comes back as to-do
  alerting.delete(it.id);alerting.set(it.id,msg);paintAlert();beep(3);
}
function remPaint(now){
  document.querySelectorAll('[data-remid]').forEach(function(el){
    var f=find(el.getAttribute('data-remid'));if(!f||!f.node.rem) return;
    var r=f.node.rem,t=remText(r,now),sp=el.querySelector('span');
    if(sp&&sp.textContent!==t) sp.textContent=t;

    var item=el.closest('.item');if(item) item.classList.toggle('rem-due',alerting.has(f.node.id));

}
function remMark(r){

  var now=Date.now(),d=remDue(r,now);
  if(r.mode==='cd') r.lastT=d.prev!==null&&d.c?d.c.target:null;

/* Calculator */
function calcKey(id,k){
  var f=find(id);if(!f) return;
  var m=f.node,e=m.expr,last=e.slice(-1),wasFresh=fresh.has(id),seg;
  fresh.delete(id);
  if(/^\d$/.test(k)){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg==='0') e=e.slice(0,-1);
    e+=k;
  }else if(k==='.'){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg.indexOf('.')>=0) return;
    e+=seg===''?'0.':'.';
  }else if(OPS.indexOf(k)>=0){
    if(e===''||e==='−') e=k==='−'?'−':'';
    else if(OPS.indexOf(last)>=0){
      if(k==='−'&&(last==='×'||last==='÷')) e+='−';
      else{e=e.replace(/[+−×÷]+$/,'');e=e===''?(k==='−'?'−':''):e+k;}
    }else{if(last==='.') e+='0';e+=k;}
  }else if(k==='C'){e='';
  }else if(k==='del'){e=e.slice(0,-1);
  }else if(k==='='){
    var ev=e.replace(/[+−×÷]+$/,'');
    if(!hasOp(ev)){if(wasFresh) fresh.add(id);return;}
    var r=calcEval(ev);
    if(r===null) return;
    if(r==='err'){toast('Can’t divide by zero');return;}
    m.hist.push({e:fmtExpr(ev.replace(/\.$/,'')),r:r});
    if(m.hist.length>8) m.hist=m.hist.slice(-8);
    e=r;fresh.add(id);
  }
  m.expr=e;saveSoon();updateCalc(m);
}
function calcHist(id,r){
  var f=find(id);if(!f||!r) return;
  var m=f.node;
  if(/[+−×÷]$/.test(m.expr)){m.expr+=r;fresh.delete(id);}
  else{m.expr=r;fresh.add(id);}
  saveSoon();updateCalc(m);
}
function updateCalc(m){
  var el=app.querySelector('[data-mod="'+m.id+'"]');if(!el) return;
  el.querySelector('[data-expr]').textContent=fmtExpr(m.expr)||'0';
  el.querySelector('[data-prev]').innerHTML=prevHTML(m.expr);
  el.querySelector('[data-hist]').innerHTML=histHTML(m);
}

    setTool:function(t){tool=t;el.querySelectorAll('[data-act="padTool"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});},

function openModEditor(id,isNew){

function openSecEditor(sid){

function openLists(manage){

      case 'dupe':
        var c=cloneList(L);c.title=L.title+' copy';

var CKEY='flightChecklist.cloud',CLOUD_QUIET=60000,CLOUD_GAP=180000;
function loadCloud(){
  var c=null;try{c=JSON.parse(localStorage.getItem(CKEY)||'null');}catch(e){}
  if(!c||typeof c!=='object') c={};
  return {repo:str(c.repo),token:str(c.token),on:!!(c.on&&c.repo&&c.token),photos:c.photos!==false,sha:str(c.sha),hash:str(c.hash),
    last:+c.last||0,err:str(c.err),kind:str(c.kind),up:Array.isArray(c.up)?c.up.filter(function(x){return typeof x==='string';}):[]};
}
var cloud=loadCloud(),cloudUp=new Set(cloud.up),cloudBusy=false,cloudProg='',cloudTickHash='',cloudChangedAt=0,cloudRetryAt=0;
function saveCloud(){cloud.up=Array.from(cloudUp);try{localStorage.setItem(CKEY,JSON.stringify(cloud));}catch(e){}}
function strHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+'.'+s.length;}
function b64utf8(s){var b=new TextEncoder().encode(s),out='';for(var i=0;i<b.length;i+=0x8000) out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(out);}
function ghFetch(repo,token,method,path,body,accept){
  var o={method:method,cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':accept||'application/vnd.github+json'}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  return fetch('https://api.github.com/repos/'+repo+path,o);
}
function gh(method,path,body,accept){return ghFetch(cloud.repo,cloud.token,method,path,body,accept);}
function ghErr(r){
  var e=new Error('GitHub '+r.status);e.status=r.status;
  if((r.status===403||r.status===429)&&(r.headers.get('retry-after')||r.headers.get('x-ratelimit-remaining')==='0')) e.status=429; // asked to slow down
  return e;
}
function okJson(r){if(!r.ok) throw ghErr(r);return r.json();}
function whenZ(ms){
  var d=new Date(ms),n=new Date(),z=hmZ(d.getUTCHours()*60+d.getUTCMinutes());
  if(d.toISOString().slice(0,10)===n.toISOString().slice(0,10)) return z;
  return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+z;
}
function cloudPending(){
  var json=JSON.stringify(state,null,1);
  return {json:json,h:strHash(json),photos:cloud.photos?Array.from(allImgIds()).filter(function(id){return !cloudUp.has(id);}):[]};
}
function cloudDataSha(){
  return gh('GET','/contents/data.json',null,'application/vnd.github.object+json').then(function(r){
    if(r.status===404) return '';
    return okJson(r).then(function(j){return j.sha||'';});
  });
}
function cloudPutData(json){
  var body={message:'Backup '+new Date().toISOString().slice(0,16).replace('T',' ')+'Z from '+devName(),content:b64utf8(json)};
  if(cloud.sha) body.sha=cloud.sha;
  return gh('PUT','/contents/data.json',body).then(function(r){
    if(r.status!==409&&r.status!==422) return r;
    // the copy on GitHub changed (or we don't know it yet): fetch its id and try once more
    return cloudDataSha().then(function(sha){if(sha) body.sha=sha;else delete body.sha;return gh('PUT','/contents/data.json',body);});
  }).then(okJson).then(function(j){cloud.sha=(j.content&&j.content.sha)||'';});
}
function cloudPutPhoto(id){
  return imgGet(id).then(function(v){
    if(!v||typeof v.f!=='string'){cloudUp.add(id);return;}
    return gh('PUT','/contents/photos/'+id+'.jpg',{message:'Photo '+id,content:v.f.slice(v.f.indexOf(',')+1)}).then(function(r){
      if(r.ok||r.status===422){cloudUp.add(id);return;} // 422: it is already there
      throw ghErr(r);
    });
  });
}
function cloudFail(e){
  var st=e&&e.status,now=Date.now();
  if(!st){cloud.err='';cloud.kind='net';cloudRetryAt=now+60000;return;}
  if(st===429){cloud.err='';cloud.kind='wait';cloudRetryAt=now+900000;return;}
  if(st===401){cloud.kind='auth';cloud.err='GitHub no longer accepts the access token. It may have expired. Make a new one and enter it in Online backup.';cloudRetryAt=now+1800000;}
  else if(st===403||st===404){cloud.kind='access';cloud.err='The token can’t write to '+cloud.repo+'. It needs Contents: Read and write for that repository.';cloudRetryAt=now+1800000;}
  else{cloud.kind='other';cloud.err='GitHub had a problem ('+st+'). The app will try again.';cloudRetryAt=now+300000;}

function cloudRun(withData,p){
  if(cloudBusy||!cloud.on) return Promise.resolve(false);
  p=p||cloudPending();cloudBusy=true;cloudProg='Backing up…';cloudPaint();
  var chain=Promise.resolve(),ids=p.photos;
  if(withData&&p.h!==cloud.hash) chain=chain.then(function(){return cloudPutData(p.json);}).then(function(){cloud.hash=p.h;cloud.last=Date.now();saveCloud();});
  ids.forEach(function(id,i){
    chain=chain.then(function(){return i?new Promise(function(res){setTimeout(res,1200);}):null;}) // GitHub limits uploads per minute
      .then(function(){cloudProg='Uploading photo '+(i+1)+' of '+ids.length;cloudPaint();return cloudPutPhoto(id);})
      .then(function(){if(i%5===4) saveCloud();});
  });
  return chain.then(function(){cloud.err='';cloud.kind='';cloudRetryAt=0;return true;},function(e){cloudFail(e);return false;})
    .then(function(ok){cloudBusy=false;cloudProg='';saveCloud();cloudPaint();return ok;});
}
function cloudMaybe(){
  if(!cloud.on||cloudBusy||synBusy||navigator.onLine===false||Date.now()<cloudRetryAt) return;
  var p=cloudPending(),now=Date.now();
  if(p.h!==cloudTickHash){cloudTickHash=p.h;cloudChangedAt=now;}
  // a minute after the last change, and not more often than every few minutes
  var due=p.h!==cloud.hash&&now-cloudChangedAt>=CLOUD_QUIET&&now-cloud.last>=CLOUD_GAP;
  if(due||p.photos.length) cloudRun(due,p);
}
function cloudStatus(){
  if(!cloud.on) return {txt:'Off',bad:false};
  if(cloudBusy) return {txt:cloudProg||'Backing up…',busy:true};
  if(cloud.err) return {txt:cloud.err,bad:true};
  var p=cloudPending(),t;
  if(!cloud.last) t='Not backed up yet';
  else t='Last backup '+whenZ(cloud.last);
  var waiting=[];
  if(p.h!==cloud.hash) waiting.push('changes');
  if(p.photos.length) waiting.push(p.photos.length+' photo'+(p.photos.length>1?'s':''));
  if(waiting.length) t+=(navigator.onLine===false||cloud.kind==='net'?' · waiting for internet: ':' · to upload: ')+waiting.join(', ');
  return {txt:t,bad:false};
}
function cloudMenuText(){

function srWords(q){return q.toLowerCase().split(/\s+/).filter(Boolean);}
function srRx(words){return new RegExp('('+words.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','gi');}
function srHL(text,words){

}
function srSnip(text,words){
  text=String(text||'').replace(/\s+/g,' ').trim();if(!text) return '';
  var low=text.toLowerCase(),i=-1;
  words.forEach(function(w){var k=low.indexOf(w);if(k>=0&&(i<0||k<i)) i=k;});
  if(i<0) return text.length>110?srHL(text.slice(0,110),words)+'…':srHL(text,words);
  var a=Math.max(0,i-35),b=Math.min(text.length,i+85);
  return (a>0?'…':'')+srHL(text.slice(a,b),words)+(b<text.length?'…':'');

      }else if(n.type==='pad'&&n.text&&hit(n.title,n.text)) items.push({id:n.id,t:n.title,p:L.title+' › '+sec.title,n:n.text});
    });})(sec.items,[]);

  Object.keys(state.apNotes).sort().forEach(function(ic){
    var a=state.apNotes[ic];

/* ---------- Time: UTC clock, destination, countdowns, crew rest ---------- */
// TIME-START
function pad2(n){return (n<10?'0':'')+n;}
function parseHM(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  if(t.length===3) t='0'+t;
  if(t.length!==4) return null;
  var h=+t.slice(0,2),m=+t.slice(2);
  if(h>23||m>59) return null;
  return h*60+m;
}
function hmZ(min){min=((Math.round(min)%1440)+1440)%1440;return pad2(Math.floor(min/60))+pad2(min%60)+'Z';}
function durHM(min){min=Math.round(min);return Math.floor(min/60)+':'+pad2(min%60);}
function durClock(ms){
  var t=Math.ceil(Math.abs(ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h+':'+pad2(m)+':'+pad2(s);
}
// Next occurrence of an HHMM UTC time; up to 30 minutes in the past counts as today
function targetFromHM(min,now){
  var d=new Date(now),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())+min*60000;
  if(t<now-30*60000) t+=86400000;
  return t;
}
function restCalc(m){
  var s=parseHM(m.start),e=parseHM(m.end);
  if(s===null||e===null) return {err:'Enter the rest start and end times in UTC.'};
  if(e<=s) e+=1440;
  var total=e-s,n=m.n,B=m.buffer,usable=total-B*(n-1);
  if(usable<n*10) return {err:'The rest window is too short for '+n+' break'+(n>1?'s':'')+'.'};
  var L=usable/n,rows=[];
  for(var i=0;i<n;i++){
    var bs=s+i*(L+B),be=bs+L;
    if(i>0) bs=m.round?Math.round(bs/5)*5:Math.round(bs);
    be=(i===n-1)?e:(m.round?Math.round(be/5)*5:Math.round(be));
    rows.push({s:bs,e:be});
  }
  return {s:s,e:e,total:total,rows:rows};
}
// TIME-END
function restOutHTML(m){
  var r=restCalc(m);
  if(r.err) return '<div class="rest-msg">'+esc(r.err)+'</div>';
  // while setting up: names can be typed, and tapping a break's times marks it as yours
  var me=restMineIdx(m,r),h=r.rows.map(function(x,i){
    var my=i===me;
    return '<div class="rrow'+(my?' mine':'')+'" data-ri="'+i+'"><input type="text" data-rlabel="'+i+'" data-id="'+m.id+'" value="'+esc(m.labels[i]||'')+'" placeholder="Break '+(i+1)+'" aria-label="Name for break '+(i+1)+'" autocomplete="off">'+
      '<button type="button" class="rright rpick" data-act="restMine" data-id="'+m.id+'" data-i="'+i+'" aria-pressed="'+my+'" aria-label="'+(my?'Your break. Tap to unmark it':'Mark break '+(i+1)+' as yours')+'">'+(my?'<i class="you">You</i>':'')+
      '<span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></button></div>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+h+'<div class="rest-sum">'+(me<0?'<span class="rest-hint">Tap the times of your break to mark it as yours.</span> ':'')+'Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}
function restMineIdx(m,r){return typeof m.mine==='number'&&m.mine>=0&&m.mine<r.rows.length?m.mine:-1;}
function restInfo(m,now){
  var r=restCalc(m);
  if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,txt='',on=false,idx=-1,me=restMineIdx(m,r);
  if(rel<r.total){
    for(var i=0;i<r.rows.length;i++){
      var x=r.rows[i];
      if(abs>=x.s&&abs<x.e){
        idx=i;on=true;
        txt=i===me?'Your rest: '+durHM(Math.ceil(x.e-abs))+' left':'Now: '+(m.labels[i]||'Break '+(i+1))+', '+durHM(Math.ceil(x.e-abs))+' left'+(me>i?' · yours in '+durHM(Math.ceil(r.rows[me].s-abs)):'');
        break;
      }
      if(abs<x.s){txt='Handover, next at '+hmZ(x.s)+(i===me?' (yours)':'');break;}
    }
  }else{
    var wait=1440-rel;
    txt=wait>720?'Rest finished':me>=0?'Your rest in '+durHM(Math.ceil(wait+r.rows[me].s-r.s)):'Starts in '+durHM(Math.ceil(wait));
  }
  return {txt:txt,on:on,idx:idx};
}

      '<span class="rname"><span>'+esc(nm)+'</span>'+(my?'<i class="you">You</i>':'')+'</span>'+
      '<span class="rright"><span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></span></button>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+rows+'<div class="rest-sum">'+(me<0?'<span class="rest-hint">Tap your break to mark it as yours.</span> ':'')+
    'Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';

  function fail(){holCache[k]={err:Date.now()};holSave();delete holBusy[k];}

var holLibP=null;

function prepRemove(id){

  var D=prepDuty(t,L),nm=t.fno||(ap3(t.dep)+'–'+ap3(t.dest));
  function go(list){
    var before=JSON.stringify(state),ids=list.map(function(x){return x.id;}),H=state.prepHidden||(state.prepHidden=[]);
    state.trips=(state.trips||[]).filter(function(x){return ids.indexOf(x.id)<0;});
    list.forEach(function(x){if(x.src!=='me'&&H.indexOf(x.id)<0) H.push(x.id);if(state.prep) delete state.prep[x.id];});
    if(H.length>300) H.splice(0,H.length-300);
    if(ids.indexOf(prepSel)>=0) prepSel=null;
    if(!prepTrips(Date.now()).length) prepEdit=false;
    save();refreshTool();offerUndo(before,list.length>1?'Duty removed':nm+' removed');
  }
  if(D.length<2){go([t]);return;}
  openSheet('<h3>Remove '+esc(nm)+'?</h3><p class="hint">It’s part of a duty: '+esc(D.map(function(x){return x.fno||(ap3(x.dep)+'–'+ap3(x.dest));}).join(', '))+'.</p>'+
    '<div class="sh-actions"><button type="button" class="btn" data-sact="one">Only '+esc(nm)+'</button><button type="button" class="btn danger" data-sact="all">The whole duty</button></div>',
  function(act){closeSheet();if(act==='one') go([t]);else if(act==='all') go(D);});
}
function prepTripOf(id){return prepTrips(Date.now()).filter(function(t){return t.id===id;})[0]||null;}
function prepAct(act,el){
  var id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  switch(act){
    case 'prepAdd': prepAddSheet();return;
    case 'prepPaste': case 'prepImport': (window.AIRPORT_DATA?Promise.resolve():loadAirports()).then(rosterSheet,function(){toast('The airport list didn’t load. Try again.');});return;
    case 'prepTime': prepTimeSheet(id,v);return;
    case 'prepPlan': prepPlanSheet(id,v||null);return;
    case 'prepShow': prepTab=prepTab===v?'':v;refreshTool();return;
    case 'prepFx': fxFetch(true);refreshTool();return;
    case 'prepTel': prepTelSheet(v);return;
    case 'prepTelDel': var pt=prepPlace(v);pt.tel=pt.tel.filter(function(x){return x.id!==id;});save();refreshTool();return;
    case 'prepRm': prepRemove(id);return;
    case 'prepEditL': prepEdit=!prepEdit;refreshTool();return;
    case 'prepNotesEdit': openTool('apn');apnOpenAirport(v);return;
    case 'prepFc': prepFetch(v,true);refreshTool();return;
    case 'prepWx':
      var t=prepTripOf(prepSel);if(!t||wxSt.busy) return;
      var ids=[t.dest,t.dep].concat(prepAlts(t)).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
      var p=wxFetch(ids);refreshTool();if(p&&p.then) p.then(function(){var d=prepData(t.id);if(wxData(t.dest)){d.seen.wx=true;save();}if(toolOpen&&toolKind==='prep') refreshTool();});
      return;
    case 'prepAltAdd': case 'prepAltDel':
      var tr=prepTripOf(prepSel);if(!tr) return;
      var d=prepData(tr.id),al=prepAlts(tr).slice();
      if(act==='prepAltDel') al=al.filter(function(x){return x!==v;});
      else{var inp=$('#prepAltIn'),ic=apCode(inp&&inp.value);if(!/^[A-Z]{4}$/.test(ic)||!apRecOf(ic)){toast('Type an ICAO or IATA code');return;}if(al.indexOf(ic)<0&&al.length<4) al.push(ic);}
      d.alts=al;save();refreshTool();return;
    case 'prepPkCd':
      var dp=prepData(id),tp=prepTripOf(id);if(!dp.pickup||!tp) return;
      var c=newCd();c.title='Pick-up '+ap3(tp.dest);c.target=dp.pickup;state.tools.cds.push(c);save();toast('Added to Timers');return;
    case 'prepPlAdd':
      var pi=$('#prepPlIn'),pv=String(pi&&pi.value||'').trim();if(!pv) return;
