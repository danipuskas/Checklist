<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Flight Checklists</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklists">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1f26" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8ecf0" media="(prefers-color-scheme: light)">
<style>:root{--ts:1;--sp:1}

:root{
  color-scheme:light;
  --bg:#e8ecf0; --bg-glass:rgba(232,236,240,.86);
  --surface:#ffffff; --surface2:#f1f4f7; --paper:#ffffff;
  --line:#d9dfe6; --line-soft:#e9edf1; --line-strong:#b9c3ce;
  --text:#111820; --muted:#5b6876;
  --accent:#0a7699; --accent-weak:rgba(10,118,153,.11); --on-accent:#ffffff;
  --done:#12823e; --done-weak:rgba(18,130,62,.11); --on-done:#ffffff;
  --box:#a5b0bd; --danger:#c3302b; --ink:#0f2440; --warn:#a35400; --warn-weak:rgba(163,84,0,.12);
  --grid:rgba(17,24,32,.11); --press:rgba(17,24,32,.06);
  --shadow:0 14px 44px rgba(12,20,30,.24);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1a1f26; --bg-glass:rgba(26,31,38,.86);
    --surface:#232931; --surface2:#2b323b; --paper:#1d2229;
    --line:#343c47; --line-soft:#2c333c; --line-strong:#4a5461;
    --text:#edf1f5; --muted:#8f9bab;
    --accent:#4cc6e6; --accent-weak:rgba(76,198,230,.14); --on-accent:#06202a;
    --done:#3fd27e; --done-weak:rgba(63,210,126,.13); --on-done:#06200f;
    --box:#66727f; --danger:#ff7066; --ink:#eef3f8; --warn:#ffb54a; --warn-weak:rgba(255,181,74,.15);
    --grid:rgba(255,255,255,.075); --press:rgba(255,255,255,.06);
    --shadow:0 14px 44px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1a1f26; --bg-glass:rgba(26,31,38,.86);
  --surface:#232931; --surface2:#2b323b; --paper:#1d2229;
  --line:#343c47; --line-soft:#2c333c; --line-strong:#4a5461;
  --text:#edf1f5; --muted:#8f9bab;
  --accent:#4cc6e6; --accent-weak:rgba(76,198,230,.14); --on-accent:#06202a;
  --done:#3fd27e; --done-weak:rgba(63,210,126,.13); --on-done:#06200f;
  --box:#66727f; --danger:#ff7066; --ink:#eef3f8; --warn:#ffb54a; --warn-weak:rgba(255,181,74,.15);
  --grid:rgba(255,255,255,.075); --press:rgba(255,255,255,.06);
  --shadow:0 14px 44px rgba(0,0,0,.55);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:calc(17px*var(--ts))/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
button{font:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:6px;min-height:58px;padding:4px 10px 7px;background:var(--bg-glass);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line-soft)}
#barFill{height:100%;width:0;background:var(--accent);transition:width .25s ease}
#barFill.complete{background:var(--done)}
.tb-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.clock{appearance:none;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:3px 10px;border-radius:12px;min-width:0}
.clock:active{background:var(--press)}
.utc{font:650 21px/1.08 -apple-system,"SF Pro Display",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.utc small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px;letter-spacing:0}
.loc{font-size:12.5px;line-height:1.3;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px}
.loc b{color:var(--accent);font-weight:700}
.loc span{color:var(--text)}
.loc.noset{color:var(--accent)}
.title-row{display:flex;align-items:center;gap:8px}
.chip{font-size:calc(15px*var(--ts));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;padding:6px 6px 6px 4px;margin-left:auto;white-space:nowrap;flex:none}
.chip.complete{color:var(--done)}
.pill{appearance:none;border:0;background:var(--accent-weak);color:var(--accent);font-weight:600;font-size:16px;padding:9px 16px;border-radius:999px;min-width:72px}
body.editing .pill{background:var(--accent);color:var(--on-accent)}
.pill{min-width:64px;padding:9px 14px}
.ib{appearance:none;border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;padding:0}
.ib.round{background:var(--surface2);color:var(--text);border-radius:999px;width:40px;height:40px}
.ib:disabled{opacity:.3}
.ib.danger{color:var(--danger)}

/* Main */
main{max-width:760px;margin:0 auto;padding:4px 10px 48px}
.list-title{appearance:none;border:0;background:none;color:var(--accent);font:700 calc(34px*var(--ts))/1.12 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.02em;padding:calc(12px*var(--sp)) 6px calc(16px*var(--sp));display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;text-align:left}
.list-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-title svg{width:22px;height:22px;opacity:.6;stroke-width:2.5}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:0 0 calc(14px*var(--sp));overflow:hidden}
.sec-head{display:flex;align-items:center;padding-right:6px}
.sec-toggle{flex:1;min-width:0;appearance:none;border:0;background:none;color:var(--text);display:flex;align-items:center;gap:10px;padding:calc(14px*var(--sp)) 10px calc(13px*var(--sp)) 16px;text-align:left}
.sec-title{flex:1;min-width:0;font-size:calc(20px*var(--ts));font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-count{font-size:calc(15px*var(--ts));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.sec-count svg{width:17px;height:17px;stroke-width:3}
.sec.complete .sec-title,.sec.complete .sec-count{color:var(--done)}
.chev{display:inline-grid;place-items:center;color:var(--muted);transition:transform .2s ease}
.chev svg{width:18px;height:18px;stroke-width:2.5}
.sec.collapsed .sec-toggle .chev{transform:rotate(-90deg)}
.sec.collapsed .sec-body{display:none}
.sec-body{border-top:1px solid var(--line)}
.sec-head .ib{color:var(--accent)}
.sec-done{display:none;align-items:center;gap:8px;padding:calc(11px*var(--sp)) 16px;background:var(--done-weak);color:var(--done);font-weight:650;font-size:calc(16px*var(--ts));border-top:1px solid var(--line)}
.sec-done svg{stroke-width:3;width:18px;height:18px}
.sec.complete .sec-done{display:flex}
.empty{padding:16px;color:var(--muted);font-size:calc(15px*var(--ts))}

/* Items */
.sec-body > .item + .item,.sec-body > .module + .item{border-top:1px solid var(--line)}
.kids > .item{border-top:1px solid var(--line-soft)}
.row{display:flex;align-items:flex-start;gap:calc(12px*var(--sp));padding:calc(13px*var(--sp)) 10px calc(13px*var(--sp)) calc(16px*var(--sp));min-height:calc(52px*var(--sp));cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row:active{background:var(--press)}
.d1 > .row{padding-left:calc(50px*var(--sp))}
.d2 > .row{padding-left:calc(84px*var(--sp))}
.d3 > .row{padding-left:calc(118px*var(--sp))}
.box{flex:none;width:calc(26px*var(--sp));height:calc(26px*var(--sp));border-radius:50%;border:2px solid var(--box);display:grid;place-items:center;margin-top:-1px;transition:background-color .15s,border-color .15s}
.d1 > .row .box,.d2 > .row .box,.d3 > .row .box{width:calc(23px*var(--sp));height:calc(23px*var(--sp))}
.box svg{width:calc(16px*var(--sp));height:calc(16px*var(--sp));stroke:var(--on-done);stroke-width:3.2;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.done > .row .box{background:var(--done);border-color:var(--done)}
.done > .row .box svg{opacity:1;transform:none}
.box.pop{animation:pop .28s ease}
@keyframes pop{45%{transform:scale(1.2)}}
.txt{flex:1;min-width:0}
.label{font-weight:500;overflow-wrap:anywhere}
.ph{color:var(--muted);font-style:italic}
.done > .row .label{color:var(--done)}
.note{margin-top:3px;font-size:calc(15px*var(--ts));color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.note a{color:var(--accent);-webkit-user-select:text;user-select:text}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:calc(7px*var(--sp)) 11px;border-radius:10px;background:var(--accent-weak);color:var(--accent);font-size:calc(14px*var(--ts));font-weight:600;text-decoration:none}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk svg{width:15px;height:15px}
.kid-toggle{appearance:none;border:0;background:var(--surface2);color:var(--muted);border-radius:999px;padding:calc(5px*var(--sp)) 7px calc(5px*var(--sp)) 10px;display:inline-flex;align-items:center;gap:2px;font-size:calc(13px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.kid-toggle .chev svg{width:15px;height:15px}
.kclosed > .row .kid-toggle .chev{transform:rotate(-90deg)}
.kclosed > .kids{display:none}
.edit-hint{flex:none;color:var(--accent);display:grid;place-items:center;width:28px;height:26px}
.edit-hint svg{width:18px;height:18px}
body.editing .row{cursor:default}

/* Modules */
.module{margin:calc(10px*var(--sp));border-radius:13px;background:var(--surface2);border:1px solid var(--line)}
.sec-body > .item + .module{margin-top:calc(10px*var(--sp))}
.mod-head{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 2px}
.mod-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;appearance:none;border:0;background:none;color:var(--text);font-size:calc(16px*var(--ts));font-weight:600;padding:calc(10px*var(--sp)) 4px calc(10px*var(--sp)) 10px;text-align:left}
.mod-toggle > svg{width:19px;height:19px;color:var(--accent)}
.mod-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.module.collapsed .mod-body{display:none}
.module.collapsed .mod-toggle .chev{transform:rotate(-90deg)}
.mod-body{padding:0 10px calc(10px*var(--sp))}
.mod-head .ib{color:var(--accent);width:36px;height:36px}

/* Calculator */
.calc-hist{display:flex;flex-direction:column;align-items:flex-end}
.calc-hist .h{appearance:none;border:0;background:none;color:var(--muted);font:calc(14px*var(--ts))/1.35 ui-monospace,"SF Mono",Menlo,monospace;padding:3px 4px;text-align:right;max-width:100%;overflow-wrap:anywhere;border-radius:6px}
.calc-hist .h b{color:var(--text);font-weight:600}
.calc-hist .h:active{background:var(--press)}
.calc-disp{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:calc(9px*var(--sp)) 12px calc(8px*var(--sp));margin:4px 0 calc(8px*var(--sp));text-align:right}
.calc-expr{font:600 calc(26px*var(--ts))/1.2 ui-monospace,"SF Mono",Menlo,monospace;overflow-wrap:anywhere;letter-spacing:-.02em}
.calc-prev{font:calc(15px*var(--ts))/1.3 ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted);min-height:1.3em}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.k{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;height:calc(48px*var(--sp));font-size:calc(22px*var(--ts));font-weight:500;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.k:active{background:var(--press)}
.k.op{color:var(--accent);font-weight:600;font-size:calc(24px*var(--ts))}
.k.fn{color:var(--muted);font-size:calc(19px*var(--ts))}
.k.eq{grid-column:4;grid-row:4 / span 2;height:auto;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;font-size:calc(26px*var(--ts))}
.k.zero{grid-column:span 2}
.k svg{width:22px;height:22px}

/* Notepad */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font-size:calc(14px*var(--ts));font-weight:600;padding:7px 10px;border-radius:7px}
.seg button.on{background:var(--accent-weak);color:var(--accent)}
.seg.big button{font-size:calc(15px*var(--ts));padding:9px 16px}
.pad-tools{display:flex;align-items:center;gap:2px;margin-bottom:6px}
.tb{appearance:none;border:0;background:none;color:var(--muted);width:40px;height:38px;border-radius:9px;display:grid;place-items:center;padding:0}
.tb.on{background:var(--accent-weak);color:var(--accent)}
.pad-tools .sp{flex:1}
.canvas-wrap{border-radius:10px;overflow:hidden;border:1px solid var(--line);background-color:var(--paper);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.5px);background-size:22px 22px;background-position:11px 11px}
.canvas-wrap canvas{display:block;width:100%;height:200px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.finger .canvas-wrap canvas{touch-action:none}
.pad-extend{appearance:none;border:0;background:none;color:var(--muted);font-size:calc(14px*var(--ts));font-weight:600;padding:10px 4px 2px;display:inline-flex;align-items:center;gap:5px}
.pad-extend svg{width:15px;height:15px}
.pad-text{display:block;width:100%;min-height:160px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);font:max(16px,calc(17px*var(--ts)))/1.45 -apple-system,system-ui,sans-serif;padding:10px 12px;outline:none}
.pad-text:focus{border-color:var(--accent)}

/* Edit mode */
.add-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--line)}
.add-row button,.add-sec{appearance:none;flex:1 1 auto;border:1.5px dashed var(--line-strong);background:none;color:var(--accent);border-radius:10px;padding:11px 12px;font-size:calc(15px*var(--ts));font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.add-row svg,.add-sec svg{width:17px;height:17px}
.add-sec{display:flex;width:100%;padding:14px;margin-bottom:14px}
.flash{animation:flash 1.3s ease}
@keyframes flash{0%,35%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}
.foot{color:var(--muted);font-size:calc(13px*var(--ts));text-align:center;margin:20px 0 0}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px 24px;opacity:0;transition:opacity .18s;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-wrap[hidden]{display:none}
.sheet-wrap.show{opacity:1}
.sheet{width:100%;max-width:520px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;box-shadow:var(--shadow);transform:translateY(-8px);transition:transform .18s}
.sheet-wrap.show .sheet{transform:none}
.sheet h3{margin:0 0 14px;font-size:calc(20px*var(--ts));font-weight:650;letter-spacing:-.01em}
.fld{display:block;margin:0 0 14px}
.fld > .fl{display:block;font-size:calc(14px*var(--ts));font-weight:600;color:var(--muted);margin:0 0 6px}
.fl em{font-style:normal;font-weight:400}
.sheet input[type=text],.sheet textarea{display:block;width:100%;font:max(16px,calc(17px*var(--ts)))/1.35 -apple-system,system-ui,sans-serif;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
.sheet input[type=text]:focus,.sheet textarea:focus{border-color:var(--accent)}
.sheet textarea{resize:vertical}
.sheet .code{font:calc(13px*var(--ts))/1.4 ui-monospace,"SF Mono",Menlo,monospace}
.link-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:12px}
.link-row .ib{grid-row:1 / span 2;grid-column:2;align-self:center}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:calc(16px*var(--ts));font-weight:600;line-height:1.1;padding:12px 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.small{font-size:calc(14px*var(--ts));padding:9px 12px}
.btn.ghost{background:none;border-style:dashed;color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.4}
.sh-actions{display:flex;gap:8px;margin-top:6px}
.sh-actions .btn{flex:1}
.menu{display:flex;flex-direction:column;margin:-4px -6px 10px}
.menu button{appearance:none;border:0;background:none;color:var(--text);display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:12px;text-align:left;font-size:calc(17px*var(--ts));font-weight:500;line-height:1.25}
.menu button:active{background:var(--press)}
.menu button > svg{width:22px;height:22px;color:var(--accent)}
.menu .mt{flex:1;min-width:0}
.menu small{display:block;color:var(--muted);font-size:calc(13px*var(--ts));font-weight:400;margin-top:2px}
.tog{flex:none;width:48px;height:29px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:var(--done)}
.tog.on::after{left:22px}
.lrows{margin:-4px -4px 12px}
.lrow{display:flex;align-items:center;gap:2px;border-radius:12px;padding:2px}
.lrow.on{background:var(--accent-weak)}
.lpick{flex:1;min-width:0;appearance:none;border:0;background:none;color:var(--text);display:flex;align-items:center;gap:8px;padding:12px 10px;font-size:calc(17px*var(--ts));font-weight:600;text-align:left}
.ltitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcount{color:var(--muted);font-size:calc(14px*var(--ts));font-variant-numeric:tabular-nums}
.confirm{font-size:calc(17px*var(--ts));margin:2px 0 16px}
.hint{color:var(--muted);font-size:calc(14px*var(--ts));margin:-6px 0 12px}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:calc(15px*var(--ts));font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Countdown */
.cd-time{appearance:none;border:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;width:100%;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:calc(12px*var(--sp)) 10px calc(10px*var(--sp))}
.cd-rem{font:650 calc(42px*var(--ts))/1.05 -apple-system,"SF Pro Display",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd-sub{font-size:calc(15px*var(--ts));font-weight:600;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.cd.unset .cd-rem{color:var(--muted)}
.cd.unset .cd-sub{color:var(--accent)}
.cd.soon .cd-rem,.cd.past .cd-rem{color:var(--warn)}
.cd.soon .cd-time,.cd.past .cd-time{border-color:var(--warn)}
.cd-alert{display:none;align-items:center;gap:10px;margin-top:8px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--warn);color:var(--surface);font-weight:700;font-size:calc(17px*var(--ts))}
.cd-alert span{flex:1;min-width:0}
.cd-alert button{appearance:none;border:0;border-radius:9px;background:var(--surface);color:var(--text);font-weight:700;font-size:calc(16px*var(--ts));padding:9px 18px}
.cd.alerting .cd-alert{display:flex}
.cd.alerting{animation:cdpulse 1.2s ease-in-out infinite}
@keyframes cdpulse{50%{box-shadow:0 0 0 3px var(--warn)}}
.cd-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;margin-top:8px}
.cd.unset .cd-ctl .opt{display:none}
.cd-meta{font-size:calc(14px*var(--ts));color:var(--muted);margin-top:8px;text-align:center;font-variant-numeric:tabular-nums}
.cd-meta:empty{display:none}

/* Crew rest */
.rest-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tin{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;min-width:0}
.tin:focus-within{border-color:var(--accent)}
.tin > span{font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted)}
.tin input{flex:1;min-width:0;width:100%;border:0;background:none;color:var(--text);font:600 max(16px,calc(20px*var(--ts)))/1.2 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;outline:none;padding:2px 0;text-align:right}
.tin i{font-style:normal;font-weight:700;color:var(--muted);font-size:calc(14px*var(--ts))}
.rest-opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.rest-opts > *{flex:1 1 auto;justify-content:space-between}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper span{font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted);padding:0 4px 0 10px}
.stepper button{appearance:none;border:0;background:none;color:var(--accent);width:38px;height:38px;font-size:calc(22px*var(--ts));font-weight:600;padding:0}
.stepper b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-size:calc(17px*var(--ts))}
.selbox{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;height:40px}
.selbox span{font-size:calc(13px*var(--ts));font-weight:600;color:var(--muted)}
.selbox select{border:0;background:none;color:var(--text);font:600 calc(15px*var(--ts)) -apple-system,system-ui,sans-serif;height:38px;outline:none}
.togbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;height:40px;padding:0 12px;font-size:calc(14px*var(--ts));font-weight:600}
.togbtn.on{background:var(--accent-weak);border-color:transparent;color:var(--accent)}
.rest-out{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rest-msg{padding:14px;color:var(--muted);font-size:calc(15px*var(--ts))}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-top:1px solid var(--line-soft)}
.rright{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.rrow:first-child{border-top:0}
.rrow input{min-width:0;border:1px solid transparent;border-radius:8px;background:none;color:var(--text);font:600 max(16px,calc(16px*var(--ts))) -apple-system,system-ui,sans-serif;padding:7px 6px;outline:none}
.rrow input:focus{border-color:var(--accent);background:var(--surface)}
.rtime{font-size:calc(17px*var(--ts));font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.rdur{font-size:calc(13px*var(--ts));color:var(--muted);font-variant-numeric:tabular-nums}
.rrow.now{background:var(--done-weak)}
.rrow.now .rtime{color:var(--done)}
.rest-now{padding:10px 12px;font-size:calc(15px*var(--ts));font-weight:650;color:var(--muted);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rest-now:empty{display:none}
.rest-now.on{background:var(--done-weak);color:var(--done)}
.rest-sum{padding:9px 12px;border-top:1px solid var(--line);font-size:calc(14px*var(--ts));color:var(--muted);font-variant-numeric:tabular-nums}

/* Destination picker */
.icao-in{text-transform:uppercase;font-size:max(16px,calc(24px*var(--ts)))!important;font-weight:650;letter-spacing:.04em}
.icao-in::placeholder{text-transform:none;letter-spacing:0;font-weight:500}
.icao-res{margin:-4px 0 14px;min-height:22px}
.ap-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.ap-name{font-weight:650;font-size:calc(17px*var(--ts))}
.ap-meta{color:var(--muted);font-size:calc(15px*var(--ts));margin-top:2px;font-variant-numeric:tabular-nums}

.ap-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ap-list button{appearance:none;border:0;border-top:1px solid var(--line-soft);background:var(--surface2);color:var(--text);text-align:left;padding:11px 14px;font-size:calc(16px*var(--ts));display:flex;gap:10px;align-items:baseline}
.ap-list button:first-child{border-top:0}
.ap-list b{font-variant-numeric:tabular-nums;letter-spacing:.03em;flex:none}
.ap-list span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ap-note{color:var(--muted);font-size:calc(15px*var(--ts));margin:0 0 8px}
.ap-tz{display:block;width:100%;font:calc(16px*var(--ts)) -apple-system,system-ui,sans-serif;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.recent .fl{font-size:calc(14px*var(--ts));font-weight:600;color:var(--muted);margin-right:2px}
.recent button{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:calc(15px*var(--ts));font-weight:650;letter-spacing:.03em}

/* Menu panels and alert bar */
#toolWrap{z-index:45}
.tp-head{display:flex;align-items:center;gap:8px;margin:-4px -2px 14px 0}
.tp-head h3{flex:1;margin:0}
.tool-panel .module{margin:0;background:none;border:0;border-radius:0}
.tool-panel .mod-head{display:none}
.tool-panel .module.collapsed .mod-body{display:block}
.tool-panel .mod-body{padding:0}
.others{margin-top:18px}
.others .fl{display:block;font-size:calc(14px*var(--ts));font-weight:600;color:var(--muted);margin:0 0 6px}
.orow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);margin-top:6px}
.orow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.orow small{color:var(--muted);font-weight:500;font-size:calc(13px*var(--ts));margin-left:4px}
.orow b{font-variant-numeric:tabular-nums;font-weight:650;flex:none}
.orow b.warn{color:var(--warn)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 10px}
.ver{color:var(--muted);font-size:calc(13px*var(--ts));text-align:center;margin:10px 0 0}
.menu-row{display:flex;align-items:center;gap:14px;padding:10px 10px;flex-wrap:wrap}
.menu-row > svg{width:22px;height:22px;color:var(--accent)}
.menu-row .mt{flex:1 1 calc(100% - 36px);min-width:0;font-size:calc(17px*var(--ts));font-weight:500}
.menu-row .seg.ts{margin-left:36px;width:calc(100% - 36px);max-width:320px;display:grid;grid-template-columns:repeat(5,1fr);padding:2px}
.seg.ts button{min-width:0;height:40px;padding:0 8px;line-height:1;display:grid;place-items:center}
.seg.ts button span{font-weight:700}
.tool-panel .tin input{display:block;background:none;border:0;border-radius:0;padding:2px 0;font:600 max(16px,calc(20px*var(--ts)))/1.2 -apple-system,system-ui,sans-serif}
.tool-panel .rrow input{display:block;background:none;border:1px solid transparent;border-radius:8px;padding:7px 6px;font:600 max(16px,calc(16px*var(--ts))) -apple-system,system-ui,sans-serif}
.tool-panel .rrow input:focus{border-color:var(--accent);background:var(--surface)}
.tin input::placeholder{font-size:calc(15px*var(--ts));font-weight:500}
.alert-bar{position:fixed;z-index:80;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);max-width:540px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--warn);color:var(--surface);font-weight:700;font-size:calc(17px*var(--ts));line-height:1.25;box-shadow:var(--shadow);animation:abpulse 1.4s ease-in-out infinite}
.alert-bar[hidden]{display:none}
.alert-bar span{flex:1;min-width:0}
.alert-bar button{appearance:none;border:0;border-radius:9px;background:var(--surface);color:var(--text);font-weight:700;font-size:calc(16px*var(--ts));padding:9px 18px;flex:none}
@keyframes abpulse{50%{box-shadow:var(--shadow),0 0 0 4px var(--warn-weak)}}

/* Drag to reorder */
.grip{flex:none;display:grid;place-items:center;width:max(32px,calc(40px*var(--sp)));height:max(32px,calc(40px*var(--sp)));border-radius:10px;color:var(--muted);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip svg{width:22px;height:22px}
.grip:active{background:var(--press);color:var(--accent)}
.row .grip{margin:-8px -6px -8px 0}
.sec-head .grip{margin-right:2px}
.mod-head .grip{width:36px;height:36px}
.edit-tip{margin:-8px 6px 14px;color:var(--muted);font-size:calc(14px*var(--ts))}
.drag-hidden{display:none!important}
.drag-ph{margin:6px 10px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-weak)}
.kids > .drag-ph{margin-left:44px}
.d1 > .kids > .drag-ph{margin-left:78px}
.d2 > .kids > .drag-ph,.d3 > .kids > .drag-ph{margin-left:112px}
.row.drop-into{background:var(--accent-weak)!important;box-shadow:inset 0 0 0 2px var(--accent);border-radius:10px}
#app > .drag-ph{margin:0 0 14px;border-radius:16px}
.drag-ghost{position:fixed;z-index:90;pointer-events:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--accent);box-shadow:var(--shadow);color:var(--text);font-weight:600;font-size:calc(17px*var(--ts))}
.drag-ghost svg{width:20px;height:20px;color:var(--accent)}
.drag-ghost span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drag-ghost .gh-t{display:flex;flex-direction:column}
.drag-ghost .gh-into{display:none;font-style:normal;font-size:calc(13px*var(--ts));font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drag-ghost.nest{border-style:dashed}
.drag-ghost.nest .gh-into{display:block}
.drag-ghost small{flex:none;color:var(--muted);font-weight:500;font-size:calc(14px*var(--ts))}
body.dragging,body.dragging *{-webkit-user-select:none;user-select:none;cursor:grabbing}
body.secdrag .sec .sec-body{display:none}

/* Info items: not tickable */
.ibox{flex:none;width:calc(26px*var(--sp));height:calc(26px*var(--sp));display:grid;place-items:center;margin-top:-1px;color:var(--accent)}
.ibox svg{width:calc(22px*var(--sp));height:calc(22px*var(--sp));stroke-width:1.9}
.d1 > .row .ibox,.d2 > .row .ibox,.d3 > .row .ibox{width:calc(23px*var(--sp));height:calc(23px*var(--sp))}
.d1 > .row .ibox svg,.d2 > .row .ibox svg,.d3 > .row .ibox svg{width:calc(20px*var(--sp));height:calc(20px*var(--sp))}
body:not(.editing) .item.info > .row{cursor:default}
body:not(.editing) .item.info > .row:active{background:none}
.type-seg{display:grid;grid-template-columns:1fr 1fr}
.type-seg button{display:flex;align-items:center;justify-content:center;gap:7px}
.type-seg svg{width:18px;height:18px}

/* Headings inside a section */
.hd{background:var(--surface2);border-top:1px solid var(--line)}
.sec-body > .hd:first-child{border-top:0}
.hd-row{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:8px;min-height:calc(46px*var(--sp));padding:calc(9px*var(--sp)) 10px calc(9px*var(--sp)) 12px;color:var(--accent);text-align:left;font:inherit}
button.hd-row:active,.hd-row[role=button]:active{background:var(--press)}
.hd-title{flex:1;min-width:0;font-size:calc(16px*var(--ts));font-weight:700;overflow-wrap:anywhere}
.hd-count{font-size:calc(14px*var(--ts));font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.hd-count svg{width:16px;height:16px;stroke-width:3}
.hd.complete .hd-count,.hd.complete .hd-title{color:var(--done)}
.hd .chev,.hd .chev-sp{width:24px;flex:none;display:inline-grid;place-items:center}

.hd-row .edit-hint{margin-left:2px}
.hd-row .grip{margin:-8px -6px -8px 0}
.hfold{display:none!important}

/* Photos */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.thumb{appearance:none;padding:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;overflow:hidden;height:calc(88px*var(--sp));min-width:calc(88px*var(--sp));max-width:176px;display:block;position:relative}
.thumb img{display:block;height:100%;width:auto;min-width:100%;max-width:176px;object-fit:cover}
.ed-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ed-thumbs:empty{display:none}
.ed-thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.ed-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ed-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding:0}
.ed-x svg{width:14px;height:14px;stroke-width:2.6}
.missing img{display:none}
.missing::after{content:"Photo missing";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(11px*var(--ts));color:var(--muted);text-align:center}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.985);opacity:0;transition:opacity .18s}
.lb[hidden]{display:none}
.lb.show{opacity:1}
.lb-stage{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 60px) 8px calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lb-img{flex:none;max-width:none;max-height:none;transform-origin:50% 50%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;visibility:hidden}
.lb-img.ready{visibility:visible}
.lb-btn{position:absolute;appearance:none;border:0;width:44px;height:44px;border-radius:999px;background:rgba(18,22,28,.74);box-shadow:0 0 0 1px rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb-btn svg{width:22px;height:22px;stroke-width:2.4}
.lb-btn[hidden]{display:none}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 8px);right:10px}
.lb-prev,.lb-next{top:50%;margin-top:-22px}
.lb-prev{left:8px}
.lb-next{right:8px}
.lb-count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:60px;right:60px;text-align:center;color:#fff;font-size:15px;font-weight:600;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lb-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

@media (max-width:380px){
  main{padding-left:8px;padding-right:8px}
  .module{margin:8px}
  .mod-body{padding:0 8px 8px}
  .list-title{font-size:calc(30px*var(--ts))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ---------- Photos: kept in IndexedDB, which holds far more than localStorage ---------- */
var idbP=null,thumbCache=new Map();
function idb(){
  if(idbP) return idbP;
  idbP=new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('IndexedDB unavailable'));return;}
    var r=indexedDB.open('flightChecklistPhotos',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('imgs');};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
  idbP.catch(function(){idbP=null;});
  return idbP;
}
function idbRun(mode,fn){
  return idb().then(function(d){return new Promise(function(res,rej){
    var tx=d.transaction('imgs',mode),out,q=fn(tx.objectStore('imgs'));
    if(q) q.onsuccess=function(){out=q.result;};
    tx.oncomplete=function(){res(out);};
    tx.onerror=tx.onabort=function(){rej(tx.error);};
  });});
}
function imgGet(id){return idbRun('readonly',function(st){return st.get(id);});}
function imgPut(id,v){return idbRun('readwrite',function(st){st.put(v,id);});}
function imgPutMany(map){return idbRun('readwrite',function(st){Object.keys(map).forEach(function(id){var v=map[id];if(v&&typeof v.f==='string'&&typeof v.t==='string') st.put({f:v.f,t:v.t},id);});});}
function imgKeys(){return idbRun('readonly',function(st){return st.getAllKeys();});}
function imgDelMany(ids){return idbRun('readwrite',function(st){ids.forEach(function(id){st.delete(id);});});}
function allImgIds(){
  var set=new Set();
  function w(arr){arr.forEach(function(n){if(n.type==='check'){(n.imgs||[]).forEach(function(i){set.add(i);});w(n.children);}});}
  state.lists.forEach(function(L){L.sections.forEach(function(s){w(s.items);});});
  return set;
}
function gcImages(){
  var used=allImgIds();
  imgKeys().then(function(keys){
    var gone=(keys||[]).filter(function(k){return !used.has(k);});
    if(gone.length) return imgDelMany(gone);
  }).catch(function(){});
}
function scaleImage(img,max,q){
  var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  var out=c.toDataURL('image/jpeg',q);
  c.width=c.height=0; // frees the canvas memory straight away on iPad
  return out;
}
// Full-size copy: up to about 8 megapixels, so small print stays sharp when zoomed
function scaleFull(img){
  var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,Math.sqrt(8e6/(w*h)),6000/Math.max(w,h));
  return scaleImage(img,Math.max(w,h)*k,0.9);
}
function readPhoto(file){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onerror=function(){rej(new Error('Unreadable file'));};
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){try{res({f:scaleFull(img),t:scaleImage(img,360,0.78)});}catch(e){rej(e);}};
      img.onerror=function(){rej(new Error('Unreadable image'));};
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}
function fillImages(root){
  root.querySelectorAll('img[data-img]').forEach(function(img){
    if(img.getAttribute('src')) return;
    var id=img.getAttribute('data-img'),t=thumbCache.get(id);
    if(t){img.src=t;return;}
    imgGet(id).then(function(v){
      if(v&&v.t){thumbCache.set(id,v.t);img.src=v.t;}
      else if(img.parentElement) img.parentElement.classList.add('missing');
    }).catch(function(){});
  });
}
function collectImages(){
  var ids=Array.from(allImgIds()),out={};
  return Promise.all(ids.map(function(id){return imgGet(id).then(function(v){if(v) out[id]=v;});})).then(function(){return out;});
}

function walk(arr,anc,id){
  for(var i=0;i<arr.length;i++){
    var n=arr[i];
    if(n.id===id) return {node:n,arr:arr,idx:i,anc:anc};
    if(n.children&&n.children.length){var r=walk(n.children,anc.concat([n]),id);if(r) return r;}
  }
  return null;
}

  for(var a=0;a<state.lists.length;a++){var L=state.lists[a];
    for(var b=0;b<L.sections.length;b++){var r=walk(L.sections[b].items,[],id);if(r){r.section=L.sections[b];r.list=L;return r;}}}
  var T=state.tools;
  if(T&&T.cd.id===id) return {node:T.cd,arr:[T.cd],idx:0,anc:[],tool:true};
  if(T&&T.rest.id===id) return {node:T.rest,arr:[T.rest],idx:0,anc:[],tool:true};
  return null;
}

function safeUrl(u){

  if(/^(javascript|data|vbscript):/i.test(u)) return '#';

}
function linkHTML(l){

}
function linkify(escaped){
  return escaped.replace(/\b([a-z][a-z0-9+.-]{1,24}:\/\/[^\s<]+)/gi,function(m){
    if(/^(javascript|data|vbscript):/i.test(m)) return m;
    var t=m.match(/[.,;:!?)\]]+$/),tail=t?t[0]:'',u=tail?m.slice(0,-tail.length):m;
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'+tail;
  });
}

/* ---------- Calculator maths ---------- */
// CALC-START
var OPS='+−×÷';
function fmtNumStr(s){
  s=String(s);var neg=false;
  if(s[0]==='−'||s[0]==='-'){neg=true;s=s.slice(1);}
  var dot=s.indexOf('.'),i=dot<0?s:s.slice(0,dot),d=dot<0?'':s.slice(dot);
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'−':'')+i+d;
}
function fmtExpr(e){
  var out='',num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(num){out+=fmtNumStr(num);num='';}
    var prev=e[j-1],binary=prev!==undefined&&/[\d.]/.test(prev);
    out+=(ch==='−'&&!binary)?'−':' '+ch+' ';
  }
  if(num) out+=fmtNumStr(num);
  return out.replace(/\s+/g,' ').trim();
}
function hasOp(e){return /[+×÷]/.test(e)||/[\d.]−/.test(e);}
function calcEval(e){
  var t=[],num='';
  for(var j=0;j<e.length;j++){
    var ch=e[j];
    if(/[\d.]/.test(ch)){num+=ch;continue;}
    if(OPS.indexOf(ch)>=0){
      if(num===''){if(ch==='−'){num='-';continue;}return null;}
      if(num==='-') return null;
      t.push(parseFloat(num));num='';t.push(ch);
    }
  }
  if(num!==''&&num!=='-') t.push(parseFloat(num));
  while(t.length&&typeof t[t.length-1]==='string') t.pop();
  if(!t.length) return null;
  for(var k=0;k<t.length;k++){if(typeof t[k]==='number'&&isNaN(t[k])) return null;}
  var a=[t[0]];
  for(var i=1;i<t.length;i+=2){
    var op=t[i],n=t[i+1];
    if(op==='×') a[a.length-1]*=n;
    else if(op==='÷') a[a.length-1]/=n;
    else a.push(op,n);
  }
  var r=a[0];
  for(var q=1;q<a.length;q+=2) r=a[q]==='+'?r+a[q+1]:r-a[q+1];
  if(!isFinite(r)) return 'err';
  r=parseFloat(r.toPrecision(12));
  var s=String(r);
  if(/e/i.test(s)) return 'err';
  return s.replace('-','−');
}
// CALC-END

/* ---------- Rendering ---------- */
function countHTML(d,t){if(!t) return '';return d===t?I.check+'<span>Done</span>':d+'/'+t;}
function headGroups(s){
  // progress of the items under each heading, up to the next heading
  var m={},cur=null;
  s.items.forEach(function(it){
    if(it.type==='head'){cur=m[it.id]={d:0,t:0,n:0};return;}
    if(!cur) return;
    cur.n++;
    if(it.type==='check'&&!it.info){cur.t++;if(it.done) cur.d++;}
  });
  return m;
}
function renderHead(hd,c){
  c=c||{d:0,t:0,n:0};
  var chev=c.n?'<span class="chev">'+I.chev+'</span>':'<span class="chev-sp"></span>';
  var cnt='<span class="hd-count">'+countHTML(c.d,c.t)+'</span>';
  var title='<span class="hd-title">'+(esc(hd.title)||'<span class="ph">Heading</span>')+'</span>';
  var cls='hd'+(hd.collapsed&&c.n?' collapsed':'')+(c.t&&c.d===c.t?' complete':'');
  if(editMode) return '<div class="'+cls+'" data-mod="'+hd.id+'"><div class="hd-row" data-act="editMod" data-id="'+hd.id+'" role="button" tabindex="0">'+
    (c.n?'<button type="button" class="hd-fold" data-act="headFold" data-id="'+hd.id+'" aria-label="Fold or unfold">'+chev+'</button>':chev)+
    title+cnt+'<span class="edit-hint">'+I.edit+'</span><span class="grip" data-drag="item" data-id="'+hd.id+'" aria-hidden="true">'+I.grip+'</span></div></div>';
  if(!c.n) return '<div class="'+cls+'" data-mod="'+hd.id+'"><div class="hd-row">'+chev+title+cnt+'</div></div>';
  return '<div class="'+cls+'" data-mod="'+hd.id+'"><button type="button" class="hd-row" data-act="headFold" data-id="'+hd.id+'" aria-expanded="'+!hd.collapsed+'">'+chev+title+cnt+'</button></div>';
}
function renderItems(s){
  var g=headGroups(s),fold=false;
  return s.items.map(function(it){
    if(it.type==='head'){fold=!!it.collapsed&&g[it.id].n>0;return renderHead(it,g[it.id]);}
    var x=renderNode(it,0);
    return fold?x.replace('class="','class="hfold '):x;
  }).join('');
}
function renderNode(it,depth){
  if(it.type==='head'){var hf=find(it.id);return renderHead(it,hf?headGroups(hf.section)[it.id]:null);}
  if(it.type==='calc') return renderCalc(it);
  if(it.type==='pad') return renderPad(it);
  if(it.type==='cd') return renderCd(it);
  if(it.type==='rest') return renderRest(it);
  return renderCheck(it,depth);
}
function renderCheck(it,depth){
  var kids=it.children||[];
  var kt=kids.filter(function(k){return !k.info;}),kd=kt.filter(function(k){return k.done;}).length;
  var cls='item d'+Math.min(depth,3)+(it.info?' info':'')+(it.done?' done':'')+(kids.length&&it.open===false?' kclosed':'');
  var h='<div class="'+cls+'" data-item="'+it.id+'">';
  if(editMode) h+='<div class="row" data-act="editItem" data-id="'+it.id+'" tabindex="0" role="button">';
  else if(it.info) h+='<div class="row" data-id="'+it.id+'">';
  else h+='<div class="row" data-act="tick" data-id="'+it.id+'" tabindex="0" role="checkbox" aria-checked="'+it.done+'">';
  h+=(it.info?'<span class="ibox" aria-hidden="true">'+I.info+'</span>':'<span class="box">'+I.check+'</span>')+'<div class="txt"><div class="label">'+(esc(it.text)||'<span class="ph">Untitled item</span>')+'</div>';
  if(it.note) h+='<div class="note">'+linkify(esc(it.note))+'</div>';
  if(it.links.length) h+='<div class="links">'+it.links.map(linkHTML).join('')+'</div>';
  if(it.imgs&&it.imgs.length) h+='<div class="thumbs">'+it.imgs.map(function(im,i){return '<button type="button" class="thumb" data-act="viewImg" data-id="'+it.id+'" data-n="'+i+'" aria-label="Enlarge photo '+(i+1)+'"><img data-img="'+esc(im)+'" alt=""></button>';}).join('')+'</div>';
  h+='</div>';
  if(kids.length) h+='<button type="button" class="kid-toggle" data-act="toggleKids" data-id="'+it.id+'" aria-label="Show or hide sub-items">'+(kt.length?kd+'/'+kt.length:kids.length)+'<span class="chev">'+I.chev+'</span></button>';
  if(editMode) h+='<span class="edit-hint">'+I.edit+'</span><span class="grip" data-drag="item" data-id="'+it.id+'" aria-hidden="true">'+I.grip+'</span>';
  h+='</div>';
  if(kids.length) h+='<div class="kids">'+kids.map(function(k){return renderCheck(k,depth+1);}).join('')+'</div>';
  return h+'</div>';
}

/* ---------- Actions ---------- */
function tick(id){
  var f=find(id);if(!f) return;
  var it=f.node;if(it.info) return;
  it.done=!it.done;
  for(var i=f.anc.length-1;i>=0;i--){
    var p=f.anc[i];if(p.info) break;
    if(it.done){if(p.children.every(function(c){return c.done||c.info;})) p.done=true;else break;}
    else{if(p.done) p.done=false;else break;}
  }
  save();
  var top=f.anc[0]||it,topEl=app.querySelector('[data-item="'+top.id+'"]');
  if(topEl){
    var t=document.createElement('div');t.innerHTML=renderCheck(top,0);
    var nu=t.firstElementChild;topEl.replaceWith(nu);
    fillImages(nu);
    var target=nu.getAttribute('data-item')===it.id?nu:nu.querySelector('[data-item="'+it.id+'"]');
    var box=target&&target.querySelector('.row .box');
    if(box) box.classList.add('pop');
    var row=target&&target.querySelector('.row');
    if(row&&document.activeElement&&document.activeElement.classList.contains('row')) row.focus({preventScroll:true});
  }
  updateSec(f.section);updateProgress();
}

/* Calculator */
function calcKey(id,k){
  var f=find(id);if(!f) return;
  var m=f.node,e=m.expr,last=e.slice(-1),wasFresh=fresh.has(id),seg;
  fresh.delete(id);
  if(/^\d$/.test(k)){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg==='0') e=e.slice(0,-1);
    e+=k;
  }else if(k==='.'){
    if(wasFresh) e='';
    seg=(e.match(/[\d.]*$/)||[''])[0];
    if(seg.indexOf('.')>=0) return;
    e+=seg===''?'0.':'.';
  }else if(OPS.indexOf(k)>=0){
    if(e===''||e==='−') e=k==='−'?'−':'';
    else if(OPS.indexOf(last)>=0){
      if(k==='−'&&(last==='×'||last==='÷')) e+='−';
      else{e=e.replace(/[+−×÷]+$/,'');e=e===''?(k==='−'?'−':''):e+k;}
    }else{if(last==='.') e+='0';e+=k;}
  }else if(k==='C'){e='';
  }else if(k==='del'){e=e.slice(0,-1);
  }else if(k==='='){
    var ev=e.replace(/[+−×÷]+$/,'');
    if(!hasOp(ev)){if(wasFresh) fresh.add(id);return;}
    var r=calcEval(ev);
    if(r===null) return;
    if(r==='err'){toast('Can’t divide by zero');return;}
    m.hist.push({e:fmtExpr(ev.replace(/\.$/,'')),r:r});
    if(m.hist.length>8) m.hist=m.hist.slice(-8);
    e=r;fresh.add(id);
  }
  m.expr=e;saveSoon();updateCalc(m);
}
function calcHist(id,r){
  var f=find(id);if(!f||!r) return;
  var m=f.node;
  if(/[+−×÷]$/.test(m.expr)){m.expr+=r;fresh.delete(id);}
  else{m.expr=r;fresh.add(id);}
  saveSoon();updateCalc(m);
}
function updateCalc(m){
  var el=app.querySelector('[data-mod="'+m.id+'"]');if(!el) return;
  el.querySelector('[data-expr]').textContent=fmtExpr(m.expr)||'0';
  el.querySelector('[data-prev]').innerHTML=prevHTML(m.expr);
  el.querySelector('[data-hist]').innerHTML=histHTML(m);
}

/* Notepad */
function inkColor(){return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';}
function mountPad(el,m){
  var cv=el.querySelector('canvas'),wrap=cv.parentElement,ctx=cv.getContext('2d');
  var scale=1,lastW=0,tool='pen',curS=null,ink=inkColor();
  function dpr(){return Math.min(window.devicePixelRatio||1,3);}
  function size(force){
    var w=wrap.clientWidth;if(!w) return;
    if(w===lastW&&!force) return;
    lastW=w;scale=w/LW;
    var hpx=Math.round(m.h*scale),d=dpr();
    cv.style.height=hpx+'px';
    cv.width=Math.round(w*d);cv.height=Math.round(hpx*d);
    ctx.setTransform(d*scale,0,0,d*scale,0,0);
    redraw();
  }
  function setStyle(s,p){
    ctx.globalCompositeOperation=s.t==='e'?'destination-out':'source-over';
    ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineCap='round';ctx.lineJoin='round';
    return s.t==='e'?s.w:s.w*(0.35+p*1.3);
  }
  function seg(s,i){
    var P=s.pts,a=(i-1)*3,b=i*3;
    ctx.lineWidth=setStyle(s,(P[a+2]+P[b+2])/2);
    ctx.beginPath();ctx.moveTo(P[a],P[a+1]);ctx.lineTo(P[b],P[b+1]);ctx.stroke();
  }
  function dot(s){
    var P=s.pts,w=setStyle(s,P[2]);
    ctx.beginPath();ctx.arc(P[0],P[1],w/2,0,Math.PI*2);ctx.fill();
  }
  function drawStroke(s){var n=s.pts.length/3;dot(s);for(var i=1;i<n;i++) seg(s,i);}
  function redraw(){
    ink=inkColor();
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
    m.strokes.forEach(drawStroke);
    ctx.globalCompositeOperation='source-over';
  }
  function pt(e,r){
    return [+((e.clientX-r.left)/scale).toFixed(1),+((e.clientY-r.top)/scale).toFixed(1),e.pointerType==='pen'?+((e.pressure||0.5).toFixed(2)):0.5];
  }
  function down(e){
    if(curS) return;
    if(e.pointerType==='touch'&&!state.settings.fingerDraw) return;
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    curS={id:e.pointerId,s:{t:tool==='eraser'?'e':'p',w:tool==='eraser'?18:2.3,pts:pt(e,cv.getBoundingClientRect())}};
    dot(curS.s);
  }
  function move(e){
    if(!curS||e.pointerId!==curS.id) return;
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    var list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!list.length) list=[e];
    for(var i=0;i<list.length;i++){
      var p=pt(list[i],r),P=curS.s.pts;
      if(Math.abs(p[0]-P[P.length-3])<0.4&&Math.abs(p[1]-P[P.length-2])<0.4) continue;
      P.push(p[0],p[1],p[2]);seg(curS.s,P.length/3-1);
    }
  }
  function up(e){
    if(!curS||e.pointerId!==curS.id) return;
    m.strokes.push(curS.s);curS=null;
    ctx.globalCompositeOperation='source-over';
    saveSoon();
  }
  // Stop Apple Pencil (or a finger, when finger drawing is on) from scrolling the page
  function tstop(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].touchType==='stylus'||state.settings.fingerDraw){e.preventDefault();return;}
    }
  }
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('touchstart',tstop,{passive:false});
  cv.addEventListener('touchmove',tstop,{passive:false});
  var ro=window.ResizeObserver?new ResizeObserver(function(){size(false);}):null;
  if(ro) ro.observe(wrap);else window.addEventListener('resize',function(){size(false);});
  size(true);
  return {
    redraw:redraw,
    resize:function(){size(true);},
    setTool:function(t){tool=t;el.querySelectorAll('[data-act="padTool"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});},
    undo:function(){if(!m.strokes.length) return;m.strokes.pop();redraw();saveSoon();},
    dispose:function(){if(ro) ro.disconnect();}
  };
}

var sheetHandler=null,hideT=0;
function openSheet(html,handler){
  clearTimeout(hideT);
  sheetEl.innerHTML=html;sheetHandler=handler;
  sheetWrap.hidden=false;sheetWrap.scrollTop=0;void sheetWrap.offsetWidth;
  sheetWrap.classList.add('show');document.body.classList.add('noscroll');
}
function closeSheet(){
  if(document.activeElement&&sheetEl.contains(document.activeElement)) document.activeElement.blur();
  sheetHandler=null;
  sheetWrap.classList.remove('show');if(!toolOpen) document.body.classList.remove('noscroll');
  clearTimeout(hideT);
  hideT=setTimeout(function(){sheetWrap.hidden=true;sheetEl.innerHTML='';},200);
}
sheetWrap.addEventListener('click',function(e){
  if(e.target===sheetWrap){if(sheetHandler) sheetHandler('cancel',null);else closeSheet();return;}
  var b=e.target.closest('[data-sact]');

  sheetHandler(b.getAttribute('data-sact'),b);
});

/* ---------- Time: UTC clock, destination, countdowns, crew rest ---------- */
// TIME-START
function pad2(n){return (n<10?'0':'')+n;}
function parseHM(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  if(t.length===3) t='0'+t;
  if(t.length!==4) return null;
  var h=+t.slice(0,2),m=+t.slice(2);
  if(h>23||m>59) return null;
  return h*60+m;
}
function hmZ(min){min=((Math.round(min)%1440)+1440)%1440;return pad2(Math.floor(min/60))+pad2(min%60)+'Z';}
function durHM(min){min=Math.round(min);return Math.floor(min/60)+':'+pad2(min%60);}
function durClock(ms){
  var t=Math.ceil(Math.abs(ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h+':'+pad2(m)+':'+pad2(s);
}
// Next occurrence of an HHMM UTC time; up to 30 minutes in the past counts as today
function targetFromHM(min,now){
  var d=new Date(now),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())+min*60000;
  if(t<now-30*60000) t+=86400000;
  return t;
}
function restCalc(m){
  var s=parseHM(m.start),e=parseHM(m.end);
  if(s===null||e===null) return {err:'Enter the rest start and end times in UTC.'};
  if(e<=s) e+=1440;
  var total=e-s,n=m.n,B=m.buffer,usable=total-B*(n-1);
  if(usable<n*10) return {err:'The rest window is too short for '+n+' break'+(n>1?'s':'')+'.'};
  var L=usable/n,rows=[];
  for(var i=0;i<n;i++){
    var bs=s+i*(L+B),be=bs+L;
    if(i>0) bs=m.round?Math.round(bs/5)*5:Math.round(bs);
    be=(i===n-1)?e:(m.round?Math.round(be/5)*5:Math.round(be));
    rows.push({s:bs,e:be});
  }
  return {s:s,e:e,total:total,rows:rows};
}
// TIME-END
function restOutHTML(m){
  var r=restCalc(m);
  if(r.err) return '<div class="rest-msg">'+esc(r.err)+'</div>';
  var h=r.rows.map(function(x,i){
    return '<div class="rrow" data-ri="'+i+'"><input type="text" data-rlabel="'+i+'" data-id="'+m.id+'" value="'+esc(m.labels[i]||'')+'" placeholder="Break '+(i+1)+'" aria-label="Name for break '+(i+1)+'" autocomplete="off">'+
      '<span class="rright"><span class="rtime">'+hmZ(x.s).slice(0,4)+'–'+hmZ(x.e)+'</span><span class="rdur">'+durHM(x.e-x.s)+'</span></span></div>';
  }).join('');
  return '<div class="rest-now" data-status></div>'+h+'<div class="rest-sum">Total '+durHM(r.total)+(m.buffer?', with '+m.buffer+' min handover':'')+'</div>';
}
function restInfo(m,now){
  var r=restCalc(m);
  if(r.err) return null;
  var d=new Date(now),nowMin=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  var rel=((nowMin-r.s)%1440+1440)%1440,abs=r.s+rel,txt='',on=false,idx=-1;
  if(rel<r.total){
    for(var i=0;i<r.rows.length;i++){
      var x=r.rows[i];
      if(abs>=x.s&&abs<x.e){idx=i;txt='Now: '+(m.labels[i]||'Break '+(i+1))+', '+durHM(Math.ceil(x.e-abs))+' left';on=true;break;}
      if(abs<x.s){txt='Handover, next at '+hmZ(x.s);break;}
    }
  }else{
    var wait=1440-rel;
    txt=wait<=720?'Starts in '+durHM(Math.ceil(wait)):'Rest finished';
  }
  return {txt:txt,on:on,idx:idx};
}
function restStatus(m,el,now){
  var st=el.querySelector('[data-status]'),info=restInfo(m,now);
  el.querySelectorAll('.rrow').forEach(function(x,i){x.classList.toggle('now',!!info&&info.idx===i);});
  if(!info||!st) return;
  if(st.textContent!==info.txt) st.textContent=info.txt;
  st.classList.toggle('on',info.on);
}

/* Countdown alerts */
var actx=null;
function audioUnlock(){
  try{
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC) actx=new AC();}
    if(actx&&actx.state==='suspended') actx.resume();
  }catch(e){}
}

function beep(count){
  if(!state.settings.sound||!actx) return;
  try{
    var t=actx.currentTime+0.05;
    for(var i=0;i<(count||3);i++){
      var o=actx.createOscillator(),g=actx.createGain(),d=t+i*0.3;
      o.type='sine';o.frequency.value=i%2?1046:880;
      g.gain.setValueAtTime(0.0001,d);g.gain.exponentialRampToValueAtTime(0.45,d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,d+0.22);
      o.connect(g);g.connect(actx.destination);o.start(d);o.stop(d+0.25);
    }
  }catch(e){}
}
function cdName(m){return m.title&&m.title!=='Countdown'?m.title:'the set time';}
function cdFire(m,msg){
  alerting.delete(m.id);alerting.set(m.id,msg); // newest alert last

  var ids=Array.from(alerting.keys());

  var id=ids[ids.length-1],msg=alerting.get(id)+(ids.length>1?' (+'+(ids.length-1)+' more)':'');

function cdSetTarget(m,t,now){
  m.target=t;alerting.delete(m.id);

  m.aZ=t===null||now>=t;
}
function cdCheck(m,now){
  if(m.target===null) return;
  if(m.lead&&!m.aL){
    var tl=m.target-m.lead*60000;
    if(now>=tl){m.aL=true;saveSoon();if(now-tl<120000) cdFire(m,m.lead+' min to '+cdName(m));}
  }
  if(!m.aZ&&now>=m.target){
    m.aZ=true;m.aL=true;saveSoon();
    if(now-m.target<120000) cdFire(m,cdName(m).charAt(0).toUpperCase()+cdName(m).slice(1)+' now');
  }

function cdPaint(m,el,now){
  var rem=el.querySelector('[data-rem]'),sub=el.querySelector('[data-sub]'),meta=el.querySelector('[data-meta]');
  var unset=m.target===null,diff=unset?0:m.target-now;
  el.classList.toggle('unset',unset);
  el.classList.toggle('past',!unset&&diff<=0);
  el.classList.toggle('soon',!unset&&diff>0&&!!m.lead&&diff<=m.lead*60000);
  el.classList.toggle('alerting',alerting.has(m.id));
  if(alerting.has(m.id)){var am=el.querySelector('[data-amsg]');if(am&&am.textContent!==alerting.get(m.id)) am.textContent=alerting.get(m.id);}
  if(unset){rem.textContent='-:--:--';sub.textContent='Tap to set a time';meta.textContent='';return;}
  var tz=hmZ(new Date(m.target).getUTCHours()*60+new Date(m.target).getUTCMinutes());
  rem.textContent=(diff<=0?'+':'')+durClock(diff);
  sub.textContent=(diff<=0?'since ':'to ')+tz;
  meta.textContent=m.lead?'Alert '+m.lead+' min before, at '+hmZ(Math.round((m.target-m.lead*60000)%86400000/60000)):'No early alert';

/* Destination time */
var dtfCache={};
function tzInfo(tz,now){
  try{
    var f=dtfCache[tz]||(dtfCache[tz]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'}));
    var p={};f.formatToParts(new Date(now)).forEach(function(x){p[x.type]=x.value;});
    var h=(+p.hour)%24,base=Math.floor(now/60000)*60000;
    var off=Math.round((Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute)-base)/60000);
    return {hm:pad2(h)+':'+p.minute,wd:p.weekday,off:off};
  }catch(e){return null;}
}
function fmtOff(m){var sg=m<0?'−':'+';m=Math.abs(m);return 'UTC'+sg+Math.floor(m/60)+(m%60?':'+pad2(m%60):'');}
function paintClock(now){
  var d=new Date(now);
  utcEl.innerHTML=pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+':'+pad2(d.getUTCSeconds())+'<small>Z</small>';
  var dest=state.settings.dest,info=dest&&tzInfo(dest.tz,now);

  var key=dest.icao+info.hm+info.wd+info.off;
  if(locEl.getAttribute('data-k')===key) return;
  locEl.setAttribute('data-k',key);
  locEl.innerHTML=(dest.icao?'<b>'+esc(dest.icao)+'</b> ':'')+'<span>'+info.hm+'</span> '+info.wd+' '+fmtOff(info.off).replace('UTC','');
}

var apP=null,apIdx=null;

function apIndex(){
  if(apIdx) return apIdx;
  var lines=window.AIRPORT_DATA.split('\n'),map=new Map();
  lines.forEach(function(l){map.set(l.slice(0,4),l);});
  return (apIdx={lines:lines,map:map});

function apRec(l){return {icao:l.slice(0,4),tz:window.AIRPORT_TZ[parseInt(l.slice(4,6),36)],cc:l.slice(6,8),name:l.slice(8)};}
function apFind(q){
  q=q.trim().toUpperCase();
  var ix=apIndex(),out=[],seen={};
  function add(l){var c=l.slice(0,4);if(!seen[c]){seen[c]=1;out.push(apRec(l));}}
  if(/^[A-Z0-9]{4}$/.test(q)&&ix.map.has(q)) add(ix.map.get(q));
  if(/^[A-Z0-9]{2,3}$/.test(q)){for(var i=0;i<ix.lines.length&&out.length<8;i++){if(ix.lines[i].lastIndexOf(q,0)===0) add(ix.lines[i]);}}

}

}
function dragOnUp(e){if(drag&&e.pointerId===drag.pid) dragFinish(true);}
function dragOnCancel(e){if(drag&&e.pointerId===drag.pid) dragFinish(false);}
function dragApplyChk(d){
  var f=find(d.id);if(!f) return;
  var node=f.node,oldParent=f.anc.length?f.anc[f.anc.length-1]:null,newParent=null,arr,idx=0;
  if(d.intoEl){
    var tf=find(d.intoEl.getAttribute('data-item'));if(!tf||tf.node===node) return;
    newParent=tf.node;
    f.arr.splice(f.arr.indexOf(node),1);newParent.children.push(node);
  }else{
    var box=d.ph.parentNode;if(!box) return;
    var inKids=box.classList.contains('kids');
    for(var n=box.firstElementChild;n&&n!==d.ph;n=n.nextElementSibling){
      if(n===d.orig) continue;
      if(inKids?n.classList.contains('item'):(n.classList.contains('item')||n.classList.contains('module')||n.classList.contains('hd'))) idx++;
    }
    if(inKids){var pf=find(box.parentNode.getAttribute('data-item'));if(!pf) return;newParent=pf.node;arr=newParent.children;}
    else{var ts=findSec(box.closest('.sec').getAttribute('data-sec'));if(!ts) return;arr=ts.section.items;}
    f.arr.splice(f.arr.indexOf(node),1);arr.splice(idx,0,node);
    if(!inKids){for(var j=idx-1;j>=0;j--){if(arr[j].type==='head'){arr[j].collapsed=false;break;}}}
  }
  if(newParent){newParent.open=true;if(!node.info&&!node.done) newParent.done=false;}
  if(oldParent&&oldParent!==newParent&&!oldParent.info){
    var tk=oldParent.children.filter(function(c){return !c.info;});
    if(tk.length&&tk.every(function(c){return c.done;})) oldParent.done=true;
  }
  save();
}
function dragApply(d){
  if(d.kind==='chk'){dragApplyChk(d);return;}
  var ph=d.ph,box=ph.parentNode;if(!box) return;
  var idx=0,n=box.firstElementChild;
  for(;n&&n!==ph;n=n.nextElementSibling){
    if(n===d.orig) continue;
    if(d.group&&d.group.indexOf(n)>=0) continue;
    if(d.kind==='sec'?n.classList.contains('sec'):d.kind==='sub'?n.classList.contains('item'):(n.classList.contains('item')||n.classList.contains('module')||n.classList.contains('hd'))) idx++;
  }
  if(d.kind==='sec'){
    var L=cur(),r=findSec(d.id);if(!r) return;
    L.sections.splice(L.sections.indexOf(r.section),1);L.sections.splice(idx,0,r.section);
  }else{
    var f=find(d.id);if(!f) return;
    var arr=f.arr;
    if(d.kind==='top'){var ts=findSec(ph.closest('.sec').getAttribute('data-sec'));if(!ts) return;arr=ts.section.items;}
    if(f.node.type==='head'){
      var st=f.arr.indexOf(f.node),len=1;
      while(st+len<f.arr.length&&f.arr[st+len].type!=='head') len++;
      var chunk=f.arr.splice(st,len);
      arr.splice.apply(arr,[idx,0].concat(chunk));
    }else{
      f.arr.splice(f.arr.indexOf(f.node),1);arr.splice(idx,0,f.node);
      // dropped into a folded heading group: unfold it so the item stays visible
      for(var j=idx-1;j>=0;j--){if(arr[j].type==='head'){arr[j].collapsed=false;break;}}
    }
  }
  save();
}
function dragFinish(commit){
  var d=drag;if(!d) return;
  drag=null;
  window.removeEventListener('pointermove',dragOnMove,true);
  window.removeEventListener('pointerup',dragOnUp,true);
  window.removeEventListener('pointercancel',dragOnCancel,true);
  document.removeEventListener('touchmove',dragNoScroll,{passive:false});
  try{d.g.releasePointerCapture(d.pid);}catch(_){}
  if(!d.started) return;
  cancelAnimationFrame(d.raf);clearTimeout(d.springT);clearTimeout(d.intoTimer);
  dragEndT=Date.now();dragSuppress=true;
  // keep the drop spot steady on screen: the item itself, or the item it went into
  var anchorId=commit&&d.intoEl?d.intoEl.getAttribute('data-item'):d.id;
  var at=(commit?(d.intoEl||d.ph):d.orig).getBoundingClientRect().top;
  if(!commit) d.orig.classList.remove('drag-hidden');
  if(commit) dragApply(d);
  d.gh.remove();
  document.body.classList.remove('dragging','secdrag');
  render();
  // Keep what was moved where the finger let go
  var an=app.querySelector('[data-sec="'+anchorId+'"],[data-item="'+anchorId+'"],[data-mod="'+anchorId+'"]');
  if(an) window.scrollBy(0,an.getBoundingClientRect().top-at);
  var el=app.querySelector('[data-sec="'+d.id+'"],[data-item="'+d.id+'"],[data-mod="'+d.id+'"]');
  if(!el) return;
  if(commit){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1400);}
}
window.addEventListener('pointerdown',function(){dragSuppress=false;},true); // a new touch is a real tap
app.addEventListener('pointerdown',function(e){
  var g=e.target.closest('.grip');
  if(!g||!editMode||drag) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  dragStart(g,e);
});

/* ---------- Events ---------- */
function onAct(e){
  if(e.target.closest('a')) return;
  if(e.target.closest('.grip')){dragSuppress=false;return;}
  if(dragSuppress){dragSuppress=false;if(Date.now()-dragEndT<300) return;}
  var root=e.currentTarget,el=e.target.closest('[data-act]');if(!el||!root.contains(el)) return;
  var id=el.getAttribute('data-id'),c;
  switch(el.getAttribute('data-act')){
    case 'tick': tick(id);break;
    case 'editItem': openItemEditor(id,false);break;
    case 'toggleKids': toggleKids(id);break;
    case 'toggleSec': toggleSec(id);break;
    case 'editSec': openSecEditor(id);break;
    case 'addItem': addItem(id);break;
    case 'addCalc': addModule(id,newCalc());break;
    case 'addPad': addModule(id,newPad());break;
    case 'addSection': addSection();break;
    case 'lists': openLists();break;
    case 'modToggle': modToggle(id);break;
    case 'editMod': openModEditor(id);break;
    case 'calcKey': calcKey(id,el.getAttribute('data-k'));break;
    case 'calcHist': calcHist(id,el.getAttribute('data-r'));break;
    case 'padMode': padMode(id,el.getAttribute('data-m'));break;
    case 'padTool': c=ctl.get(id);if(c) c.setTool(el.getAttribute('data-t'));break;
    case 'padUndo': c=ctl.get(id);if(c) c.undo();break;
    case 'padClear': padClear(id);break;
    case 'padExtend': padExtend(id);break;
    case 'addCd': addModule(id,newCd());break;
    case 'addRest': addModule(id,newRest());break;
    case 'addHead': addHead(id);break;
    case 'headFold': headFold(id);break;
    case 'cdSet': openCdEditor(id);break;
    case 'cdNudge': cdNudge(id,+el.getAttribute('data-d'));break;
    case 'cdClear': cdClear(id);break;
    case 'cdAck': cdAck(id);break;
    case 'restN':
      var rf=find(id);
      if(rf){rf.node.n=Math.max(1,Math.min(8,rf.node.n+(+el.getAttribute('data-d'))));saveSoon();restRefresh(rf.node);}
      break;
    case 'restRound':
      var rr=find(id);
      if(rr){rr.node.round=!rr.node.round;el.classList.toggle('on',rr.node.round);el.setAttribute('aria-pressed',String(rr.node.round));saveSoon();restRefresh(rr.node);}
      break;
    case 'viewImg':
      var vf=find(id);
      if(vf&&vf.node.imgs.length) openViewer(vf.node.imgs,+el.getAttribute('data-n')||0);
      break;
    case 'toolClose': closeTool();break;
  }
}
app.addEventListener('click',onAct);
toolPanel.addEventListener('click',onAct);
app.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('row')||(e.target.classList.contains('hd-row')&&e.target.tagName!=='BUTTON'))){e.preventDefault();e.target.click();}
});
function onInput(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-padtext]')){var f=find(t.getAttribute('data-padtext'));if(f){f.node.text=t.value;saveSoon();}}
  if(t.matches&&t.matches('[data-rest]')){
    var rf=find(t.getAttribute('data-id'));if(!rf) return;
    var k=t.getAttribute('data-rest');
    if(k==='buffer') rf.node.buffer=+t.value||0;else rf.node[k]=t.value.trim();
    saveSoon();restRefresh(rf.node);
  }
  if(t.matches&&t.matches('[data-rlabel]')){
    var lf=find(t.getAttribute('data-id'));if(!lf) return;
    lf.node.labels[+t.getAttribute('data-rlabel')]=t.value;saveSoon();
    if(document.activeElement!==t) restStatus(lf.node,t.closest('.module'),Date.now());
  }
}
app.addEventListener('input',onInput);
toolPanel.addEventListener('input',onInput);
function onChange(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-rest="start"],[data-rest="end"]')){
    var v=parseHM(t.value);if(v!==null){t.value=hmZ(v).slice(0,4);var f=find(t.getAttribute('data-id'));if(f){f.node[t.getAttribute('data-rest')]=t.value;saveSoon();}}
  }
  if(t.matches&&t.matches('[data-rest="buffer"]')){var bf=find(t.getAttribute('data-id'));if(bf&&bf.node.buffer!==(+t.value||0)){bf.node.buffer=+t.value||0;saveSoon();restRefresh(bf.node);}}
  if(t.matches&&t.matches('[data-rlabel]')){var lf=find(t.getAttribute('data-id'));if(lf) restStatus(lf.node,t.closest('.module'),Date.now());}
}
app.addEventListener('change',onChange);
toolPanel.addEventListener('change',onChange);
editBtn.addEventListener('click',function(){editMode=!editMode;render();});
menuBtn.addEventListener('click',openMenu);
document.addEventListener('keydown',function(e){
  if(!lb.hidden){
    if(e.key==='Escape') closeViewer();
    else if(e.key==='ArrowLeft'&&lbList.length>1) lbShow(lbIdx-1);
    else if(e.key==='ArrowRight'&&lbList.length>1) lbShow(lbIdx+1);
    return;
  }
  if(e.key==='Escape'&&!sheetWrap.hidden){if(sheetHandler) sheetHandler('cancel',null);else closeSheet();return;}
  if(e.key==='Escape'&&toolOpen) closeTool();
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden') save();});
window.addEventListener('pagehide',save);
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var onTheme=function(){ctl.forEach(function(c){c.redraw();});};
  if(mq.addEventListener) mq.addEventListener('change',onTheme);else if(mq.addListener) mq.addListener(onTheme);
}

render();
tickLoop();
if(loadedOK) setTimeout(gcImages,4000);
if(!storageOK) toast('Storage is off here, so changes won’t be kept');
if('serviceWorker' in navigator&&location.protocol==='https:'){var hadCtl=!!navigator.serviceWorker.controller,swReloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtl||swReloaded) return;swReloaded=true;try{save();}catch(e){}location.reload();});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible') navigator.serviceWorker.getRegistration().then(function(r){if(r) r.update();}).catch(function(){});});}
})();
</script>
